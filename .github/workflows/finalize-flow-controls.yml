name: finalize-flow-controls

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[flow-controls-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/materialized-text-flow-audit-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh changed source-lock entries
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = (
              "work/production_overrides/TT3B.json",
              "work/production_overrides/TT6C.json",
          )
          lock_path = Path("work/release_sources.json")
          payload = json.loads(lock_path.read_text(encoding="utf-8"))
          for relative in paths:
              raw = Path(relative).read_bytes()
              normalized = raw.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              entry = payload["files"][relative]
              if entry.get("normalization") != "lf":
                  raise SystemExit(f"unexpected normalization for {relative}")
              entry["sha256"] = hashlib.sha256(normalized).hexdigest().upper()
              entry["bytes"] = len(normalized)
          lock_path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-flow-controls.yml
      - name: Format and verify focused regressions
        run: |
          python -m pip install -r requirements.txt
          python -m black work/tests/test_materialized_text_flow_audit.py
          python -m ruff check work/tests/test_materialized_text_flow_audit.py
          python -m unittest work.tests.test_materialized_text_flow_audit work.tests.test_production_typography work.tests.test_production_translation
          git diff --check
      - name: Commit verified control layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve audited scene-flow controls [flow-controls-final]"
          git push origin HEAD:fix/materialized-text-flow-audit-20260915
