name: build Rebecca wording candidate

on:
  push:
    branches:
      - fix-rebecca-instructions-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh release source lock
        run: time-twist release-lock --update
      - name: Build candidate
        run: time-twist release-build --candidate --output-dir build/candidate
      - name: Record hashes
        run: |
          sha256sum build/candidate/* > build/candidate/SHA256SUMS.txt
          cp work/release_sources.json build/candidate/release_sources.updated.json
      - uses: actions/upload-artifact@v4
        with:
          name: rebecca-wording-candidate
          path: build/candidate
