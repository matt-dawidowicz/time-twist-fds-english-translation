name: Export repair source

on:
  push:
    branches:
      - fix/entropy-codec-architecture-20260910

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact head
        run: git rev-parse HEAD > REPAIR_HEAD.txt
      - name: Pack source
        run: tar --exclude=.git -czf time-twist-repair-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: time-twist-repair-source
          path: time-twist-repair-source.tar.gz
          if-no-files-found: error
          retention-days: 1
