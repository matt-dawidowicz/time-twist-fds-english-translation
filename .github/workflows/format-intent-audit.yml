name: format-intent-audit

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/format-intent-audit.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install black==25.1.0
      - name: Format audit code and remove temporary workflow
        run: |
          python -m black work/tools/translation_intent_audit.py work/tests/test_translation_intent_audit.py
          rm .github/workflows/format-intent-audit.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format translation intent-gap audit"
          git push origin HEAD:engineering/editorial-compression-20260902
