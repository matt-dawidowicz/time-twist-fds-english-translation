name: translation-quality-format-once

on:
  push:
    paths:
      - ".github/workflows/translation_quality_format_once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black work/tools/external_translation_compare.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tools/external_translation_compare.py
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "Format external comparison helper"
            git pull --rebase origin translation-quality-comparison-audit
            git push origin HEAD:translation-quality-comparison-audit
          fi
