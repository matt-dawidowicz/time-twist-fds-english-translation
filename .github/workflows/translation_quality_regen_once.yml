name: translation-quality-regen-once

on:
  push:
    paths:
      - ".github/workflows/translation_quality_regen_once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook.py
      - name: Commit regenerated review artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs work/translation_workbook_banks
          if git diff --cached --quiet; then
            echo "Review artifacts already current"
          else
            git commit -m "Refresh TT3A translation review artifacts"
            git pull --rebase origin translation-quality-comparison-audit
            git push origin HEAD:translation-quality-comparison-audit
          fi
