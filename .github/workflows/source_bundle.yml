name: source-bundle

on:
  push:
    branches:
      - tmp/local-build-source-bundle-20260924

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package public source tree
        run: |
          git archive --format=zip --output=time-twist-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: time-twist-source
          path: time-twist-source.zip
          if-no-files-found: error
