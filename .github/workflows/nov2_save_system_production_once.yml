name: NOV2 save system production once

on:
  push:
    branches:
      - translation-quality-comparison-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply six source-verified NOV2 records
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("work/time_twist/ui.py")
          text = ui_path.read_text(encoding="utf-8")
          marker = 'ENGLISH_WAIT_PROMPT = pack_records([encode_english("Please wait... ")])\n\n'
          addition = '''ENGLISH_WAIT_PROMPT = pack_records([encode_english("Please wait... ")])

          # Six save-system records were still Japanese in the English runtime image.
          # Every replacement retains its source packed-byte allocation and controls.
          NOV2_SAVE_SYSTEM_PATCHES = (
              (
                  0x25E6,
                  bytes.fromhex(
                      "0F 71 BF 9A 03 77 19 BF 19 AD C6 FF 24 60 E6 EE 33 7E 0D A3 7E 36 AE D3 68 FA"
                  ),
                  "A RAM Save{CTRL:0}B Disk{CTRL:0}Select Cancel ",
              ),
              (
                  0x2600,
                  bytes.fromhex("C9 69 8C 1C DD C6 6F C1 69 D0 2C CC 7D"),
                  "Saving{CTRL:0}to disk. ",
              ),
              (0x2631, bytes.fromhex("2F 5A 13 38 B8 7E 80"), "Chapter"),
              (0x263A, bytes.fromhex("C9 69 8C 1E E4 E6 CD D1 F4"), "Disk error"),
              (0x2643, bytes.fromhex("13 3A 1D 1F 40"), "Store"),
              (0x264C, bytes.fromhex("12 20 71 E6 7D"), "Fetch"),
          )

          '''
          if marker not in text:
              raise SystemExit("NOV2 constant marker missing")
          text = text.replace(marker, addition, 1)

          marker = "\n\ndef _patched_opaque_text_clears(data: bytes) -> bytes:\n"
          addition = '''

          def _patched_save_system_text(data: bytes) -> bytes:
              """Translate the remaining source-verified NOV2 save-system records."""
              result = bytearray(data)
              for offset, original, english in NOV2_SAVE_SYSTEM_PATCHES:
                  replacement = pack_records([encode_english(english)])
                  if len(replacement) != len(original):
                      raise UiPatchError(
                          f"NOV2 save-system text at 0x{offset:04X} changed packed size"
                      )
                  end = offset + len(original)
                  if len(result) < end or result[offset:end] != original:
                      raise UiPatchError(
                          f"NOV2 save-system text at 0x{offset:04X} does not match source"
                      )
                  result[offset:end] = replacement
              return bytes(result)


          def _patched_opaque_text_clears(data: bytes) -> bytes:
          '''
          if marker not in text:
              raise SystemExit("NOV2 function marker missing")
          text = text.replace(marker, addition, 1)

          old = "    with_wait_prompt = _patched_wait_prompt(data)\n    with_disk_prompts = _patched_disk_prompts(with_wait_prompt)\n"
          new = "    with_wait_prompt = _patched_wait_prompt(data)\n    with_save_system = _patched_save_system_text(with_wait_prompt)\n    with_disk_prompts = _patched_disk_prompts(with_save_system)\n"
          if old not in text:
              raise SystemExit("NOV2 patch-order marker missing")
          text = text.replace(old, new, 1)
          ui_path.write_text(text, encoding="utf-8")
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate production NOV2 patch
        run: |
          python -m black work/time_twist/ui.py
          python -m ruff check work/time_twist/ui.py
          python -m pydocstyle --convention=pep257 work/time_twist/ui.py
          python -m mypy
          python - <<'PY'
          from time_twist import ui
          from time_twist.english import encode_english
          from time_twist.textcodec import pack_records

          expected = (
              "A RAM Save{CTRL:0}B Disk{CTRL:0}Select Cancel ",
              "Saving{CTRL:0}to disk. ",
              "Chapter",
              "Disk error",
              "Store",
              "Fetch",
          )
          assert tuple(item[2] for item in ui.NOV2_SAVE_SYSTEM_PATCHES) == expected
          for offset, original, english in ui.NOV2_SAVE_SYSTEM_PATCHES:
              packed = pack_records([encode_english(english)])
              assert len(packed) == len(original), (hex(offset), len(packed), len(original))
          print("NOV2 six-record source/size contract: OK")
          PY
          python work/run_tests.py unit
      - name: Commit production change and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nov2_save_system_production_once.yml
          git add work/time_twist/ui.py
          git commit -m 'Translate missing NOV2 save-system text'
          git pull --rebase origin translation-quality-comparison-audit
          git push origin HEAD:translation-quality-comparison-audit
