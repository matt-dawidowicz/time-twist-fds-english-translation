name: format-nov2-regression

on:
  push:
    branches:
      - full-natural-dialogue

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format regression with repository Black version
        run: |
          python -m pip install black==25.1.0
          python -m black work/integration_tests/test_ui.py
          rm .github/workflows/format-nov2-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/integration_tests/test_ui.py .github/workflows/format-nov2-regression.yml
          git commit -m "Format NOV2 decoder regression"
          git push
