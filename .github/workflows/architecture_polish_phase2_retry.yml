name: architecture polish phase 2 retry

on:
  push:
    branches: [codebase-architecture-polish]
    paths: [.github/workflows/architecture_polish_phase2_retry.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codebase-architecture-polish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Replay validated phase 2 migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path(".github/workflows/architecture_polish_phase2.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          wanted = (
              "Move tests and runner into conventional locations",
              "Decouple every test from filesystem depth",
              "Update public contracts and documentation paths",
              "Verify moved fixture manifest is byte-identical",
              "Format and validate test infrastructure",
              "Prove generated review artifacts are unchanged",
          )
          for name in wanted:
              marker = f"      - name: {name}"
              start = lines.index(marker)
              run_line = next(
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].startswith("        run: |")
              )
              body = []
              for line in lines[run_line + 1 :]:
                  if (
                      line.startswith("      - name:")
                      or line.startswith("      - uses:")
                      or line.startswith("      - run:")
                  ):
                      break
                  body.append(line[10:] if line.startswith("          ") else line)
              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      textwrap.dedent("\n".join(body)) + "\n",
                  ],
                  check=True,
              )
          PY

      - name: Use the canonical fixture-manifest path everywhere
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_modern_module_layout.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from tests.support.paths import PROJECT_ROOT"
          old_path = (
              'fixture_path = PROJECT_ROOT / "work" / "integration_fixtures.json"'
          )
          if old_import not in text or old_path not in text:
              raise SystemExit("modern-layout fixture path no longer matches expected migrated form")
          text = text.replace(
              old_import,
              "from tests.support.paths import FIXTURE_MANIFEST",
              1,
          )
          text = text.replace(old_path, "fixture_path = FIXTURE_MANIFEST", 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m black tests/unit/test_modern_module_layout.py
          python -m ruff check --fix tests/unit/test_modern_module_layout.py
          python -m ruff check work tools tests

          if grep -R -n -E 'integration_fixtures\.json' tests --include='*.py' \
              | grep -v -E '^(tests/support/paths.py|tests/unit/test_public_tree.py):'; then
            echo "test consumers still hard-code the fixture manifest path" >&2
            exit 1
          fi

      - name: Run complete public unit suite
        run: python -m tools.maintenance.run_tests unit

      - name: Verify runner and private-fixture failure contract
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.maintenance.run_tests --help >/dev/null
          if python -m tools.maintenance.run_tests integration >/tmp/integration.out 2>&1; then
            echo "integration suite unexpectedly succeeded without private fixtures" >&2
            exit 1
          fi
          grep -q 'private integration fixtures are incomplete or changed' /tmp/integration.out

      - name: Build and verify installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -c "from pathlib import Path; import time_twist; imported = Path(time_twist.__file__).resolve(); checkout = Path('work/time_twist').resolve(); print(imported); assert checkout not in imported.parents"
          time-twist --help >/dev/null
          time-twist release-build --help >/dev/null

      - name: Verify production and translation sources are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            work/time_twist \
            work/translations \
            work/manifests \
            work/release_sources.json \
            work/title_assets
          test ! -e work/tests
          test ! -e work/integration_tests
          test ! -e work/integration_fixtures.json
          test ! -e work/run_tests.py

      - name: Verify clean public tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist *.egg-info work/*.egg-info
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=work \
            python -B -m tools.maintenance.check_public_tree

      - name: Commit phase 2 source refactor
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Organize test infrastructure by responsibility"
          git push origin HEAD:codebase-architecture-polish
