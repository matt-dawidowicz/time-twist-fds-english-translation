name: architecture polish phase 1 once

on:
  push:
    branches: [codebase-architecture-polish]
    paths: [.github/workflows/architecture_polish_phase1_once.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codebase-architecture-polish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Reorganize non-runtime tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/analysis tools/audit tools/generation tools/maintenance tools/preview

          git mv work/analyze_banks.py tools/analysis/analyze_banks.py
          git mv work/tools/disassemble_6502.py tools/analysis/disassemble_6502.py

          git mv work/tools/audit_fixed_menu_labels.py tools/audit/audit_fixed_menu_labels.py
          git mv work/tools/audit_full_word_menu_targets.py tools/audit/audit_full_word_menu_targets.py
          git mv work/tools/external_translation_compare.py tools/audit/external_translation_compare.py
          git mv work/tools/report_full_word_menu_candidate.py tools/audit/report_full_word_menu_candidate.py

          git mv work/generate_bilingual_comparison.py tools/generation/generate_bilingual_comparison.py
          git mv work/generate_bilingual_comparison_ci.py tools/generation/generate_bilingual_comparison_ci.py
          git mv work/generate_translation_workbook.py tools/generation/generate_translation_workbook.py

          git mv work/tools/check_public_tree.py tools/maintenance/check_public_tree.py
          git mv work/tools/validate_translation_patch_fragments.py tools/maintenance/validate_translation_patch_fragments.py

          git mv work/preview_font.py tools/preview/preview_font.py
          git mv work/preview_pixel_font.py tools/preview/preview_pixel_font.py
          git mv work/rebuild_native_title_asset.py tools/preview/rebuild_native_title_asset.py
          git mv work/render_chr.py tools/preview/render_chr.py
          git mv work/render_chr_labeled.py tools/preview/render_chr_labeled.py
          git mv work/render_title_preview.py tools/preview/render_title_preview.py

          cat > tools/__init__.py <<'PY'
          """Developer-facing analysis, audit, generation, maintenance, and preview tools."""
          PY
          cat > tools/analysis/__init__.py <<'PY'
          """Reverse-engineering and static-analysis utilities."""
          PY
          cat > tools/audit/__init__.py <<'PY'
          """Source-grounded translation and candidate audit utilities."""
          PY
          cat > tools/generation/__init__.py <<'PY'
          """Deterministic review-artifact generators."""
          PY
          cat > tools/maintenance/__init__.py <<'PY'
          """Repository integrity and maintenance utilities."""
          PY
          cat > tools/preview/__init__.py <<'PY'
          """Font, CHR, and title-development preview utilities."""
          PY

      - name: Decouple shared review evidence and update imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          workbook = root / "tools/generation/generate_translation_workbook.py"
          text = workbook.read_text(encoding="utf-8")

          start = text.index("PATCH_FOOTPRINT_RESULTS = {")
          end = text.index("\n\nSCENES =", start)
          evidence_block = text[start:end]
          evidence = root / "work/time_twist/evidence.py"
          evidence.write_text(
              '"""Source-backed measurements shared by review tooling and tests.\n\n'
              "These values are historical scenario-region evidence, not runtime\n"
              "configuration. Current release fit is always recomputed from the\n"
              "canonical translation maps before a build is accepted.\n"
              '"""\n\n'
              + evidence_block
              + "\n",
              encoding="utf-8",
          )
          text = text[:start] + text[end + 2 :]
          text = text.replace(
              "from pathlib import Path\n\nfrom generate_bilingual_comparison import _romanize",
              "from pathlib import Path\n\n"
              "from time_twist.evidence import PATCH_FOOTPRINT_RESULTS\n"
              "from tools.generation.generate_bilingual_comparison import _romanize",
          )
          text = text.replace(
              "ROOT = Path(__file__).resolve().parent.parent",
              "ROOT = Path(__file__).resolve().parents[2]",
          )
          workbook.write_text(text, encoding="utf-8")

          comparison = root / "tools/generation/generate_bilingual_comparison.py"
          text = comparison.read_text(encoding="utf-8").replace(
              "ROOT = Path(__file__).resolve().parent.parent",
              "ROOT = Path(__file__).resolve().parents[2]",
          )
          comparison.write_text(text, encoding="utf-8")

          comparison_ci = root / "tools/generation/generate_bilingual_comparison_ci.py"
          text = comparison_ci.read_text(encoding="utf-8")
          text = text.replace(
              "import generate_bilingual_comparison as comparison",
              "from tools.generation import generate_bilingual_comparison as comparison",
          )
          text = text.replace(
              'FIXED_SOURCE_TABLES = Path(__file__).with_name("fixed_source_tables.json")',
              'FIXED_SOURCE_TABLES = (\n'
              '    Path(__file__).resolve().parents[2] / "work" / "fixed_source_tables.json"\n'
              ')',
          )
          comparison_ci.write_text(text, encoding="utf-8")

          runner = root / "work/run_tests.py"
          text = runner.read_text(encoding="utf-8")
          text = text.replace(
              'sys.path.insert(0, str(WORK_ROOT))',
              'sys.path.insert(0, str(PROJECT_ROOT))\nsys.path.insert(0, str(WORK_ROOT))',
          )
          text = text.replace(
              '"""Discover an importable suite beneath ``work``."""',
              '"""Discover an importable suite beneath the project test root."""',
          )
          runner.write_text(text, encoding="utf-8")

          live_fit = root / "work/tests/test_live_translation_fit.py"
          text = live_fit.read_text(encoding="utf-8").replace(
              "from generate_translation_workbook import PATCH_FOOTPRINT_RESULTS\n",
              "from time_twist.evidence import PATCH_FOOTPRINT_RESULTS\n",
          )
          live_fit.write_text(text, encoding="utf-8")

          workbook_test = root / "work/tests/test_translation_workbook.py"
          text = workbook_test.read_text(encoding="utf-8")
          text = text.replace(
              "from generate_translation_workbook import (",
              "from tools.generation.generate_translation_workbook import (",
          )
          text = text.replace("    PATCH_FOOTPRINT_RESULTS,\n", "")
          text = text.replace(
              "from time_twist.cli import PERSONALITY_QUESTION_IDS\n",
              "from time_twist.cli import PERSONALITY_QUESTION_IDS\n"
              "from time_twist.evidence import PATCH_FOOTPRINT_RESULTS\n",
          )
          workbook_test.write_text(text, encoding="utf-8")

          external_test = root / "work/tests/test_external_translation_compare.py"
          text = external_test.read_text(encoding="utf-8").replace(
              "from tools.external_translation_compare import (",
              "from tools.audit.external_translation_compare import (",
          )
          external_test.write_text(text, encoding="utf-8")

          menu_test = root / "work/tests/test_menu_audit_tools.py"
          text = menu_test.read_text(encoding="utf-8").replace(
              "from tools import (",
              "from tools.audit import (",
          )
          menu_test.write_text(text, encoding="utf-8")

          fragment_test = root / "work/tests/test_translation_patch_fragments.py"
          text = fragment_test.read_text(encoding="utf-8").replace(
              "from tools.validate_translation_patch_fragments import validate_fragment",
              "from tools.maintenance.validate_translation_patch_fragments import (\n"
              "    validate_fragment,\n"
              ")",
          )
          fragment_test.write_text(text, encoding="utf-8")
          PY

      - name: Update repository path references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          mappings = {
              "work/analyze_banks.py": "tools/analysis/analyze_banks.py",
              "work/tools/disassemble_6502.py": "tools/analysis/disassemble_6502.py",
              "work/tools/audit_fixed_menu_labels.py": "tools/audit/audit_fixed_menu_labels.py",
              "work/tools/audit_full_word_menu_targets.py": "tools/audit/audit_full_word_menu_targets.py",
              "work/tools/external_translation_compare.py": "tools/audit/external_translation_compare.py",
              "work/tools/report_full_word_menu_candidate.py": "tools/audit/report_full_word_menu_candidate.py",
              "work/generate_bilingual_comparison.py": "tools/generation/generate_bilingual_comparison.py",
              "work/generate_bilingual_comparison_ci.py": "tools/generation/generate_bilingual_comparison_ci.py",
              "work/generate_translation_workbook.py": "tools/generation/generate_translation_workbook.py",
              "work/tools/check_public_tree.py": "tools/maintenance/check_public_tree.py",
              "work/tools/validate_translation_patch_fragments.py": "tools/maintenance/validate_translation_patch_fragments.py",
              "work/preview_font.py": "tools/preview/preview_font.py",
              "work/preview_pixel_font.py": "tools/preview/preview_pixel_font.py",
              "work/rebuild_native_title_asset.py": "tools/preview/rebuild_native_title_asset.py",
              "work/render_chr.py": "tools/preview/render_chr.py",
              "work/render_chr_labeled.py": "tools/preview/render_chr_labeled.py",
              "work/render_title_preview.py": "tools/preview/render_title_preview.py",
          }
          editable_suffixes = {".md", ".py", ".yml", ".yaml", ".toml", ".txt"}
          for path in Path.cwd().rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix not in editable_suffixes:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in mappings.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text(encoding="utf-8")
          old = (
              "The standalone scripts under `work/` render CHR data, preview fonts and title\n"
              "art, generate translation workbooks, and perform exploratory analysis. Core\n"
              "binary behavior belongs in `work/time_twist/` so it can be tested."
          )
          new = (
              "Developer-facing commands live under the top-level `tools/` package, grouped\n"
              "by responsibility (`analysis`, `audit`, `generation`, `maintenance`, and\n"
              "`preview`). Core binary behavior remains in `work/time_twist/`; tools may\n"
              "orchestrate or inspect that package but must not become hidden runtime layers."
          )
          if old not in text:
              raise SystemExit("architecture tooling paragraph drifted")
          architecture.write_text(text.replace(old, new), encoding="utf-8")
          PY

          cat > tools/README.md <<'MD'
          # Developer tools

          This directory contains project-maintenance commands that are intentionally
          outside the installable `time_twist` runtime package.

          - `analysis/` — reverse-engineering and static inspection.
          - `audit/` — source-grounded translation and build-candidate audits.
          - `generation/` — deterministic bilingual-comparison and workbook generators.
          - `maintenance/` — repository/publication integrity checks.
          - `preview/` — font, CHR, and title-development renderers.

          Prefer module execution from the repository root after installing development
          dependencies, for example:

          ```bash
          PYTHONPATH=work python -m tools.generation.generate_translation_workbook
          PYTHONPATH=work python -m tools.maintenance.check_public_tree
          ```

          Production binary logic belongs in `work/time_twist/`. If a tool grows reusable
          binary behavior, move that behavior into the package and keep the tool as a thin
          orchestration/reporting layer.
          MD

      - name: Update permanent CI commands
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/tests.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "python tools/maintenance/check_public_tree.py",
              "PYTHONPATH=work python -m tools.maintenance.check_public_tree",
          )
          text = text.replace(
              "python tools/generation/generate_bilingual_comparison_ci.py",
              "PYTHONPATH=work python -m tools.generation.generate_bilingual_comparison_ci",
          )
          text = text.replace(
              "python tools/generation/generate_translation_workbook.py",
              "PYTHONPATH=work python -m tools.generation.generate_translation_workbook",
          )
          text = text.replace(
              "python -m black --check work",
              "python -m black --check work tools",
          )
          text = text.replace(
              "python -m ruff check work",
              "python -m ruff check work tools",
          )
          text = text.replace(
              "python -m pydocstyle --convention=pep257 work",
              "python -m pydocstyle --convention=pep257 work tools",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and verify architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m black work tools
          python -m ruff check work tools
          python -m pydocstyle --convention=pep257 work tools
          python -m mypy
          PYTHONPATH=work python -m compileall -q tools

          if git grep -n -E 'from generate_translation_workbook|from generate_bilingual_comparison|import generate_bilingual_comparison|from tools\.(external_translation_compare|validate_translation_patch_fragments)' -- '*.py'; then
            echo "stale pre-refactor Python import found" >&2
            exit 1
          fi

      - name: Prove generators are byte-stable
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=work python -m tools.generation.generate_bilingual_comparison_ci
          PYTHONPATH=work python -m tools.generation.generate_translation_workbook
          git diff --exit-code -- outputs work/translation_workbook_banks

      - name: Run public test suite
        run: python work/run_tests.py unit

      - name: Build and verify installed package
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -c "from pathlib import Path; import time_twist; imported = Path(time_twist.__file__).resolve(); checkout = Path('work/time_twist').resolve(); print(imported); assert checkout not in imported.parents"
          time-twist --help >/dev/null
          time-twist release-build --help >/dev/null

      - name: Verify public tree and no release data changed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist *.egg-info work/*.egg-info
          PYTHONPATH=work python -m tools.maintenance.check_public_tree
          git diff --exit-code -- work/translations work/manifests work/release_sources.json work/title_assets

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/architecture_polish_phase1_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Organize developer tooling by responsibility"
          git push origin HEAD:codebase-architecture-polish
