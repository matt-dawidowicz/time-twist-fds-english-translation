name: Publish official v1.1 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.1.yml'
      - 'release_patcher/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-time-twist-v1.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify source-only patch resources
        run: python release_patcher/test_public_patcher.py
      - name: Build and smoke-test Windows release package
        shell: powershell
        run: ./release_patcher/build_windows.ps1
      - name: Publish or refresh GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.1.0'
          $title = 'Time Twist English Translation v1.1'
          $repo = $env:GITHUB_REPOSITORY
          $notes = 'release_patcher/CHANGELOG.md'
          $assets = @(
            'dist/Time-Twist-English-v1.1-Windows.zip',
            'dist/Time-Twist-English-v1.1-Zenpen.bps',
            'dist/Time-Twist-English-v1.1-Kouhen.bps',
            'dist/Time-Twist-v82-to-v83-four-side.bps',
            'dist/Time-Twist-v82-to-v83-Kouhen.bps'
          )

          # A missing release is the expected first-publish case. Temporarily
          # allow gh's nonzero probe result so PowerShell can branch on it.
          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo $repo 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($releaseExists) {
            gh release edit $tag --repo $repo --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh release metadata' }
          } else {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title $title --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub release' }
          }

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
            gh release upload $tag $asset --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload release asset: $asset" }
          }


      - name: Remove legacy v1.0 release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete-asset v1.1.0 "Time-Twist-v1.0-Simon-to-v1.1-four-side.bps" --repo $env:GITHUB_REPOSITORY --yes 2>$null
          $ErrorActionPreference = 'Stop'

      - name: Stage modern v1.1 release files in the repository
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $syncBranch = "automation/refresh-v1.1-release-$env:GITHUB_RUN_ID"
          $Dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $Package = Join-Path $Dist 'Time-Twist-English-v1.1'
          $ReleaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -c $syncBranch origin/main

          New-Item -ItemType Directory -Force $ReleaseDir | Out-Null
          Get-ChildItem -LiteralPath $ReleaseDir -Force | Remove-Item -Recurse -Force

          Copy-Item (Join-Path $Package 'Time-Twist-English-v1.1-Patcher.exe') (Join-Path $ReleaseDir 'Time-Twist-English-v1.1-Patcher.exe')
          Copy-Item (Join-Path $Dist 'Time-Twist-English-v1.1-Windows.zip') (Join-Path $ReleaseDir 'Time-Twist-English-v1.1-Windows.zip')
          Copy-Item (Join-Path $Dist 'Time-Twist-English-v1.1-Zenpen.bps') (Join-Path $ReleaseDir 'Time-Twist-English-v1.1-Zenpen.bps')
          Copy-Item (Join-Path $Dist 'Time-Twist-English-v1.1-Kouhen.bps') (Join-Path $ReleaseDir 'Time-Twist-English-v1.1-Kouhen.bps')
          Copy-Item (Join-Path $Dist 'Time-Twist-v82-to-v83-four-side.bps') (Join-Path $ReleaseDir 'Time-Twist-v82-to-v83-four-side.bps')
          Copy-Item (Join-Path $Dist 'Time-Twist-v82-to-v83-Kouhen.bps') (Join-Path $ReleaseDir 'Time-Twist-v82-to-v83-Kouhen.bps')

          git add -A release
          git add -f (Join-Path $ReleaseDir '*.zip')
          if (-not (git status --porcelain -- release)) {
            Write-Host 'Repository release directory is already current; no sync commit is needed.'
            exit 0
          }
          git commit -m "Refresh v1.1 release binaries"
          git push --set-upstream origin $syncBranch

          Write-Host "Release sync branch pushed: $syncBranch"
