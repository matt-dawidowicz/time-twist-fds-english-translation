name: tt1b-final-intent-gap

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/tt1b-final-intent-gap.yml

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore full exhibit question and resolve textual ambiguity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('work/translations/TT1B.json')
          text = path.read_text(encoding='utf-8')
          old = '  "TT1B/g0/r28": "Me: Um...{CTRL:1}Girl: Seen everything?{CTRL:0}Me: No...",'
          new = '  "TT1B/g0/r28": "Me: Um...{CTRL:1}Girl: Have you seen all{CTRL:0}the exhibits?{CTRL:0}Me: No...",'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('work/time_twist/scenario_validation.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''        "TT1B/g0/r1",\n'''
          addition = '''        "TT1B/g0/r1",\n        # てんじひん ぜんぶみました！ / いえ……\n        # The following "No" establishes the interrogative reading; retain the\n        # complete question across one additional presentation row.\n        "TT1B/g0/r28",\n'''
          assert text.count(anchor) == 1
          assert '"TT1B/g0/r28"' not in text
          path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          path = Path('work/generate_translation_workbook.py')
          text = path.read_text(encoding='utf-8')
          old = '''INTENT_RESTORED_IDS = frozenset(\n    {"TT1B/g0/r1", "TT1B/g0/r31", "TT1B/g1/r14", "TT1B/g2/r5"}\n)'''
          new = '''INTENT_RESTORED_IDS = frozenset(\n    {\n        "TT1B/g0/r1",\n        "TT1B/g0/r28",\n        "TT1B/g0/r31",\n        "TT1B/g1/r14",\n        "TT1B/g2/r5",\n    }\n)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    "TT1B/g0/r28": (\n        "Me: Um...{CTRL:1}Girl: Seen everything?{CTRL:0}Me: No..."\n    ),'''
          new = '''    "TT1B/g0/r28": (\n        "Me: Um...{CTRL:1}Girl: Have you seen all{CTRL:0}"\n        "the exhibits?{CTRL:0}Me: No..."\n    ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    if text_id == "TT1B/g0/r28":\n        return (\n            "Punctuation alone permits statement/question readings, but the reply "\n            "いえ strongly favors a question.",\n            "Medium",\n            True,\n        )\n'''
          new = '''    if text_id == "TT1B/g0/r28":\n        return (\n            "",\n            "High",\n            False,\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        notes.append(\n            "ぜんぶみました is formally compatible with a statement or a question "\n            "because the ROM text lacks a normal question mark. The protagonist's "\n            "reply いえ ('no') makes 'Have you seen all the exhibits?' the strongest "\n            "contextual reading."\n        )\n'''
          new = '''        notes.append(\n            "ぜんぶみました is formally compatible with a statement or a question "\n            "without modern question punctuation, but the protagonist's immediate "\n            "reply いえ ('no') resolves the exchange as 'Have you seen all the "\n            "exhibits?' The remaining verification requirement is the added English "\n            "presentation row, not the semantic reading."\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          # Record the semantic resolution as historical review evidence rather\n          # than leaving the generic compression-loss note in the workbook.
          marker = '''        "TT1B/g0/r31": (\n            "Resolved in the playable text: the protagonist's disbelief, the "\n'''
          addition = '''        "TT1B/g0/r28": (\n            "Resolved in the playable text: the girl's complete exhibit question "\n            "is restored. The protagonist's immediate いえ ('no') establishes the "\n            "interrogative reading; only the extra presentation row remains a "\n            "runtime playtest gate."\n        ),\n'''
          assert marker in text
          assert '"TT1B/g0/r28": (\n            "Resolved in the playable text:' not in text
          text = text.replace(marker, addition + marker, 1)

          old = '''        "TT1B/g0/r31",\n        "TT1B/g1/r14",\n'''
          new = '''        "TT1B/g0/r28",\n        "TT1B/g0/r31",\n        "TT1B/g1/r14",\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('work/audits/TT1B_voice_and_prose_pilot.md')
          text = path.read_text(encoding='utf-8')
          marker = '''The first ranked intent-gap pass restores three records whose workbook already\nrecorded compression-driven nuance loss:\n'''
          replacement = '''The ranked intent-gap pass restores the records whose workbook already\nrecorded compression-driven nuance loss or a compressed natural reading:\n'''
          assert marker in text
          text = text.replace(marker, replacement, 1)
          anchor = '''- `TT1B/g0/r31`: restores the protagonist's disbelief, the Devil's roundabout\n'''
          addition = '''- `TT1B/g0/r28`: restores “Have you seen all the exhibits?” rather than the\n  compressed “Seen everything?” The following いえ (“No…”) resolves the line as\n  a question; an added `CTRL:0` is only a presentation/runtime concern.\n'''
          assert anchor in text
          text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and regenerate review corpus
        run: |
          python -m black work/time_twist/scenario_validation.py work/generate_translation_workbook.py
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Require zero remaining TT1B semantic intent gaps
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --json > /tmp/tt1b-intent.json
          cat /tmp/tt1b-intent.json
          python - <<'PY'
          import json
          from pathlib import Path
          gaps = json.loads(Path('/tmp/tt1b-intent.json').read_text())
          assert gaps == [], gaps
          PY
      - name: Validate Python source and live fit
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
      - name: Build and validate Rust optimizer
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
          cargo test --manifest-path native/compression_optimizer/Cargo.toml
          cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
          TIME_TWIST_NATIVE_OPTIMIZER="$PWD/native/compression_optimizer/target/release/time-twist-compression-optimizer" \
            python -m unittest discover -s work/tests -p 'test_compression_native.py'
      - name: Measure TT1B final intent-pass headroom
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: |
          python work/tools/compression_headroom.py --project-root . --bank TT1B --backend native --json | tee /tmp/tt1b-headroom.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/tt1b-headroom.json').read_text())[0]
          assert result['optimized_packed_bytes'] <= result['capacity_bytes'], result
          print('TT1B optimized headroom:', result['optimized_headroom_bytes'])
          PY
      - name: Refresh TT1B queue and remove temporary workflow
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B > work/audits/TT1B_intent_gap_queue.md
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --json > work/audits/TT1B_intent_gap_queue.json
          rm .github/workflows/tt1b-final-intent-gap.yml
          rm -rf work/__pycache__ work/time_twist/__pycache__ work/tests/__pycache__ work/time_twist_fds_tools.egg-info native/compression_optimizer/target
      - name: Commit verified TT1B completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete TT1B intent-first text audit"
          git push origin HEAD:engineering/editorial-compression-20260902
