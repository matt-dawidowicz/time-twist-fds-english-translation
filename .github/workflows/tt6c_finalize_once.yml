name: TT6C finalize once

on:
  push:
    branches: [translation-quality-comparison-audit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Apply TT6C source-grounded revision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/translations/TT6C.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          old = data['TT6C/g0/r2']
          new = old.replace('You seek the savior.', 'You want the savior dead')
          if old == new:
              raise SystemExit('expected TT6C/g0/r2 text not found')
          data['TT6C/g0/r2'] = new
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          if not any(item['id'] == 'TT6C/g0/r2' for item in audit['changes']):
              audit['changes'].append({
                  'id': 'TT6C/g0/r2',
                  'japanese': 'すくいぬしのいのちをねらう じゃあくなるもの',
                  'previous_english': 'You seek the savior.',
                  'new_english': 'You want the savior dead',
                  'category': ['omitted_detail', 'threat_specificity', 'fidelity'],
                  'reason': 'Restore いのちをねらう: the evil one is targeting the Savior\'s life, not merely seeking or pursuing him.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': 4,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              })
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Measure live translation fit
        run: python -m unittest work.tests.test_live_translation_fit 2>&1 | tee /tmp/tt6c_fit.txt
      - name: Synchronize TT6C baseline status
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('work/audits/external_translation_baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          summary = baseline['scenario_summary']
          summary['tt6c_full_source_review_complete'] = True
          summary['tt6c_source_records_reviewed'] = 106
          summary['tt6c_audited_revisions'] = 1
          summary['scenario_source_records_fully_reviewed'] = 715
          summary['scenario_banks_fully_reviewed'] = ['TT3A', 'TT3B', 'TT1B', 'TT1A', 'TT2', 'T22', 'TT6C']

          fit_text = Path('/tmp/tt6c_fit.txt').read_text(encoding='utf-8')
          match = re.search(r'FIT TT6C: (\d+)/(\d+) \((\d+) bytes free;', fit_text)
          if not match:
              raise SystemExit('TT6C fit line not found')
          used, capacity, free = map(int, match.groups())
          live = baseline['current_live_fit']
          live['measurement'] = 'canonical test_live_translation_fit.py after completed source review through TT6C'
          for item in live['banks']:
              if item['bank'] == 'TT6C':
                  item.update(used=used, capacity=capacity, free=free)
                  break
          else:
              raise SystemExit('TT6C bank row missing')
          live['tt6c_free_after_one_revision'] = free

          baseline['pending'] = [
              'complete external NOV2/NOV4 system-text alignment without assuming source offsets',
              'review fixed-label differences against Japanese and gameplay context',
              'review TT6B source-grounded scenario text next, then continue bank by bank',
              'perform final rebuilt-ROM and emulator validation after editorial review'
          ]
          path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'TT6C FIT FINAL {used}/{capacity}; {free} bytes free')
          PY
      - name: Verify Python style
        run: |
          python -m black --check work
          python -m ruff check work
      - name: Run unit suite
        run: python work/run_tests.py unit
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/tt6c_finalize_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete source-grounded TT6C review"
          git push origin HEAD:translation-quality-comparison-audit
