name: temporary-v50-source-parity-format

on:
  push:
    branches:
      - source-parity/v50-clean

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: source-parity/v50-clean
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black work
      - name: Commit mechanical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git commit -m "Format explicit Ruff fixes"
          git push origin HEAD:source-parity/v50-clean
