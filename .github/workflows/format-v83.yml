name: Format v83 release fixes

on:
  push:
    branches:
      - fixes/v83-translation-and-walkthrough
    paths:
      - '.github/workflows/format-v83.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fixes/v83-translation-and-walkthrough
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install black==25.1.0
      - name: Apply Black
        run: |
          python -m black work/tests/test_incremental_build.py work/tests/test_v83_checkpoint.py work/time_twist/v83_checkpoint.py work/time_twist/incremental_build.py
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add work/tests/test_incremental_build.py work/tests/test_v83_checkpoint.py work/time_twist/v83_checkpoint.py work/time_twist/incremental_build.py
          git commit -m "Format v83 release fixes"
          git push origin HEAD:fixes/v83-translation-and-walkthrough
