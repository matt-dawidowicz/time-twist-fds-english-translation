name: apply-parent-guard-idempotency

on:
  push:
    branches:
      - fix/root-menu-b-noop-20260915

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[parent-guard-idempotent]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/root-menu-b-noop-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply idempotency repair
        run: patch -p1 < .github/idempotent-parent-guard.patch
      - name: Remove one-shot files
        run: rm .github/idempotent-parent-guard.patch .github/workflows/apply-parent-guard-idempotency.yml
      - name: Verify focused regression
        env:
          PYTHONPATH: work
        run: |
          python -m unittest work.tests.test_ui_unit work.tests.test_entropy_production
          python -m pip install black==25.1.0 ruff==0.16.7
          python -m black --check work/time_twist/entropy_runtime.py work/tests/test_entropy_production.py work/integration_tests/test_ui.py
          python -m ruff check work/time_twist/entropy_runtime.py work/tests/test_entropy_production.py work/integration_tests/test_ui.py
          git diff --check
      - name: Commit idempotent parent guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve entropy parent-guard idempotency [parent-guard-idempotent]"
          git push origin HEAD:fix/root-menu-b-noop-20260915
