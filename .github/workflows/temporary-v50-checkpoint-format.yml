name: temporary-v50-checkpoint-format

on:
  push:
    branches:
      - source-parity/v50-clean

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: source-parity/v50-clean
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black work/time_twist/checkpoint_delta.py work/time_twist/v41_checkpoint.py work/time_twist/v50_finalizer.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/time_twist/checkpoint_delta.py work/time_twist/v41_checkpoint.py work/time_twist/v50_finalizer.py
          git commit -m "Format checkpoint reproduction modules"
          git push origin HEAD:source-parity/v50-clean
