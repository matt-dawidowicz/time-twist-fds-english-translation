name: tests

on:
  push:
    branches:
      - main
      - engineering/editorial-compression-20260902
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python work/tools/check_public_tree.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook.py
      - name: Verify generated translation review artifacts are current
        run: git diff --exit-code -- outputs work/translation_workbook_banks
      - if: matrix.python-version == '3.11'
        name: Smoke-test source-grounded translation intent audit
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --json > /tmp/tt1b-intent-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path('/tmp/tt1b-intent-audit.json').read_text())
          assert isinstance(rows, list)
          assert rows, 'TT1B intent audit unexpectedly returned no review candidates'
          assert all(row['record_id'] != 'TT1B/g0/r1' for row in rows), (
              'accepted blue-sky wording was incorrectly ranked as an intent gap'
          )
          assert all('score' in row and 'reasons' in row for row in rows)
          print(f'TT1B intent audit: {len(rows)} ranked review candidates')
          PY
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - if: matrix.python-version == '3.14'
        run: python -m build
      - if: matrix.python-version == '3.14'
        run: python -m pip install --force-reinstall dist/*.whl
      - if: matrix.python-version == '3.14'
        name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - if: matrix.python-version == '3.14'
        run: time-twist --help
      - if: matrix.python-version == '3.14'
        run: time-twist release-build --help

  native-compression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt
          rustc --version
          cargo --version
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
      - name: Test native optimizer
        run: cargo test --manifest-path native/compression_optimizer/Cargo.toml
      - name: Build native optimizer
        run: cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
      - name: Cross-check native optimizer against Python
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: >-
          python -m unittest discover -s work/tests
          -p 'test_compression_native.py'
      - name: Benchmark TT1A Python reference
        run: >-
          python work/tools/compression_headroom.py --project-root .
          --bank TT1A --backend python --json > /tmp/tt1a-python.json
      - name: Benchmark TT1A native optimizer
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: >-
          python work/tools/compression_headroom.py --project-root .
          --bank TT1A --backend native --json > /tmp/tt1a-native.json
      - name: Require identical TT1A optimized size
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          python_result = json.loads(Path('/tmp/tt1a-python.json').read_text())[0]
          native_result = json.loads(Path('/tmp/tt1a-native.json').read_text())[0]
          print('Python:', python_result)
          print('Native:', native_result)
          assert native_result['optimized_packed_bytes'] == python_result['optimized_packed_bytes']
          assert native_result['optimized_dictionary_entries'] == python_result['optimized_dictionary_entries']
          PY
      - name: Rank natural TT1B blue-sky layouts
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: >-
          python work/tools/editorial_layout_audit.py --project-root .
          --bank TT1B --record TT1B/g0/r1
          --text "When was the last time I saw a blue sky?"
          --backend native

  compression-headroom:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[compression-benchmark]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bank:
          - TT1A
          - TT1B
          - TT2
          - T22
          - TT3A
          - TT3B
          - TT4
          - TT5
          - T25
          - TT6A
          - TT6B
          - TT6C
          - TT6D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Measure ${{ matrix.bank }} compression headroom
        run: >-
          python work/tools/compression_headroom.py
          --project-root . --bank ${{ matrix.bank }}

  required-unit-tests:
    name: unit-tests
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Python version to pass
        run: test "${{ needs.unit-tests.result }}" = "success"
