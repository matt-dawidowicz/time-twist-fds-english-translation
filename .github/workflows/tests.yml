name: tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-hardening:
    if: github.head_ref == 'codex/scenario-validation-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/scenario-validation-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Normalize facade import order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("work/time_twist/cli.py")
          text = path.read_text(encoding="utf-8")
          loop = '''\nfor _name in dir(_core):\n    if not _name.startswith("__"):\n        globals()[_name] = getattr(_core, _name)\ndel _name\n'''
          if loop not in text:
              raise SystemExit("expected CLI namespace mirror block was not found")
          text = text.replace(loop, "\n", 1)
          marker = "\nsafe_filename = _core.safe_filename\n"
          if marker not in text:
              raise SystemExit("expected CLI facade marker was not found")
          replacement = '''\nfor _name in dir(_core):\n    if not _name.startswith("__") and _name not in globals():\n        globals()[_name] = getattr(_core, _name)\ndel _name\n\nsafe_filename = _core.safe_filename\n'''
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply repository formatting
        run: python -m black work
      - name: Apply safe Ruff fixes
        run: >-
          python -m ruff check --fix
          work/time_twist/cli.py
          work/time_twist/project.py
          work/time_twist/release.py
      - name: Reformat fixed facades
        run: >-
          python -m black
          work/time_twist/cli.py
          work/time_twist/project.py
          work/time_twist/release.py
      - name: Verify Ruff after fixes
        run: python -m ruff check work
      - name: Verify diff whitespace
        run: git diff --check
      - name: Commit formatter and lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            work/time_twist/_release_core.py \
            work/time_twist/cli.py \
            work/time_twist/project.py \
            work/time_twist/release.py \
            work/tests/test_release_integrity_polish.py \
            work/tests/test_release_unit.py
          if git diff --cached --quiet; then
            echo "No formatter/lint changes to commit."
            exit 0
          fi
          git commit -m "Apply repository formatting to hardening changes"
          git push origin HEAD:codex/scenario-validation-hardening
