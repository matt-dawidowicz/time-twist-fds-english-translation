name: tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  clean-canonical-hardening:
    if: github.head_ref == 'codex/scenario-validation-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/scenario-validation-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Move compatibility export below imports and restore Ruff policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path("work/time_twist/cli.py")
          text = cli.read_text(encoding="utf-8")
          export = "PERSONALITY_QUESTION_IDS = _PERSONALITY_QUESTION_IDS\n"
          if text.count(export) != 1:
              raise SystemExit("expected one personality ID export")
          text = text.replace(export, "", 1)
          marker = "\n\ndef safe_filename("
          if text.count(marker) != 1:
              raise SystemExit("safe_filename insertion point did not match")
          text = text.replace(
              marker,
              "\n\nPERSONALITY_QUESTION_IDS = _PERSONALITY_QUESTION_IDS\n" + marker,
              1,
          )
          cli.write_text(text, encoding="utf-8")

          project = Path("pyproject.toml")
          text = project.read_text(encoding="utf-8")
          temporary = '''  # Temporary while the canonicalization workflow re-exports a historical CLI name.\n  "E402",\n  # E402 is temporarily disabled, so its existing noqa would otherwise trip RUF100.\n  "RUF100",\n'''
          if text.count(temporary) != 1:
              raise SystemExit("temporary Ruff exemptions were not found")
          project.write_text(text.replace(temporary, "", 1), encoding="utf-8")
          PY
      - run: python -m black work/time_twist/cli.py
      - run: python -m ruff check --fix work/time_twist/cli.py
      - run: python -m black work/time_twist/cli.py
      - name: Remove editable-install metadata before public tree check
        run: rm -rf work/time_twist_fds_tools.egg-info
      - run: python work/tools/check_public_tree.py
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - run: git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- work/time_twist/cli.py pyproject.toml
          git commit -m "Clean scenario hardening compatibility export"
          git push origin HEAD:codex/scenario-validation-hardening
