name: tests

on:
  push:
    branches:
      - main
  pull_request:

# Temporary one-shot cleanup for PR #75. The job repairs the two generated
# source-authority defects found by the full unit suite, regenerates tracked
# review artifacts, and commits them. This workflow is restored to read-only
# validation immediately after the cleanup run.
permissions:
  contents: write

concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Repair final playtest source metadata
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          ui_path = Path("work/time_twist/ui_fixed_tables.py")
          ui_text = ui_path.read_text(encoding="utf-8")
          old = '    "Room ",\n    "Wall",'
          new = '    "Room",\n    "Wall",'
          if old in ui_text:
              ui_text = ui_text.replace(old, new, 1)
              ui_path.write_text(ui_text, encoding="utf-8")
          elif new not in ui_text:
              raise SystemExit("TT3A Room label was not found in the expected form")

          lock_path = Path("work/release_sources.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          files = lock["files"]
          if "work/production_overrides/TU6A.json" in files:
              files = {
                  (
                      "work/production_overrides/TT6A.json"
                      if path == "work/production_overrides/TU6A.json"
                      else path
                  ): metadata
                  for path, metadata in files.items()
              }
              lock["files"] = files
          elif "work/production_overrides/TT6A.json" not in files:
              raise SystemExit("TT6A override source-lock entry is missing")

          override_path = Path("work/production_overrides/TT3B.json")
          raw = override_path.read_bytes().replace(b"\r\n", b"\n")
          tt3b = lock["files"]["work/production_overrides/TT3B.json"]
          tt3b["sha256"] = hashlib.sha256(raw).hexdigest().upper()
          tt3b["bytes"] = len(raw)
          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - run: python work/tools/check_public_tree.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run focused canonical runtime tests
        run: time-twist-runtime smoke
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook_ci.py
      - name: Commit cleanup and regenerated review artifacts
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add work/time_twist/ui_fixed_tables.py work/release_sources.json outputs work/translation_workbook_banks
            git commit -m "Finalize playtest source and review artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify generated translation review artifacts are current
        run: git diff --exit-code -- outputs work/translation_workbook_banks
      - name: Materialize production translation maps
        run: >-
          python work/tools/materialize_production_translations.py
          --repo-root . --output work/build/production_translations
      - run: python -m black --check --diff work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - run: time-twist --help
      - run: time-twist release-build --help

  required-unit-tests:
    name: unit-tests
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require cleanup validation to pass
        run: test "${{ needs.unit-tests.result }}" = "success"
