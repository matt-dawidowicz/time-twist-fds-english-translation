name: tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-mypy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-em-dash-audit-20260911
      - name: Apply annotation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('work/time_twist/production_translation.py')
          text = path.read_text(encoding='utf-8')
          old = '    demoted_ctrl2_ordinals = frozenset()\n'
          new = '    demoted_ctrl2_ordinals: frozenset[int] = frozenset()\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/time_twist/production_translation.py
          git commit -m "Type pagination demotion set explicitly"
          git push origin HEAD:fix/production-em-dash-audit-20260911
