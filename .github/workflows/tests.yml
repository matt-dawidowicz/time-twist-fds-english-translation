name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python work/tools/check_public_tree.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook.py
      - name: Verify generated translation review artifacts are current
        run: git diff --exit-code -- outputs work/translation_workbook_banks
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - if: matrix.python-version == '3.12'
        run: python -m build
      - if: matrix.python-version == '3.12'
        run: python -m pip install --force-reinstall dist/*.whl
      - if: matrix.python-version == '3.12'
        name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - if: matrix.python-version == '3.12'
        run: time-twist --help
      - if: matrix.python-version == '3.12'
        run: time-twist release-build --help

  modernize-pr20:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'runtime-playtest-validation-20260829' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-playtest-validation-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -r requirements.txt
      - name: Apply guarded refactor preserved in branch history
        run: |
          git show f21dc8897e9bcf51274564739adbcc2915f8689c:.github/scripts/modernize_pr20.py > /tmp/modernize_pr20.py
          python /tmp/modernize_pr20.py
          python -m black work/tests/test_modern_cli_boundaries.py
          python .github/scripts/normalize_modern_cli_boundary.py
      - name: Validate transformed tree
        run: |
          python -m black work
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
          git diff --check
      - name: Commit validated production refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/time_twist/release_metadata.py \
                  work/time_twist/cli_commands.py \
                  work/time_twist/cli_parser.py \
                  docs/CLI_REFERENCE.md \
                  work/tests/test_modern_cli_boundaries.py
          git commit -m "refactor: retire superseded fixed-slot CLI paths"
          git push origin HEAD:runtime-playtest-validation-20260829

  required-unit-tests:
    # This stable check name is the branch-protection gate.  It passes only
    # after both matrix variants above have completed successfully.
    name: unit-tests
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Python version to pass
        run: test "${{ needs.unit-tests.result }}" = "success"
