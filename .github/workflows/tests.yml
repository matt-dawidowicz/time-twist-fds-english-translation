name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - if: matrix.python-version == '3.14'
        name: Apply narrow mypy fix and restore validation workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("work/time_twist/production_translation.py")
          source = path.read_text(encoding="utf-8")
          old = """                semantic_ordinal = semantic_ordinal_by_control.get(\n                    segment_index\n                )\n                if (\n                    semantic_ordinal in anchored_semantic_ordinals\n"""
          new = """                control_semantic_ordinal = semantic_ordinal_by_control.get(\n                    segment_index\n                )\n                if (\n                    control_semantic_ordinal in anchored_semantic_ordinals\n"""
          if old not in source:
              raise SystemExit("expected mypy-fix target not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git fetch origin fix/playtest-dialogue-layout-20260911 --depth=1
          git show FETCH_HEAD:.github/workflows/tests.yml > .github/workflows/tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/time_twist/production_translation.py .github/workflows/tests.yml
          git commit -m "Fix semantic-control ordinal typing"
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python work/tools/check_public_tree.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run focused canonical runtime tests
        run: time-twist-runtime smoke
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook.py
      - name: Verify generated translation review artifacts are current
        run: git diff --exit-code -- outputs work/translation_workbook_banks
      - if: matrix.python-version == '3.14'
        name: Materialize production translation maps
        run: >-
          python work/tools/materialize_production_translations.py
          --repo-root . --output work/build/production_translations
      - if: matrix.python-version == '3.14'
        name: Archive production source snapshot
        run: git archive --format=zip --output=work/build/production-source.zip HEAD
      - if: matrix.python-version == '3.14'
        name: Upload production integration inputs
        uses: actions/upload-artifact@v4
        with:
          name: production-integration-inputs
          path: |
            work/build/production_translations
            work/build/production-source.zip
          if-no-files-found: error
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - if: matrix.python-version == '3.14'
        run: python -m build
      - if: matrix.python-version == '3.14'
        run: python -m pip install --force-reinstall dist/*.whl
      - if: matrix.python-version == '3.14'
        name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - if: matrix.python-version == '3.14'
        run: time-twist --help
      - if: matrix.python-version == '3.14'
        run: time-twist release-build --help

  required-unit-tests:
    name: unit-tests
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Python version to pass
        run: test "${{ needs.unit-tests.result }}" = "success"
