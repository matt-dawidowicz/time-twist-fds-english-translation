name: apply documentation-contract fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-em-dash-audit-20260911
      - name: Add nested helper docstring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('work/tests/test_production_translation.py')
          text = path.read_text(encoding='utf-8')
          old = '        def production(bank_name: str) -> dict[str, str]:\n            return merged_translation_map(\n'
          new = '        def production(bank_name: str) -> dict[str, str]:\n            """Materialize one production bank for semantic-control assertions."""\n            return merged_translation_map(\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tests/test_production_translation.py
          git commit -m "Document semantic-control test helper"
          git push origin HEAD:fix/production-em-dash-audit-20260911
