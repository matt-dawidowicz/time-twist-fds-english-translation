name: tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-pagination-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-em-dash-audit-20260911
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Apply tested pagination patch
        run: python .github/apply_pagination_fix.py
      - name: Canonical formatting and lint fixes
        run: |
          python -m black work/time_twist/production_translation.py work/tests/test_production_translation.py
          python -m ruff check --fix work/time_twist/production_translation.py work/tests/test_production_translation.py
      - name: Restore normal CI and commit only final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/tests.yml
          rm .github/apply_pagination_fix.py
          git add .github/workflows/tests.yml work/time_twist/production_translation.py work/tests/test_production_translation.py work/production_overrides/TT1A_pagination_policy.json .github/apply_pagination_fix.py
          git commit -m "Fill English dialogue boxes before weak page breaks"
          git push origin HEAD:fix/production-em-dash-audit-20260911
