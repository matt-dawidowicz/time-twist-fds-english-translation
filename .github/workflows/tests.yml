name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quick-check:
    name: quick-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run quick deterministic checks
        run: python work/tools/quick_check.py

  unit-tests:
    needs: quick-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python work/tools/check_public_tree.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - run: time-twist --help
      - run: time-twist release-build --help

  required-unit-tests:
    name: unit-tests
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require unit tests to pass
        run: test "${{ needs.unit-tests.result }}" = "success"

  export-nov2-runtime:
    name: export-nov2-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Export canonical NOV2 runtime-owned regions
        env:
          PYTHONPATH: work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from time_twist import entropy_runtime as er

          collections = (
              ("leading_control_resume", er.LEADING_CONTROL_RESUME_PATCHES),
              ("base_runtime", er.BASE_RUNTIME_PATCHES),
              ("dynamic_menu_layout", er.DYNAMIC_MENU_LAYOUT_PATCHES),
              ("entropy_prerequisites", er.ENTROPY_PREREQUISITE_PATCHES),
              ("entropy_runtime", er.ENTROPY_RUNTIME_PATCHES),
              ("parent_back_guard", er.PARENT_BACK_GUARD_PATCHES),
          )
          rows = []
          for collection, patches in collections:
              for patch in patches:
                  rows.append(
                      {
                          "collection": collection,
                          "label": patch.label,
                          "file_offset": patch.file_offset,
                          "cpu_address": er.NOV2_LOAD_ADDRESS + patch.file_offset,
                          "replacement_hex": patch.replacement.hex(),
                      }
                  )
          Path("nov2-runtime-regions.json").write_text(
              json.dumps(rows, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nov2-runtime-regions
          path: nov2-runtime-regions.json

