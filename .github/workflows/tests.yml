name: tests

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-release-core:
    if: github.head_ref == 'codex/scenario-validation-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/scenario-validation-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Add explicit type guards retained from manifest validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("work/time_twist/_release_core.py")
          text = path.read_text(encoding="utf-8")
          capacity_old = '''        if remaining_bytes != capacity_bytes - packed_bytes:\n'''
          capacity_new = '''        assert isinstance(packed_bytes, int)\n        assert isinstance(capacity_bytes, int)\n        assert isinstance(remaining_bytes, int)\n        if remaining_bytes != capacity_bytes - packed_bytes:\n'''
          if text.count(capacity_old) != 1:
              raise SystemExit("expected scenario capacity expression was not found")
          text = text.replace(capacity_old, capacity_new, 1)

          digest_old = '''        if not _is_sha256(digest):\n            raise ReleaseBuildError(\n                f"{label} component {component} has invalid SHA-256"\n            )\n        output[component] = digest\n'''
          digest_new = '''        if not _is_sha256(digest):\n            raise ReleaseBuildError(\n                f"{label} component {component} has invalid SHA-256"\n            )\n        assert isinstance(digest, str)\n        output[component] = digest\n'''
          if text.count(digest_old) != 1:
              raise SystemExit("expected component digest validation was not found")
          text = text.replace(digest_old, digest_new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - run: python -m black work/time_twist/_release_core.py
      - run: python -m ruff check work/time_twist/_release_core.py work/time_twist/release.py
      - run: python -m mypy
      - run: git diff --check
      - name: Commit typing guards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- work/time_twist/_release_core.py
          if git diff --cached --quiet; then
            echo "No typing changes to commit."
            exit 0
          fi
          git commit -m "Add release manifest typing guards"
          git push origin HEAD:codex/scenario-validation-hardening
