name: temporary-fast-validation

on:
  push:
    branches:
      - fix/entropy-codec-architecture-20260910

# Connector-authored nudge: validate the latest safe-fix commit.
jobs:
  lint-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/entropy-codec-architecture-20260910
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.6 black==25.1.0
      - name: Apply safe Ruff fixes and normalize formatting
        run: |
          python -m ruff check --fix work || true
          python -m black work
          if git diff --quiet -- work; then
            echo "No safe lint repairs available"
            exit 0
          fi
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work
          git commit -m "Apply safe Ruff repairs to runtime sources"
          git push origin HEAD:fix/entropy-codec-architecture-20260910

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - if: matrix.python-version == '3.14'
        run: python -m build
      - if: matrix.python-version == '3.14'
        run: python -m pip install --force-reinstall dist/*.whl
      - if: matrix.python-version == '3.14'
        name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - if: matrix.python-version == '3.14'
        run: time-twist --help
      - if: matrix.python-version == '3.14'
        run: time-twist release-build --help
