name: temporary-fast-validation

on:
  push:
    branches:
      - fix/entropy-codec-architecture-20260910

jobs:
  doc-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/entropy-codec-architecture-20260910
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==25.1.0 ruff==0.16.6 pydocstyle==6.3.0
      - name: Add missing public API docstrings
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("work/tools/audit_production_localization.py"): [
                  (
                      "def rows(root: Path) -> list[dict[str, object]]:\n    output:",
                      "def rows(root: Path) -> list[dict[str, object]]:\n    \"\"\"Return prioritized localization audit rows from all workbook banks.\"\"\"\n    output:",
                  ),
                  (
                      "def main() -> int:\n    parser =",
                      "def main() -> int:\n    \"\"\"Write the prioritized localization audit CSV.\"\"\"\n    parser =",
                  ),
              ],
              Path("work/time_twist/entropy_runtime.py"): [
                  (
                      "    def __post_init__(self) -> None:\n        if self.cpu_address",
                      "    def __post_init__(self) -> None:\n        \"\"\"Validate patch bounds, size neutrality, and digest shape.\"\"\"\n        if self.cpu_address",
                  ),
                  (
                      "    def file_offset(self) -> int:\n        return self.cpu_address",
                      "    def file_offset(self) -> int:\n        \"\"\"Return the NOV2-relative byte offset of the patch.\"\"\"\n        return self.cpu_address",
                  ),
                  (
                      "    def apply(self, data: bytearray) -> None:\n        end = self.file_offset",
                      "    def apply(self, data: bytearray) -> None:\n        \"\"\"Apply the guarded patch idempotently to a mutable NOV2 image.\"\"\"\n        end = self.file_offset",
                  ),
              ],
              Path("work/time_twist/production_runtime.py"): [
                  (
                      "    def __post_init__(self) -> None:\n        if self.file_offset",
                      "    def __post_init__(self) -> None:\n        \"\"\"Validate the patch offset and size neutrality.\"\"\"\n        if self.file_offset",
                  ),
              ],
              Path("work/time_twist/runtime_lab.py"): [
                  (
                      "def command_fds(args: argparse.Namespace) -> int:\n    old_raw =",
                      "def command_fds(args: argparse.Namespace) -> int:\n    \"\"\"Compare two FDS images and print changed file payloads.\"\"\"\n    old_raw =",
                  ),
                  (
                      "def build_parser() -> argparse.ArgumentParser:\n    parser =",
                      "def build_parser() -> argparse.ArgumentParser:\n    \"\"\"Build the runtime-debug command-line parser.\"\"\"\n    parser =",
                  ),
                  (
                      "def main(argv: Iterable[str] | None = None) -> int:\n    parser =",
                      "def main(argv: Iterable[str] | None = None) -> int:\n    \"\"\"Run the runtime-debug command-line interface.\"\"\"\n    parser =",
                  ),
              ],
              Path("work/time_twist/entropy_scenario.py"): [
                  (
                      "    def loaded_end(self) -> int:\n        return self.load_address",
                      "    def loaded_end(self) -> int:\n        \"\"\"Return the exclusive loaded CPU address of the patched bank.\"\"\"\n        return self.load_address",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected source fragment missing in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python -m black work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work
          git commit -m "Document public runtime helpers"
          git push origin HEAD:fix/entropy-codec-architecture-20260910
