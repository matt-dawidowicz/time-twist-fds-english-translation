name: temporary-fast-validation

on:
  push:
    branches:
      - fix/entropy-codec-architecture-20260910

jobs:
  lint-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/entropy-codec-architecture-20260910
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.6 black==25.1.0
      - name: Apply remaining reviewed lint repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("work/tests/test_production_scenario.py"): [
                  (
                      '''        dictionary = tuple(encode_english("A") for _ in range(68)) + (\n            (reference_one, *encode_english("B")),\n        )''',
                      '''        dictionary = (\n            *(encode_english("A") for _ in range(68)),\n            (reference_one, *encode_english("B")),\n        )''',
                  ),
              ],
              Path("work/time_twist/entropy_release.py"): [
                  (
                      '''    page_starts = [spec.start]\n    for offset in range(\n        page_index_offset,\n        page_index_offset + pointer_bytes,\n        2,\n    ):\n        page_starts.append(\n            int.from_bytes(data[offset : offset + 2], "little") - 0xA200\n        )''',
                      '''    page_starts = [spec.start]\n    page_starts.extend(\n        int.from_bytes(data[offset : offset + 2], "little") - 0xA200\n        for offset in range(\n            page_index_offset,\n            page_index_offset + pointer_bytes,\n            2,\n        )\n    )''',
                  ),
                  (
                      '''    # TT1A is the one scenario bank whose selector table is outside the normal\n    # FIXED_RECORD_TABLE_SPECS relocation model.  The native release patcher\n    # writes byte-aligned records and therefore cannot run after a global\n    # entropy decoder is installed.  Convert the complete 19-record table as\n    # one contiguous entropy stream instead, then prove the scenario payload\n    # itself was unaffected.''',
                      '''    # TT1A is the one scenario bank whose selector table is outside the normal\n    # FIXED_RECORD_TABLE_SPECS relocation model. Its 19 native callers enter at\n    # fixed byte addresses, so preserve those slots as 19 independent one-record\n    # entropy streams rather than collapsing them into one sequential stream.''',
                  ),
              ],
              Path("work/time_twist/production_codec.py"): [
                  (
                      '''            if symbol.kind is SymbolKind.DICTIONARY:\n                if not 1 <= symbol.value < entry_index:\n                    raise ValueError(\n                        f"dictionary entry {entry_index} references "\n                        f"non-earlier entry {symbol.value}"\n                    )''',
                      '''            if (\n                symbol.kind is SymbolKind.DICTIONARY\n                and not 1 <= symbol.value < entry_index\n            ):\n                raise ValueError(\n                    f"dictionary entry {entry_index} references "\n                    f"non-earlier entry {symbol.value}"\n                )''',
                  ),
              ],
              Path("work/time_twist/runtime_lab.py"): [
                  (
                      '''        changed = sum(a != b for a, b in zip(left[:common], right[:common]))''',
                      '''        changed = sum(\n            a != b\n            for a, b in zip(left[:common], right[:common], strict=True)\n        )''',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected source fragment missing in {path}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python -m black work
          python -m ruff check work
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work
          git commit -m "Resolve remaining Ruff violations"
          git push origin HEAD:fix/entropy-codec-architecture-20260910

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - if: matrix.python-version == '3.14'
        run: python -m build
      - if: matrix.python-version == '3.14'
        run: python -m pip install --force-reinstall dist/*.whl
      - if: matrix.python-version == '3.14'
        name: Prove smoke test imports the installed wheel
        run: >-
          python -c "from pathlib import Path; import time_twist;
          from time_twist.release import build_code_provenance;
          imported = Path(time_twist.__file__).resolve();
          checkout = Path('work/time_twist').resolve(); print(imported);
          assert checkout not in imported.parents,
          f'import leaked from checkout: {imported}';
          build_code_provenance(Path.cwd())"
      - if: matrix.python-version == '3.14'
        run: time-twist --help
      - if: matrix.python-version == '3.14'
        run: time-twist release-build --help
