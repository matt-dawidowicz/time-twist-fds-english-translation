name: ruff canonical entropy cleanup

on:
  push:
    branches:
      - tmp/ruff-canonical-entropy-20260911

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CI Ruff version
        run: python -m pip install 'ruff==0.16.7'
      - name: Apply Ruff fix
        run: python -m ruff check --fix work/time_twist/release_build.py
      - name: Commit Ruff fix
        run: |
          set -euo pipefail
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git diff --check
          git add work/time_twist/release_build.py
          git commit -m "Apply Ruff import ordering"
          git push origin HEAD:refs/heads/tmp/ruff-canonical-entropy-20260911
