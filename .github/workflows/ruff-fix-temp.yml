name: ruff-fix-temp
on:
  push:
    branches:
      - fix/retail-kouhen-transition-protocol-20260917
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.8
      - run: python -m ruff check --select I001 --fix work/tests/test_ui_fixed_tables.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add work/tests/test_ui_fixed_tables.py
            git commit -m "Normalize fixed-table test imports"
            git push origin HEAD:fix/retail-kouhen-transition-protocol-20260917
          fi
