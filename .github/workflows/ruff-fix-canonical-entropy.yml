name: ruff fix canonical entropy

on:
  push:
    branches:
      - tmp/black-canonical-entropy-20260911
    paths:
      - .github/workflows/ruff-fix-canonical-entropy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.7
      - run: python -m ruff check --fix work/time_twist/release_build.py
      - name: Commit Ruff fix
        shell: bash
        run: |
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work/time_twist/release_build.py
          git diff --cached --quiet || git commit -m "Apply Ruff import fix"
          git push origin HEAD:refs/heads/tmp/black-canonical-entropy-20260911
