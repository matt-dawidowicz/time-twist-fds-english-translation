name: measure-tt1a-optimized

on:
  push:
    branches:
      - translation/personality-questions-final-20260904-temp

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation/personality-questions-final-20260904-temp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Measure TT1A footprints
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "work")

          from generate_translation_workbook import PATCH_FOOTPRINT_RESULTS
          from tests.test_live_translation_fit import _load_groups
          from time_twist.capacity import playable_capacity
          from time_twist.compression import compress_english_groups, packed_size
          from time_twist.project import required_dictionary_entries
          from time_twist.textcodec import EXTENDED_DICTIONARY_ENTRY_COUNT

          bank = "TT1A"
          groups = _load_groups(bank)
          capacity = playable_capacity(
              bank, PATCH_FOOTPRINT_RESULTS[bank]["capacity"]
          )
          pointer_bytes = 2 * (len(groups) - 1)
          kwargs = dict(
              required_entries=required_dictionary_entries(bank),
              max_bytes=capacity - pointer_bytes,
              maximum_entries=EXTENDED_DICTIONARY_ENTRY_COUNT,
          )
          for label, optimize in (("GREEDY", False), ("OPTIMIZED", True)):
              compressed, dictionary = compress_english_groups(
                  groups,
                  optimize=optimize,
                  **kwargs,
              )
              used = packed_size(compressed, dictionary) + pointer_bytes
              print(
                  f"{label} TT1A: {used}/{capacity} "
                  f"({capacity - used} bytes free; {len(dictionary)} entries)"
              )
          PY
