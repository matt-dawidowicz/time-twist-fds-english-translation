name: NOV2 missing system text once

on:
  push:
    branches:
      - translation-quality-comparison-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch missing NOV2 save-system text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ui_path = Path('work/time_twist/ui.py')
          text = ui_path.read_text(encoding='utf-8')
          constant_marker = '''ENGLISH_WAIT_PROMPT = pack_records([encode_english("Please wait... ")])\n\n# ---------------------------------------------------------------------------\n# Kouhen direct-boot guard (SON-KOUH)\n'''
          constant_block = '''ENGLISH_WAIT_PROMPT = pack_records([encode_english("Please wait... ")])\n\n# The save subsystem contains six additional fixed records that were still\n# Japanese in the English runtime image. Keep each source allocation exact:\n# these records sit among executable NOV2 data and other independently\n# addressed strings. The first two preserve the source line controls.\nNOV2_SAVE_SYSTEM_PATCHES = (\n    (\n        0x25E6,\n        bytes.fromhex(\n            "0F 71 BF 9A 03 77 19 BF 19 AD C6 FF 24 60 E6 EE 33 7E 0D A3 7E 36 AE D3 68 FA"\n        ),\n        "A RAM Save{CTRL:0}B Disk{CTRL:0}Select Cancel ",\n    ),\n    (\n        0x2600,\n        bytes.fromhex("C9 69 8C 1C DD C6 6F C1 69 D0 2C CC 7D"),\n        "Saving{CTRL:0}to disk. ",\n    ),\n    (0x2631, bytes.fromhex("2F 5A 13 38 B8 7E 80"), "Chapter"),\n    (\n        0x263A,\n        bytes.fromhex("C9 69 8C 1E E4 E6 CD D1 F4"),\n        "Disk error",\n    ),\n    (0x2643, bytes.fromhex("13 3A 1D 1F 40"), "Store"),\n    (0x264C, bytes.fromhex("12 20 71 E6 7D"), "Fetch"),\n)\n\n# ---------------------------------------------------------------------------\n# Kouhen direct-boot guard (SON-KOUH)\n'''
          if constant_marker not in text:
              raise SystemExit('NOV2 constant marker missing')
          text = text.replace(constant_marker, constant_block, 1)

          function_marker = '''\n\ndef _patched_opaque_text_clears(data: bytes) -> bytes:\n'''
          function_block = '''\n\ndef _patched_save_system_text(data: bytes) -> bytes:\n    """Translate the remaining fixed NOV2 save-system records."""\n    result = bytearray(data)\n    for offset, original, english in NOV2_SAVE_SYSTEM_PATCHES:\n        replacement = pack_records([encode_english(english)])\n        if len(replacement) != len(original):\n            raise UiPatchError(\n                f"NOV2 save-system text at 0x{offset:04X} changed packed size"\n            )\n        end = offset + len(original)\n        if len(result) < end or result[offset:end] != original:\n            raise UiPatchError(\n                f"NOV2 save-system text at 0x{offset:04X} does not match source"\n            )\n        result[offset:end] = replacement\n    return bytes(result)\n\n\ndef _patched_opaque_text_clears(data: bytes) -> bytes:\n'''
          if function_marker not in text:
              raise SystemExit('NOV2 function marker missing')
          text = text.replace(function_marker, function_block, 1)

          call_old = '''    with_wait_prompt = _patched_wait_prompt(data)\n    with_disk_prompts = _patched_disk_prompts(with_wait_prompt)\n'''
          call_new = '''    with_wait_prompt = _patched_wait_prompt(data)\n    with_save_system_text = _patched_save_system_text(with_wait_prompt)\n    with_disk_prompts = _patched_disk_prompts(with_save_system_text)\n'''
          if call_old not in text:
              raise SystemExit('NOV2 patch-order marker missing')
          text = text.replace(call_old, call_new, 1)
          text = text.replace(
              '        translations, opaque menu-tail clearing, and the one-choice B guard.\n',
              '        translations, complete save-system text, opaque menu-tail clearing, and the one-choice B guard.\n',
              1,
          )
          ui_path.write_text(text, encoding='utf-8')

          test_path = Path('work/tests/test_ui_fixed_tables.py')
          test = test_path.read_text(encoding='utf-8')
          test_marker = '''    def test_disk_copy_is_title_case_and_exactly_size_neutral(self) -> None:\n'''
          test_method = '''    def test_nov2_save_system_text_is_complete_and_size_neutral(self) -> None:\n        """Translate the six save-system records that previously stayed Japanese."""\n        self.assertEqual(\n            tuple(patch[2] for patch in ui.NOV2_SAVE_SYSTEM_PATCHES),\n            (\n                "A RAM Save{CTRL:0}B Disk{CTRL:0}Select Cancel ",\n                "Saving{CTRL:0}to disk. ",\n                "Chapter",\n                "Disk error",\n                "Store",\n                "Fetch",\n            ),\n        )\n        for offset, original, replacement in ui.NOV2_SAVE_SYSTEM_PATCHES:\n            with self.subTest(offset=offset, replacement=replacement):\n                self.assertEqual(\n                    len(pack_records([encode_english(replacement)])),\n                    len(original),\n                )\n\n'''
          if test_marker not in test:
              raise SystemExit('NOV2 test insertion marker missing')
          test = test.replace(test_marker, test_method + test_marker, 1)
          test_path.write_text(test, encoding='utf-8')

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          existing = {item['id'] for item in audit['changes']}
          changes = [
              {
                  'id': 'NOV2/system/save_destination',
                  'japanese': 'えー らむせーぶ{CTRL:0}びー ですくせーぶ{CTRL:0}せる きゃんせる',
                  'previous_english': '(untranslated Japanese source bytes)',
                  'new_english': 'A RAM Save{CTRL:0}B Disk{CTRL:0}Select Cancel ',
                  'category': ['translation_completeness', 'system_ui', 'instruction_clarity'],
                  'reason': 'Translate the RAM-save/disk-save destination chooser and expand the source SEL controller abbreviation to Select while retaining Cancel.',
                  'external_difference_triggered_review': True,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': None,
                  'encoded_byte_delta': 0,
                  'encoded_byte_delta_note': 'Replacement remains exactly 26 packed bytes.',
              },
              {
                  'id': 'NOV2/system/saving_status',
                  'japanese': 'でぃすくせーぶ{CTRL:0}しとるからの',
                  'previous_english': '(untranslated Japanese source bytes)',
                  'new_english': 'Saving{CTRL:0}to disk. ',
                  'category': ['translation_completeness', 'system_ui'],
                  'reason': 'Render the disk-save-in-progress status naturally while preserving its source line control.',
                  'external_difference_triggered_review': True,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': None,
                  'encoded_byte_delta': 0,
                  'encoded_byte_delta_note': 'Replacement remains exactly 13 packed bytes.',
              },
              {
                  'id': 'NOV2/system/chapter_start',
                  'japanese': 'しょうはじめ',
                  'previous_english': '(untranslated Japanese source bytes)',
                  'new_english': 'Chapter',
                  'category': ['translation_completeness', 'system_ui'],
                  'reason': 'Translate the chapter-start system label within its seven-byte fixed record.',
                  'external_difference_triggered_review': True,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': None,
                  'encoded_byte_delta': 0,
                  'encoded_byte_delta_note': 'Replacement remains exactly 7 packed bytes.',
              },
              {
                  'id': 'NOV2/system/disk_trouble',
                  'japanese': 'でぃすく、とらぶる',
                  'previous_english': '(untranslated Japanese source bytes)',
                  'new_english': 'Disk error',
                  'category': ['translation_completeness', 'system_ui', 'naturalness'],
                  'reason': 'Translate the literal disk-trouble message as the conventional English system wording Disk error.',
                  'external_difference_triggered_review': True,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': None,
                  'encoded_byte_delta': 0,
                  'encoded_byte_delta_note': 'Replacement remains exactly 9 packed bytes.',
              },
              {
                  'id': 'NOV2/system/ram_store',
                  'japanese': 'おぼえる',
                  'previous_english': '(untranslated Japanese source bytes)',
                  'new_english': 'Store',
                  'category': ['translation_completeness', 'system_ui', 'terminology'],
                  'reason': 'Localize the RAM-memory remember/store command distinctly from the neighboring literal disk Save command.',
                  'external_difference_triggered_review': True,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': None,
                  'encoded_byte_delta': 0,
                  'encoded_byte_delta_note': 'Replacement remains exactly 5 packed bytes.',
              },
              {
                  'id': 'NOV2/system/ram_fetch',
                  'japanese': 'おもいだす',
                  'previous_english': '(untranslated Japanese source bytes)',
                  'new_english': 'Fetch',
                  'category': ['translation_completeness', 'system_ui', 'terminology'],
                  'reason': 'Localize the paired RAM-memory recall/retrieve command distinctly from the neighboring literal disk Load command.',
                  'external_difference_triggered_review': True,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': None,
                  'encoded_byte_delta': 0,
                  'encoded_byte_delta_note': 'Replacement remains exactly 5 packed bytes.',
              },
          ]
          duplicates = [item['id'] for item in changes if item['id'] in existing]
          if duplicates:
              raise SystemExit(f'audit entries already exist: {duplicates}')
          audit['changes'].extend(changes)
          audit_path.write_text(\n              json.dumps(audit, ensure_ascii=False, indent=2) + '\\n',\n              encoding='utf-8',\n          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Format and test NOV2 changes
        run: |
          python -m black work/time_twist/ui.py work/tests/test_ui_fixed_tables.py
          python -m ruff check work/time_twist/ui.py work/tests/test_ui_fixed_tables.py
          python -m pydocstyle --convention=pep257 work/time_twist/ui.py work/tests/test_ui_fixed_tables.py
          python -m mypy
          python -m unittest work.tests.test_ui_fixed_tables
          python work/run_tests.py unit
      - name: Commit patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nov2_missing_system_text_once.yml
          git add work/time_twist/ui.py work/tests/test_ui_fixed_tables.py work/audits/translation_quality_changes.json
          git commit -m 'Translate missing NOV2 save-system text'
          git pull --rebase origin translation-quality-comparison-audit
          git push origin HEAD:translation-quality-comparison-audit
