name: temporary-format-repair

on:
  push:
    branches:
      - fix/entropy-codec-architecture-20260910

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/entropy-codec-architecture-20260910
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install black==25.1.0
      - name: Apply exact Black output
        run: |
          python -m black work
          if git diff --quiet -- work; then
            echo "Black tree already current"
            exit 0
          fi
          git config user.name "starlight_world"
          git config user.email "43389528+matt-dawidowicz@users.noreply.github.com"
          git add work
          git commit -m "Format production runtime sources with Black"
          git push origin HEAD:fix/entropy-codec-architecture-20260910
