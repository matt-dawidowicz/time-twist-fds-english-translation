name: Publish v1.0 binaries into repository

on:
  push:
    branches:
      - release/publish-v1.0-binaries
    paths:
      - '.github/workflows/publish-v1.0-binaries.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/publish-v1.0-binaries
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build release package
        shell: powershell
        run: ./release_patcher/build_windows.ps1
      - name: Copy distributables into repository
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Time-Twist-English-v1.0-Windows.zip release/Time-Twist-English-v1.0-Windows.zip -Force
          Copy-Item dist/Time-Twist-English-v1.0-Zenpen.bps release/Time-Twist-English-v1.0-Zenpen.bps -Force
          Copy-Item dist/Time-Twist-English-v1.0-Kouhen.bps release/Time-Twist-English-v1.0-Kouhen.bps -Force
      - name: Commit distributables
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          if (git diff --cached --quiet) {
            Write-Host "No release binary changes."
            exit 0
          }
          git commit -m "Publish Time Twist v1.0 Windows patcher and BPS files"
          git push origin HEAD:release/publish-v1.0-binaries
