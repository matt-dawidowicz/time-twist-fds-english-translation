name: tt1b-intent-pass1

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/tt1b-intent-pass1.yml

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore reviewed TT1B intent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('work/translations/TT1B.json')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '  "TT1B/g0/r31": "Me: You mean you\'re...{CTRL:0}Devil: Call me a devil.{CTRL:0}Me: G-g-g-gah!{CTRL:6}Devil: My ceaseless{CTRL:4}telepathy paid off.{CTRL:4}Me: ........",':
              '  "TT1B/g0/r31": "Me: No way... You mean{CTRL:0}you\'re...{CTRL:0}Devil: I am what you{CTRL:0}might call... a devil.{CTRL:0}Me: G-g-g-gah!{CTRL:6}Devil: All that patient{CTRL:4}telepathy has finally{CTRL:0}paid off.{CTRL:4}Me: ........",',
              '  "TT1B/g1/r14": "Me: You\'re busty... heh{CTRL:1}Girl: Eek!",':
              '  "TT1B/g1/r14": "Me: You\'ve got quite a{CTRL:0}pair... heh-heh.{CTRL:1}Girl: Eek!",',
              '  "TT1B/g2/r5": "...: I\'ve lived here{CTRL:0}40 years! Won\'t leave!{CTRL:2}Me: I\'m no land shark.{CTRL:6}...: Oh! My apologies.",':
              '  "TT1B/g2/r5": "...: I\'ve lived in this{CTRL:0}house for 40 years!{CTRL:0}I can\'t just leave now!{CTRL:2}Me: I\'m no land shark.{CTRL:6}...: Oh! I-I\'m terribly{CTRL:0}sorry.",',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('work/time_twist/scenario_validation.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "TT1B/g0/r1",\n'''
          new = '''        "TT1B/g0/r1",\n        # まさか あんた…… / いわゆるひとつの あくまだ\n        # Preserve the protagonist's disbelief and the Devil's intentionally\n        # roundabout comic self-identification across safe English rows.\n        "TT1B/g0/r31",\n        # けっこう ぼいんですね ひひ…\n        # Preserve both the dated leering joke and its embarrassed response.\n        "TT1B/g1/r14",\n        # このいえにすんで もう40ねん / いまさら でていけるものか\n        # Preserve the resident's house/forty-years indignation and flustered\n        # apology rather than the earlier telegraphic fit wording.\n        "TT1B/g2/r5",\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('work/generate_translation_workbook.py')
          text = path.read_text(encoding='utf-8')
          # Update the reviewed unconstrained reading for the land-shark exchange
          # to the source-faithful wording now actually targeted by the playable map.
          old = '''    "TT1B/g2/r5": (\n        "Resident: I've lived in this house for forty years! I'm not leaving now! "\n        "/ Protagonist: I'm not one of those developers trying to force you out. "\n        "/ Resident: Oh! I-I'm terribly sorry."\n    ),'''
          new = '''    "TT1B/g2/r5": (\n        "Resident: I've lived in this house for 40 years! I can't just leave now! "\n        "/ Protagonist: I'm no land shark. / Resident: Oh! I-I'm terribly sorry."\n    ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          # Keep legacy proposal data consistent even though work/translations is
          # the playable authority.
          old = '''    "TT1B/g0/r31": (\n        "Me: You mean you're...{CTRL:0}Devil: You might say so.{CTRL:0}"\n        "Me: G-g-g-gah!{CTRL:6}Devil: My telepathy{CTRL:4}"\n        "finally paid off.{CTRL:4}Me: ........"\n    ),'''
          new = '''    "TT1B/g0/r31": (\n        "Me: No way... You mean{CTRL:0}you're...{CTRL:0}"\n        "Devil: I am what you{CTRL:0}might call... a devil.{CTRL:0}"\n        "Me: G-g-g-gah!{CTRL:6}Devil: All that patient{CTRL:4}"\n        "telepathy has finally{CTRL:0}paid off.{CTRL:4}Me: ........"\n    ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    "TT1B/g1/r14": "Me: You're busty. Heh...{CTRL:1}Girl: Eek!",'''
          new = '''    "TT1B/g1/r14": (\n        "Me: You've got quite a{CTRL:0}pair... heh-heh.{CTRL:1}Girl: Eek!"\n    ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    "TT1B/g2/r5": (\n        "...: I've lived here{CTRL:0}40 years! I won't leave!{CTRL:2}"\n        "Me: I'm no land shark.{CTRL:6}...: Oh! Sorry."\n    ),'''
          new = '''    "TT1B/g2/r5": (\n        "...: I've lived in this{CTRL:0}house for 40 years!{CTRL:0}"\n        "I can't just leave now!{CTRL:2}Me: I'm no land shark.{CTRL:6}"\n        "...: Oh! I-I'm terribly{CTRL:0}sorry."\n    ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          # These records have now had their prior compression-driven nuance gap
          # explicitly addressed; do not regenerate the obsolete shortest-basis note.
          anchor = 'CONTROL_OVERRIDE_IDS = UI_CONTROL_OVERRIDE_IDS | PRESENTATION_BREAK_RECORD_IDS\n'
          addition = '''CONTROL_OVERRIDE_IDS = UI_CONTROL_OVERRIDE_IDS | PRESENTATION_BREAK_RECORD_IDS\nINTENT_RESTORED_IDS = frozenset(\n    {"TT1B/g0/r1", "TT1B/g0/r31", "TT1B/g1/r14", "TT1B/g2/r5"}\n)\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition, 1)
          old = '''    if patch == source_row[\n        "current_english_exact"\n    ] and final != naturalize_current(patch):\n        nuance = (\n            "The verified current slot-sized wording is retained as the shortest "\n            "available basis; the fuller natural translation must be tested during "\n            "bank recompression."\n        )\n'''
          new = '''    if (\n        source_row["text_id"] not in INTENT_RESTORED_IDS\n        and patch == source_row["current_english_exact"]\n        and final != naturalize_current(patch)\n    ):\n        nuance = (\n            "The playable wording still differs from the reviewed natural reading. "\n            "Re-evaluate it under the intent-first layout/compression workflow; "\n            "earlier compact wording is not authoritative merely because it fit."\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        "TT1B/g0/r31": (\n            "Resolved in the playable text: the unfinished recognition, the "\n            "Devil's roundabout comic reply, and the delayed payoff in his "\n            "telepathy boast are all retained."\n        ),\n        "TT1B/g1/r14": (\n            "Resolved in the playable text: 'busty' directly preserves the dated, "\n            "leering ボイン joke, while the girl's embarrassed protest remains."\n        ),'''
          new = '''        "TT1B/g0/r31": (\n            "Resolved in the playable text: the protagonist's disbelief, the "\n            "Devil's Nagashima-like roundabout comic reply, and the patient "\n            "telepathy payoff are restored across audited presentation rows."\n        ),\n        "TT1B/g1/r14": (\n            "Resolved in the playable text: the dated, leering ボイン joke keeps "\n            "both the 'quite a pair' wording and the heh-heh laugh, while the "\n            "girl's embarrassed protest remains."\n        ),\n        "TT1B/g2/r5": (\n            "Resolved in the playable text: the resident's forty-year attachment "\n            "to this house, disbelief at leaving now, and flustered polite apology "\n            "are restored; 'land shark' retains the 地上げ屋 social meaning."\n        ),'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        "TT1B/g0/r31",\n        "TT1B/g1/r14",\n        "TT6A/g0/r13",'''
          new = '''        "TT1B/g0/r31",\n        "TT1B/g1/r14",\n        "TT1B/g2/r5",\n        "TT6A/g0/r13",'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Improve audit normalization so editorial speaker labels and ellipsis
          # encoding do not masquerade as semantic gaps.
          path = Path('work/tools/translation_intent_audit.py')
          text = path.read_text(encoding='utf-8')
          old = 'CONTROL_RE = re.compile(r"\\{CTRL:\\d+\\}")\n'
          new = '''CONTROL_RE = re.compile(r"\\{CTRL:\\d+\\}")\nDOT_RUN_RE = re.compile(r"\\.{3,}")\nSPEAKER_LABEL_EQUIVALENTS = {\n    "Protagonist:": "Me:",\n    "Resident:": "...:",\n    "Elder:": "...:",\n}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''    text = unicodedata.normalize("NFKC", visible_text(text))\n    text = text.translate(TYPOGRAPHY_TRANSLATION)\n    return " ".join(text.split()).strip()\n'''
          new = '''    text = unicodedata.normalize("NFKC", visible_text(text))\n    text = text.translate(TYPOGRAPHY_TRANSLATION)\n    text = text.replace(" / ", " ")\n    for editorial, playable in SPEAKER_LABEL_EQUIVALENTS.items():\n        text = text.replace(editorial, playable)\n    text = DOT_RUN_RE.sub("...", text)\n    return " ".join(text.split()).strip()\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('work/tests/test_translation_intent_audit.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    def test_typography_only_difference_is_not_an_intent_gap(self) -> None:\n'''
          test = '''    def test_editorial_speaker_labels_do_not_create_false_gap(self) -> None:\n        """Treat Protagonist/Me and review slashes as metadata, not wording."""\n        row = scenario_row(\n            final_natural_english_translation=(\n                "Protagonist: H-hello. / Girl: Hello…"\n            ),\n            patch_safe_english_translation=(\n                "Me: H-hello.{CTRL:1}Girl: Hello..."\n            ),\n        )\n\n        self.assertIsNone(score_row(row))\n\n'''
          assert anchor in text
          assert 'test_editorial_speaker_labels_do_not_create_false_gap' not in text
          path.write_text(text.replace(anchor, test + anchor, 1), encoding='utf-8')

          path = Path('work/audits/TT1B_voice_and_prose_pilot.md')
          text = path.read_text(encoding='utf-8')
          old = '- `Devil: You might say so.` -> `Devil: Call me a devil.`'
          new = '- `Devil: Call me a devil.` -> `Devil: I am what you / might call... a devil.` (restores the source\'s Nagashima-like comic verbal padding)'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          marker = '## Historical capacity discipline — superseded\n'
          addition = '''## Intent-restoration pass 1 — 2026-09-03\n\nThe first ranked intent-gap pass restores three records whose workbook already\nrecorded compression-driven nuance loss:\n\n- `TT1B/g0/r31`: restores the protagonist's disbelief, the Devil's roundabout\n  `いわゆるひとつの` cadence, and `しんぼうづよく` patient persistence in the\n  telepathy payoff.\n- `TT1B/g1/r14`: restores the full dated/objectifying `ボイン` gag as “You've got\n  quite a pair... heh-heh,” including the leering laugh and the girl's protest.\n- `TT1B/g2/r5`: restores the resident's “this house / 40 years / can't just leave\n  now” indignation and his flustered polite apology; `land shark` remains the\n  social-effect localization of bubble-era `地上げ屋`.\n\nAll added controls in these records are `CTRL:0` presentation rows; source\ncontrols remain in order. Every visible segment is at or below the project's\n23-character practical row target. These new English-only presentation contexts\nremain runtime-playtest gates before release promotion.\n\n'''
          assert marker in text
          text = text.replace(marker, addition + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and regenerate review corpus
        run: |
          python -m black work/time_twist/scenario_validation.py work/generate_translation_workbook.py work/tools/translation_intent_audit.py work/tests/test_translation_intent_audit.py
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Validate Python source and live fit
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
      - name: Build and validate Rust optimizer
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
          cargo test --manifest-path native/compression_optimizer/Cargo.toml
          cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
          TIME_TWIST_NATIVE_OPTIMIZER="$PWD/native/compression_optimizer/target/release/time-twist-compression-optimizer" \
            python -m unittest discover -s work/tests -p 'test_compression_native.py'
      - name: Measure TT1B after intent restoration
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: |
          python work/tools/compression_headroom.py --project-root . --bank TT1B --backend native --json | tee /tmp/tt1b-headroom.json
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --limit 20 | tee /tmp/tt1b-intent.md
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/tt1b-headroom.json').read_text())[0]
          assert result['optimized_packed_bytes'] <= result['capacity_bytes'], result
          print('TT1B optimized headroom:', result['optimized_headroom_bytes'])
          PY
      - name: Remove temporary workflow and snapshot old queue
        run: |
          rm .github/workflows/tt1b-intent-pass1.yml
          rm -f work/audits/TT1B_intent_gap_queue.md work/audits/TT1B_intent_gap_queue.json
          cp /tmp/tt1b-intent.md work/audits/TT1B_intent_gap_queue.md
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --limit 40 --json > work/audits/TT1B_intent_gap_queue.json
          rm -rf work/__pycache__ work/time_twist/__pycache__ work/tests/__pycache__ work/time_twist_fds_tools.egg-info native/compression_optimizer/target
      - name: Commit verified pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore first ranked TT1B intent gaps"
          git push origin HEAD:engineering/editorial-compression-20260902
