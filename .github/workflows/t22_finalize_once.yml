name: T22 finalize once

on:
  push:
    branches: [translation-quality-comparison-audit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Apply T22 source-grounded revisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/translations/T22.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['T22/g0/r22'] = 'Light leaks from inside.'
          data['T22/g0/r28'] = 'Opened... a secret path!'
          data['T22/g1/r6'] = 'Bishop: She will burn,{CTRL:0}once a crowd gathers.{CTRL:0}A public lesson is best.{CTRL:6}Ho ho ho...'
          data['T22/g1/r7'] = "Bishop: Jeanne d'Arc,{CTRL:0}Lugot's granddaughter,{CTRL:0}Devil-baptized, depraved{CTRL:6}Church orders her death."
          data['T22/g1/r17'] = "Man: Damn, can't watch.{CTRL:0}Man: God help her!"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          changes = audit['changes']
          existing = {item['id'] for item in changes}
          additions = [
            {
              'id': 'T22/g0/r22',
              'japanese': 'なかから ひかりがもれてる……',
              'previous_english': 'Light leaks in...',
              'new_english': 'Light leaks from inside.',
              'category': ['fidelity', 'directionality'],
              'reason': 'Correct the direction in なかから: the light is leaking from inside, not leaking inward.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 7,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            },
            {
              'id': 'T22/g0/r28',
              'japanese': 'あいた…… ひみつのつうろだ',
              'previous_english': 'It opened... a passage!',
              'new_english': 'Opened... a secret path!',
              'category': ['omitted_detail', 'source_specificity'],
              'reason': 'Restore ひみつ: the newly opened route is explicitly a secret passage.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 1,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            },
            {
              'id': 'T22/g1/r6',
              'japanese': 'しきょう「これから このむすめのひあぶりを{CTRL:0} おこなうのだが… みせしめのため もっとひとが{CTRL:0} あつまってからのほうが おもしろいのう{CTRL:6} ふぉふぉふぉ……」',
              'previous_english': 'Bishop: She will burn,{CTRL:0}but first, draw a crowd.{CTRL:0}A public lesson is best.{CTRL:6}Ho ho ho...',
              'new_english': 'Bishop: She will burn,{CTRL:0}once a crowd gathers.{CTRL:0}A public lesson is best.{CTRL:6}Ho ho ho...',
              'category': ['fidelity', 'action_clarity'],
              'reason': 'Remove the invented instruction to draw a crowd. The Japanese says the bishop wants to wait until more people have gathered for the public example.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': -3,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            },
            {
              'id': 'T22/g1/r7',
              'japanese': 'しきょう「さかや るごーのまごむすめ{CTRL:0} じゃんぬ・だるくは あくまのせんれいをうけ{CTRL:0} みにくき よくぼうのとりこと なりはてた……{CTRL:6} よってきょうかいのなにより しけいにしょす」',
              'previous_english': "Bishop: Jeanne d'Arc,{CTRL:0}Lugot's granddaughter,{CTRL:0}Devil-baptized, depraved{CTRL:6}Church condemns her.",
              'new_english': "Bishop: Jeanne d'Arc,{CTRL:0}Lugot's granddaughter,{CTRL:0}Devil-baptized, depraved{CTRL:6}Church orders her death.",
              'category': ['omitted_detail', 'sentence_specificity'],
              'reason': 'Restore the explicit 死刑 sentence: the bishop is sentencing Jeanne to death in the Church\'s name, not merely condemning her abstractly.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 4,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            },
            {
              'id': 'T22/g1/r17',
              'japanese': '……「ちくしょう みちゃいられない…」{CTRL:0}……「かみさま…／」',
              'previous_english': 'Man: I cannot watch...{CTRL:0}Man: God help her!',
              'new_english': "Man: Damn, can't watch.{CTRL:0}Man: God help her!",
              'category': ['register', 'emotional_fidelity', 'naturalness'],
              'reason': 'Restore ちくしょう, the onlooker\'s angry expletive, while keeping the compact reaction natural.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 1,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            }
          ]
          for item in additions:
            if item['id'] not in existing:
              changes.append(item)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Measure live translation fit
        run: python -m unittest work.tests.test_live_translation_fit 2>&1 | tee /tmp/t22_fit.txt
      - name: Synchronize T22 baseline status
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('work/audits/external_translation_baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          summary = baseline['scenario_summary']
          summary['t22_full_source_review_complete'] = True
          summary['t22_source_records_reviewed'] = 58
          summary['t22_audited_revisions'] = 5
          summary['scenario_source_records_fully_reviewed'] = 609
          summary['scenario_banks_fully_reviewed'] = ['TT3A', 'TT3B', 'TT1B', 'TT1A', 'TT2', 'T22']

          fit_text = Path('/tmp/t22_fit.txt').read_text(encoding='utf-8')
          match = re.search(r'FIT T22: (\d+)/(\d+) \((\d+) bytes free;', fit_text)
          if not match:
              raise SystemExit('T22 fit line not found')
          used, capacity, free = map(int, match.groups())
          live = baseline['current_live_fit']
          live['measurement'] = 'canonical test_live_translation_fit.py after completed source review through T22'
          for item in live['banks']:
              if item['bank'] == 'T22':
                  item.update(used=used, capacity=capacity, free=free)
                  break
          else:
              raise SystemExit('T22 bank row missing')
          live['t22_free_after_five_revisions'] = free

          baseline['pending'] = [
              'complete external NOV2/NOV4 system-text alignment without assuming source offsets',
              'review fixed-label differences against Japanese and gameplay context',
              'review TT6C source-grounded scenario text next, then continue bank by bank',
              'perform final rebuilt-ROM and emulator validation after editorial review'
          ]
          path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'T22 FIT FINAL {used}/{capacity}; {free} bytes free')
          PY
      - name: Verify Python style
        run: |
          python -m black work/tests/test_nov2_save_system.py
          python -m black --check work
          python -m ruff check work
      - name: Run unit suite
        run: python work/run_tests.py unit
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/t22_finalize_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete source-grounded T22 review"
          git push origin HEAD:translation-quality-comparison-audit
