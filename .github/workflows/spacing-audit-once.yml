name: spacing-audit-once

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest work.tests.test_production_typography -v
