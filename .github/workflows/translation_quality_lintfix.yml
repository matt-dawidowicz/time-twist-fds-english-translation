name: translation-quality-lintfix

on:
  push:
    paths:
      - ".github/workflows/translation_quality_lintfix.yml"

permissions:
  contents: write

jobs:
  lintfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Capture Ruff diagnostics
        run: |
          python -m ruff check --fix work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py > work/audits/ruff_lint.txt 2>&1 || true
          cat work/audits/ruff_lint.txt
      - run: python -m black work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
      - name: Commit lint fixes and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py work/audits/ruff_lint.txt
          if git diff --cached --quiet; then
            echo "No lint changes or diagnostics"
          else
            git commit -m "Capture comparison-tool lint diagnostics"
            git push origin HEAD:translation-quality-comparison-audit
          fi
