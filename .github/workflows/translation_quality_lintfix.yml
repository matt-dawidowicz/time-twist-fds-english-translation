name: translation-quality-lintfix

on:
  push:
    paths:
      - ".github/workflows/translation_quality_lintfix.yml"

permissions:
  contents: write

jobs:
  lintfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check --fix work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
      - run: python -m black work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
          if git diff --cached --quiet; then
            echo "No lint fixes needed"
          else
            git commit -m "Apply comparison-tool lint fixes"
            git push origin HEAD:translation-quality-comparison-audit
          fi
