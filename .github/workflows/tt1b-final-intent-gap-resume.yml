name: tt1b-final-intent-gap-resume

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/tt1b-final-intent-gap-resume.yml

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply final TT1B semantic restoration robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Playable source.
          path = Path('work/translations/TT1B.json')
          text = path.read_text(encoding='utf-8')
          old = '"TT1B/g0/r28": "Me: Um...{CTRL:1}Girl: Seen everything?{CTRL:0}Me: No..."'
          new = '"TT1B/g0/r28": "Me: Um...{CTRL:1}Girl: Have you seen all{CTRL:0}the exhibits?{CTRL:0}Me: No..."'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Presentation-control policy.
          path = Path('work/time_twist/scenario_validation.py')
          text = path.read_text(encoding='utf-8')
          if '"TT1B/g0/r28"' not in text:
              anchor = '        "TT1B/g0/r1",\n'
              addition = (
                  anchor
                  + '        # てんじひん ぜんぶみました！ / いえ……\n'
                  + '        # The following "No" establishes the interrogative reading; retain the\n'
                  + '        # complete question across one additional presentation row.\n'
                  + '        "TT1B/g0/r28",\n'
              )
              assert text.count(anchor) == 1
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('work/generate_translation_workbook.py')
          text = path.read_text(encoding='utf-8')

          # Mark as intentionally restored so the generator does not recreate the
          # historical "compact wording" nuance-loss note.
          restored_match = re.search(
              r'INTENT_RESTORED_IDS = frozenset\(\n(?P<body>.*?)\n\)',
              text,
              flags=re.S,
          )
          assert restored_match is not None
          body = restored_match.group('body')
          if '"TT1B/g0/r28"' not in body:
              if '"TT1B/g0/r1",' in body:
                  body = body.replace(
                      '"TT1B/g0/r1",',
                      '"TT1B/g0/r1", "TT1B/g0/r28",',
                      1,
                  )
              else:
                  raise AssertionError('TT1B/g0/r1 missing from INTENT_RESTORED_IDS')
              text = text[:restored_match.start('body')] + body + text[restored_match.end('body'):]

          # Keep the legacy proposal mirror consistent with the playable authority.
          old = (
              '    "TT1B/g0/r28": (\n'
              '        "Me: Um...{CTRL:1}Girl: Seen everything?{CTRL:0}Me: No..."\n'
              '    ),'
          )
          new = (
              '    "TT1B/g0/r28": (\n'
              '        "Me: Um...{CTRL:1}Girl: Have you seen all{CTRL:0}"\n'
              '        "the exhibits?{CTRL:0}Me: No..."\n'
              '    ),'
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          # The semantic uncertainty is resolved by the protagonist's immediate
          # いえ ("No"). Runtime verification is now only for the extra display row.
          ambiguity_pattern = re.compile(
              r'    if text_id == "TT1B/g0/r28":\n'
              r'        return \(\n'
              r'            "Punctuation alone permits statement/question readings, but the reply "\n'
              r'            "いえ strongly favors a question\."\n'
              r'            "Medium",\n'
              r'            True,\n'
              r'        \)\n'
          )
          replacement = (
              '    if text_id == "TT1B/g0/r28":\n'
              '        return ("", "High", False)\n'
          )
          text, count = ambiguity_pattern.subn(replacement, text, count=1)
          assert count == 1, 'failed to replace TT1B/g0/r28 ambiguity block'

          # Rewrite the explanatory note from "strongest reading" to resolved
          # contextual reading, while explicitly preserving the runtime layout gate.
          old_fragment = (
              '            "reply いえ (\'no\') makes \'Have you seen all the exhibits?\' the strongest "\n'
              '            "contextual reading."\n'
          )
          new_fragment = (
              '            "immediate reply いえ (\'no\') resolves the exchange as \'Have you seen all "\n'
              '            "the exhibits?\' The remaining verification requirement is the added "\n'
              '            "English presentation row, not the semantic reading."\n'
          )
          assert text.count(old_fragment) == 1
          text = text.replace(old_fragment, new_fragment, 1)

          path.write_text(text, encoding='utf-8')

          # Document the resolution in the maintained TT1B audit.
          path = Path('work/audits/TT1B_voice_and_prose_pilot.md')
          text = path.read_text(encoding='utf-8')
          if '`TT1B/g0/r28`: restores “Have you seen all the exhibits?”' not in text:
              anchor = '- `TT1B/g0/r31`: restores the protagonist\'s disbelief, the Devil\'s roundabout\n'
              addition = (
                  '- `TT1B/g0/r28`: restores “Have you seen all the exhibits?” rather than the\n'
                  '  compressed “Seen everything?” The following いえ (“No…”) resolves the line as\n'
                  '  a question; the added `CTRL:0` remains a presentation/runtime gate.\n'
              )
              assert anchor in text
              text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and regenerate review corpus
        run: |
          python -m black work/time_twist/scenario_validation.py work/generate_translation_workbook.py
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Require zero remaining TT1B semantic intent gaps
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --json > /tmp/tt1b-intent.json
          cat /tmp/tt1b-intent.json
          python - <<'PY'
          import json
          from pathlib import Path
          gaps = json.loads(Path('/tmp/tt1b-intent.json').read_text())
          assert gaps == [], gaps
          PY
      - name: Validate Python source and live fit
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
      - name: Build and validate Rust optimizer
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
          cargo test --manifest-path native/compression_optimizer/Cargo.toml
          cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
          TIME_TWIST_NATIVE_OPTIMIZER="$PWD/native/compression_optimizer/target/release/time-twist-compression-optimizer" \
            python -m unittest discover -s work/tests -p 'test_compression_native.py'
      - name: Measure TT1B final intent-pass headroom
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: |
          python work/tools/compression_headroom.py --project-root . --bank TT1B --backend native --json | tee /tmp/tt1b-headroom.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/tt1b-headroom.json').read_text())[0]
          assert result['optimized_packed_bytes'] <= result['capacity_bytes'], result
          print('TT1B optimized headroom:', result['optimized_headroom_bytes'])
          PY
      - name: Refresh TT1B queue and remove temporary workflows
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B > work/audits/TT1B_intent_gap_queue.md
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --json > work/audits/TT1B_intent_gap_queue.json
          rm -f .github/workflows/tt1b-final-intent-gap.yml .github/workflows/tt1b-final-intent-gap-resume.yml
          rm -rf work/__pycache__ work/time_twist/__pycache__ work/tests/__pycache__ work/time_twist_fds_tools.egg-info native/compression_optimizer/target
      - name: Commit verified TT1B completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete TT1B intent-first text audit"
          git push origin HEAD:engineering/editorial-compression-20260902
