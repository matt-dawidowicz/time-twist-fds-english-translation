name: Translation quality TT3A finish once

on:
  push:
    branches:
      - translation-quality-comparison-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-grounded TT3A review findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          translation_path = Path('work/translations/TT3A.json')
          translations = json.loads(translation_path.read_text(encoding='utf-8'))
          expected = {
              'TT3A/g2/r0': 'Ralph: Change after you{CTRL:0}escape, dirt soils it.',
              'TT3A/g3/r18': 'The water hides it.',
          }
          replacements = {
              'TT3A/g2/r0': "Ralph: Change once free.{CTRL:0}They'll get dirty.",
              'TT3A/g3/r18': 'Hard to see underwater.',
          }
          for key, old in expected.items():
              if translations.get(key) != old:
                  raise SystemExit(f'unexpected current text for {key}: {translations.get(key)!r}')
              translations[key] = replacements[key]
          translation_path.write_text(
              json.dumps(translations, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          existing = {item['id'] for item in audit['changes']}
          additions = [
              {
                  'id': 'TT3A/g2/r0',
                  'japanese': 'らるふ「きがえは だっそうしてからだ{CTRL:0} つちで よごれてしまう」',
                  'previous_english': 'Ralph: Change after you{CTRL:0}escape, dirt soils it.',
                  'new_english': "Ralph: Change once free.{CTRL:0}They'll get dirty.",
                  'category': ['naturalness', 'instruction_clarity'],
                  'reason': 'Render the escape-clothes timing naturally: Ralph says to change only after escaping because the clothes would get dirty beforehand.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': -3,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measure after bank rebuild/compression; visible characters are not packed-byte cost.',
              },
              {
                  'id': 'TT3A/g3/r18',
                  'japanese': 'みずのなかなので よく みえない',
                  'previous_english': 'The water hides it.',
                  'new_english': 'Hard to see underwater.',
                  'category': ['fidelity', 'naturalness'],
                  'reason': 'Render the source causally and directly: because the object is underwater, it is hard to see clearly.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': 4,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measure after bank rebuild/compression; visible characters are not packed-byte cost.',
              },
          ]
          duplicates = [item['id'] for item in additions if item['id'] in existing]
          if duplicates:
              raise SystemExit(f'audit entries already exist: {duplicates}')
          audit['changes'].extend(additions)
          audit_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate translation review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Measure live translation fit
        run: python work/tests/test_live_translation_fit.py
      - name: Commit reviewed source and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/translation_quality_tt3a_finish_once.yml
          git add work/translations/TT3A.json work/audits/translation_quality_changes.json outputs work/translation_workbook_banks
          git commit -m 'Finish source-grounded TT3A scenario review'
          git pull --rebase origin translation-quality-comparison-audit
          git push origin HEAD:translation-quality-comparison-audit
