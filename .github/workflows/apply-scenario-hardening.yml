name: apply scenario hardening

on:
  push:
    branches:
      - codex/scenario-validation-hardening

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/scenario-validation-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply reviewed hardening patch
        shell: bash
        run: |
          cat > /tmp/apply.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/apply.b64 | gzip -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format changed Python
        run: >-
          python -m black
          work/time_twist/scenario_validation.py
          work/time_twist/scenario.py
          work/time_twist/compression.py
          work/time_twist/project.py
          work/time_twist/cli.py
          work/time_twist/release.py
          work/tests/test_scenario_validation_hardening.py
      - name: Public tree policy
        run: python work/tools/check_public_tree.py
      - name: Ruff
        run: python -m ruff check work
      - name: Pydocstyle
        run: python -m pydocstyle --convention=pep257 work
      - name: Mypy
        run: python -m mypy
      - name: Unit tests
        run: python work/run_tests.py unit
      - name: Diff checks
        run: git diff --check
      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            work/time_twist/scenario_validation.py \
            work/time_twist/scenario.py \
            work/time_twist/compression.py \
            work/time_twist/project.py \
            work/time_twist/cli.py \
            work/time_twist/release.py \
            work/tests/test_scenario_validation_hardening.py \
            docs/SCENARIO_VALIDATION_HARDENING.md \
            docs/CLI_REFERENCE.md \
            docs/README.md \
            .github/workflows/apply-scenario-hardening.yml
          git diff --cached --check
          git commit -m "Harden scenario translation validation"
          git push origin HEAD:codex/scenario-validation-hardening
