name: architecture polish phase 1 final retry

on:
  push:
    branches: [codebase-architecture-polish]
    paths: [.github/workflows/architecture_polish_phase1_retry2.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codebase-architecture-polish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Reapply reviewed phase-one transformations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path(".github/workflows/architecture_polish_phase1_retry.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          wanted = (
              "Reorganize non-runtime tooling",
              "Decouple shared evidence and update imports",
              "Update path references and architecture docs",
              "Update permanent CI commands",
          )

          for name in wanted:
              marker = f"      - name: {name}"
              start = lines.index(marker)
              run_line = next(
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].startswith("        run: |")
              )
              body = []
              for line in lines[run_line + 1 :]:
                  if line.startswith("      - name:") or line.startswith("      - uses:") or line.startswith("      - run:"):
                      break
                  body.append(line[10:] if line.startswith("          ") else line)
              script = textwrap.dedent("\n".join(body)) + "\n"
              subprocess.run(["bash", "-euo", "pipefail", "-c", script], check=True)
          PY

      - name: Finish import migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("work/integration_tests/test_comparison_generation.py")
          text = path.read_text(encoding="utf-8")
          old = "from generate_bilingual_comparison import build_rows"
          new = "from tools.generation.generate_bilingual_comparison import build_rows"
          if old not in text:
              raise SystemExit("integration comparison import drifted")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify architecture and imports
        shell: bash
        run: |
          set -euo pipefail
          python -m black work tools
          python -m ruff check --fix work tools
          python -m ruff check work tools
          python -m pydocstyle --convention=pep257 work tools
          python -m mypy
          PYTHONPATH=work python -m compileall -q tools

          if git grep -n -E '^(from generate_translation_workbook|from generate_bilingual_comparison|import generate_bilingual_comparison|from tools\.(external_translation_compare|validate_translation_patch_fragments))' -- '*.py'; then
            echo "stale pre-refactor Python import found" >&2
            exit 1
          fi

      - name: Prove generated artifacts are byte-stable
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=work python -m tools.generation.generate_bilingual_comparison_ci
          PYTHONPATH=work python -m tools.generation.generate_translation_workbook
          git diff --exit-code -- outputs work/translation_workbook_banks

      - name: Run complete public unit suite
        run: python work/run_tests.py unit

      - name: Build and verify installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -c "from pathlib import Path; import time_twist; imported = Path(time_twist.__file__).resolve(); checkout = Path('work/time_twist').resolve(); print(imported); assert checkout not in imported.parents"
          time-twist --help >/dev/null
          time-twist release-build --help >/dev/null

      - name: Verify public tree and release-content immutability
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist *.egg-info work/*.egg-info
          PYTHONPATH=work python -m tools.maintenance.check_public_tree
          git diff --exit-code -- work/translations work/manifests work/release_sources.json work/title_assets

      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/architecture_polish_phase1_once.yml
          rm .github/workflows/architecture_polish_phase1_retry.yml
          rm .github/workflows/architecture_polish_phase1_retry2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Organize developer tooling by responsibility"
          git push origin HEAD:codebase-architecture-polish
