name: temporary modernization formatter

on:
  push:
    branches:
      - runtime-playtest-validation-20260829

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-playtest-validation-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned formatter
        run: python -m pip install black==25.1.0
      - name: Format modernization files
        run: |
          python -m black \
            work/integration_tests/test_scenario.py \
            work/integration_tests/test_ui.py \
            work/time_twist/compression.py \
            work/run_tests.py \
            work/tests/test_private_fixture_contract.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/integration_tests/test_scenario.py \
                  work/integration_tests/test_ui.py \
                  work/time_twist/compression.py \
                  work/run_tests.py \
                  work/tests/test_private_fixture_contract.py
          git commit -m "style: format modernization changes"
          git push origin HEAD:runtime-playtest-validation-20260829
