name: export-source-snapshot

on:
  push:
    branches:
      - full-natural-dialogue

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive validated source commit
        run: git archive --format=zip --output=source-snapshot.zip 27a3221058ecb82b03efeab7f586a14b793e8b46
      - uses: actions/upload-artifact@v4
        with:
          name: validated-source-snapshot
          path: source-snapshot.zip
