name: TT1B finalize once

on:
  push:
    branches: [translation-quality-comparison-audit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Apply TT1B source-grounded revisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/translations/TT1B.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['TT1B/g0/r1'] = 'Blue sky... when was it?'
          data['TT1B/g0/r15'] = '"Demon-Sealing Jar"{CTRL:0}{CTRL:2}Long ago, God\'s son{CTRL:0}after a fierce battle{CTRL:4}sealed the Devil within.'
          data['TT1B/g2/r5'] = "...: I've lived here{CTRL:0}40 years! I won't leave!{CTRL:2}Me: I'm no land shark.{CTRL:6}...: Oh! Sorry."
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          changes = audit['changes']
          existing = {item['id'] for item in changes}
          additions = [
            {
              'id': 'TT1B/g0/r1',
              'japanese': 'さいごにあおぞらをみたのは いつだっけ',
              'previous_english': 'Blue sky--how long gone?',
              'new_english': 'Blue sky... when was it?',
              'category': ['naturalness', 'fidelity'],
              'reason': 'Replace the awkward implication that the blue sky itself is gone with a natural compact question about when the protagonist last saw one.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 0,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            },
            {
              'id': 'TT1B/g0/r15',
              'japanese': '「まふうじのつぼ」{CTRL:0}{CTRL:2}すうせんねんのむかし かみのこが{CTRL:0}そうぜつなたたかいのすえ あくまをとじこめ{CTRL:4}ふういんしたとされる でんせつのつぼ',
              'previous_english': '"Demon-Sealing Jar"{CTRL:0}{CTRL:2}Long ago, God\'s son{CTRL:0}fought a devil{CTRL:4}and sealed it here.',
              'new_english': '"Demon-Sealing Jar"{CTRL:0}{CTRL:2}Long ago, God\'s son{CTRL:0}after a fierce battle{CTRL:4}sealed the Devil within.',
              'category': ['omitted_detail', 'source_specificity', 'naturalness'],
              'reason': 'Restore the source\'s explicit fierce-battle detail and render the jar as sealing the Devil within rather than the vaguer fought-a-devil/it-here wording.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 12,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            },
            {
              'id': 'TT1B/g2/r5',
              'japanese': '……「このいえにすんで もう40ねんになるんだ{CTRL:0} いまさら でていけるものか／」{CTRL:2}おれ「ぼくは じあげやじゃないですよ」{CTRL:6}……「え…！ あ… どうもしつれいしました」',
              'previous_english': "...: I've lived here{CTRL:0}40 years! I won't leave!{CTRL:2}Me: I'm no developer.{CTRL:6}...: Oh! Sorry.",
              'new_english': "...: I've lived here{CTRL:0}40 years! I won't leave!{CTRL:2}Me: I'm no land shark.{CTRL:6}...: Oh! Sorry.",
              'category': ['cultural_specificity', 'terminology', 'character_context'],
              'reason': 'Restore 地上げ屋 as the coercive bubble-era land speculator the resident fears, rather than the neutral and broader developer.',
              'external_difference_triggered_review': False,
              'external_text_stored': False,
              'presentation_controls_changed': False,
              'visible_character_delta': 1,
              'encoded_byte_delta': None,
              'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
            }
          ]
          for item in additions:
            if item['id'] not in existing:
              changes.append(item)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Measure live translation fit
        run: python -m unittest work.tests.test_live_translation_fit 2>&1 | tee /tmp/tt1b_fit.txt
      - name: Synchronize TT1B baseline status
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('work/audits/external_translation_baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          summary = baseline['scenario_summary']
          summary['tt1b_full_source_review_complete'] = True
          summary['tt1b_source_records_reviewed'] = 137
          summary['tt1b_audited_revisions'] = 3
          summary['scenario_source_records_fully_reviewed'] = 347
          summary['scenario_banks_fully_reviewed'] = ['TT3A', 'TT3B', 'TT1B']

          fit_text = Path('/tmp/tt1b_fit.txt').read_text(encoding='utf-8')
          match = re.search(r'FIT TT1B: (\d+)/(\d+) \((\d+) bytes free;', fit_text)
          if not match:
              raise SystemExit('TT1B fit line not found')
          used, capacity, free = map(int, match.groups())
          live = baseline['current_live_fit']
          live['measurement'] = 'canonical test_live_translation_fit.py after completed TT3A, TT3B, and TT1B source-grounded revisions'
          for item in live['banks']:
              if item['bank'] == 'TT1B':
                  item.update(used=used, capacity=capacity, free=free)
                  break
          else:
              raise SystemExit('TT1B bank row missing')
          live['tt1b_free_after_three_revisions'] = free

          baseline['pending'] = [
              'complete external NOV2/NOV4 system-text alignment without assuming source offsets',
              'review fixed-label differences against Japanese and gameplay context',
              'review TT1A source-grounded scenario text next, then continue bank by bank',
              'perform final rebuilt-ROM and emulator validation after editorial review'
          ]
          path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'TT1B FIT FINAL {used}/{capacity}; {free} bytes free')
          PY
      - name: Run unit suite
        run: python work/run_tests.py unit
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/tt1b_finalize_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete source-grounded TT1B review"
          git push origin HEAD:translation-quality-comparison-audit
