name: Build public Time Twist patcher

on:
  pull_request:
    paths:
      - 'release_patcher/**'
      - 'LICENSE'
      - '.github/workflows/build-public-patcher.yml'
  push:
    branches:
      - main
      - release/v1.0-patcher-polish
    tags:
      - 'v1.0.*'
    paths:
      - 'release_patcher/**'
      - 'LICENSE'
      - '.github/workflows/build-public-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify embedded patch resources and safety behavior
        run: python release_patcher/test_public_patcher.py

  windows:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and smoke-test Windows executable
        shell: powershell
        run: ./release_patcher/build_windows.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Time-Twist-English-v1.0-Release
          path: |
            dist/Time-Twist-English-v1.0-Windows.zip
            dist/Time-Twist-English-v1.0-Zenpen.bps
            dist/Time-Twist-English-v1.0-Kouhen.bps
          if-no-files-found: error
          retention-days: 30
      - name: Refresh checked-in release downloads
        if: github.event_name == 'pull_request' && github.head_ref == 'release/simon-fix-public-patcher'
        shell: powershell
        run: |
          git fetch origin $env:GITHUB_HEAD_REF
          git checkout $env:GITHUB_HEAD_REF
          Copy-Item dist/Time-Twist-English-v1.0-Windows.zip release/Time-Twist-English-v1.0-Windows.zip -Force
          Copy-Item dist/Time-Twist-English-v1.0-Zenpen.bps release/Time-Twist-English-v1.0-Zenpen.bps -Force
          Copy-Item dist/Time-Twist-English-v1.0-Kouhen.bps release/Time-Twist-English-v1.0-Kouhen.bps -Force
          Remove-Item -Recurse -Force dist/release-unpacked -ErrorAction SilentlyContinue
          Expand-Archive dist/Time-Twist-English-v1.0-Windows.zip -DestinationPath dist/release-unpacked -Force
          Copy-Item dist/release-unpacked/TimeTwistEnglishPatcher.exe release/TimeTwistEnglishPatcher.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Time-Twist-English-v1.0-Windows.zip release/Time-Twist-English-v1.0-Zenpen.bps release/Time-Twist-English-v1.0-Kouhen.bps release/TimeTwistEnglishPatcher.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Checked-in release artifacts already match the build."
            exit 0
          }
          git commit -m "Refresh v1.0 release artifacts with Dr. Simon fix"
          git push origin HEAD:$env:GITHUB_HEAD_REF
