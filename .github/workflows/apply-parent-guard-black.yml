name: apply-parent-guard-black

on:
  push:
    branches:
      - fix/root-menu-b-noop-20260915

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[black-parent-guard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/root-menu-b-noop-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply Black diff
        run: patch -p1 < .github/black-parent-guard.patch
      - name: Remove one-shot files
        run: rm .github/black-parent-guard.patch .github/workflows/apply-parent-guard-black.yml
      - name: Verify exact formatting target
        run: |
          python -m pip install black==25.1.0
          python -m black --check work/tests/test_entropy_production.py
          git diff --check
      - name: Commit formatter-only correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply Black to parent guard regression [black-parent-guard-applied]"
          git push origin HEAD:fix/root-menu-b-noop-20260915
