name: apply-parent-back-guard

on:
  push:
    branches:
      - fix/root-menu-b-noop-20260915

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[parent-guard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/root-menu-b-noop-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply verified patch
        run: patch -p1 < .github/parent-back-guard.patch
      - name: Remove one-shot staging files
        run: rm .github/parent-back-guard.patch .github/workflows/apply-parent-back-guard.yml
      - name: Validate focused public tests
        env:
          PYTHONPATH: work
        run: |
          python -m unittest work.tests.test_ui_unit
          python -m unittest work.tests.test_entropy_production
          git diff --check
      - name: Commit parent-based Back guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make B depend on parent menu [parent-guard-applied]"
          git push origin HEAD:fix/root-menu-b-noop-20260915
