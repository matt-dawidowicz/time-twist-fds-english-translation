name: TT1A TT2 review sync once

on:
  push:
    branches: [translation-quality-comparison-audit]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Measure unchanged-bank live fit
        run: python -m unittest work.tests.test_live_translation_fit 2>&1 | tee /tmp/review_fit.txt
      - name: Record completed source reviews
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('work/audits/external_translation_baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          summary = baseline['scenario_summary']
          summary['tt1a_full_source_review_complete'] = True
          summary['tt1a_source_records_reviewed'] = 35
          summary['tt1a_audited_revisions'] = 0
          summary['tt2_full_source_review_complete'] = True
          summary['tt2_source_records_reviewed'] = 169
          summary['tt2_audited_revisions'] = 0
          summary['scenario_source_records_fully_reviewed'] = 551
          summary['scenario_banks_fully_reviewed'] = ['TT3A', 'TT3B', 'TT1B', 'TT1A', 'TT2']

          fit_text = Path('/tmp/review_fit.txt').read_text(encoding='utf-8')
          for bank in ('TT1A', 'TT2'):
              match = re.search(rf'FIT {bank}: (\d+)/(\d+) \((\d+) bytes free;', fit_text)
              if not match:
                  raise SystemExit(f'{bank} fit line not found')
              used, capacity, free = map(int, match.groups())
              for item in baseline['current_live_fit']['banks']:
                  if item['bank'] == bank:
                      item.update(used=used, capacity=capacity, free=free)
                      break
              else:
                  raise SystemExit(f'{bank} bank row missing')
              baseline['current_live_fit'][f'{bank.lower()}_free_after_full_review'] = free

          baseline['current_live_fit']['measurement'] = 'canonical test_live_translation_fit.py after full source review of TT3A, TT3B, TT1B, TT1A, and TT2'
          baseline['pending'] = [
              'complete external NOV2/NOV4 system-text alignment without assuming source offsets',
              'review fixed-label differences against Japanese and gameplay context',
              'review T22 source-grounded scenario text next, then continue bank by bank',
              'perform final rebuilt-ROM and emulator validation after editorial review'
          ]
          path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Run unit suite
        run: python work/run_tests.py unit
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/tt1a_tt2_review_sync_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Record completed TT1A and TT2 source reviews"
          git push origin HEAD:translation-quality-comparison-audit
