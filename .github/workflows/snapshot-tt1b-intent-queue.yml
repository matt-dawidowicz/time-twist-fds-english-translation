name: snapshot-tt1b-intent-queue

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/snapshot-tt1b-intent-queue.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate current TT1B review queue
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --limit 40 > work/audits/TT1B_intent_gap_queue.md
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --limit 40 --json > work/audits/TT1B_intent_gap_queue.json
          rm .github/workflows/snapshot-tt1b-intent-queue.yml
      - name: Commit review snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot TT1B intent-gap review queue"
          git push origin HEAD:engineering/editorial-compression-20260902
