name: TT4 TT5 T25 fixed UI once

on:
  push:
    branches:
      - translation-quality-comparison-audit
    paths:
      - .github/workflows/fixed_ui_mid_batch_once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Apply source-grounded TT4 TT5 T25 fixed-label corrections
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          corrections = {
              "TT4_FIXED_TEXT_RECORDS": {
                  31: ("Soil", "Sell", "うる", "Correct the sell action; Soil is an unrelated noun."),
                  74: ("Fish", "Fisherman", "つりびと", "Restore the fisherman character target; Fish changes a person into an animal/object."),
                  78: ("Aristotle", "Alice", "ありす", "Restore the Japanese distractor Alice; Aristotle is a different historical person not present in the source."),
              },
              "TT5_FIXED_TEXT_RECORDS": {
                  5: ("Bell", "Belle", "べる", "Restore the established character name Belle rather than the misspelling Bell."),
                  18: ("Woods", "Window", "まど", "Correct the architectural target Window; Woods is unrelated to the Japanese."),
                  54: ("Time", "Tom", "とむ", "Restore the character name Tom; Time is an unrelated English word."),
              },
              "T25_FIXED_TEXT_RECORDS": {
                  7: ("Outside", "Offer", "すすめる", "Restore the coffee interaction action Offer; Outside is a location and does not represent the source verb."),
                  16: ("Wood", "Outside", "まどのそと", "Restore the navigation target outside the window; Wood is unrelated to the source location."),
              },
          }

          ui_path = Path("work/time_twist/ui_fixed_tables.py")
          text = ui_path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          assignments = {
              node.targets[0].id: node.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and len(node.targets) == 1
              and isinstance(node.targets[0], ast.Name)
          }
          lines = text.splitlines()
          audit_entries = []
          for table_name, changes in corrections.items():
              node = assignments[table_name]
              if not isinstance(node, ast.Tuple):
                  raise AssertionError(f"{table_name} is not a tuple")
              bank = table_name.removesuffix("_FIXED_TEXT_RECORDS")
              for index, (old, new, japanese, reason) in changes.items():
                  actual = ast.literal_eval(node.elts[index])
                  if actual != old:
                      raise AssertionError(
                          f"{table_name}[{index}] expected {old!r}, found {actual!r}"
                      )
                  line_index = node.elts[index].lineno - 1
                  indent = lines[line_index][
                      : len(lines[line_index]) - len(lines[line_index].lstrip())
                  ]
                  lines[line_index] = f'{indent}"{new}",'
                  audit_entries.append(
                      {
                          "id": f"{bank}/fixed/r{index}",
                          "japanese": japanese,
                          "previous_english": old,
                          "new_english": new,
                          "category": ["fixed_ui", "meaning_correction"],
                          "reason": reason,
                          "external_difference_triggered_review": True,
                          "external_text_stored": False,
                          "presentation_controls_changed": False,
                          "visible_character_delta": len(new) - len(old),
                          "encoded_byte_delta": None,
                          "encoded_byte_delta_note": "Each fixed-address record must retain its original packed slot size; validated by the fixed-table build/test path.",
                      }
                  )
          ui_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          test_path = Path("work/tests/test_ui_fixed_tables.py")
          test_text = test_path.read_text(encoding="utf-8")
          replacements = {
              '74: "Fish",': '74: "Fisherman",',
              '16: "Wood",': '16: "Outside",',
              '78: "Aristotle",': '78: "Alice",',
          }
          for old, new in replacements.items():
              if test_text.count(old) != 1:
                  raise AssertionError(f"test expectation anchor changed: {old}")
              test_text = test_text.replace(old, new, 1)
          test_path.write_text(test_text, encoding="utf-8")

          audit_path = Path("work/audits/translation_quality_changes.json")
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          existing = {entry["id"] for entry in audit["changes"]}
          duplicates = [entry["id"] for entry in audit_entries if entry["id"] in existing]
          if duplicates:
              raise AssertionError(f"duplicate audit IDs: {duplicates}")
          audit["changes"].extend(audit_entries)
          audit_path.write_text(
              json.dumps(audit, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          baseline_path = Path("work/audits/external_translation_baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          fixed = baseline["fixed_ui_progress"]
          fixed.update(
              {
                  "source_records_reviewed": 584,
                  "source_reviewed_banks": [
                      "TT1A",
                      "TT1B",
                      "TT2",
                      "T22",
                      "TT3A",
                      "TT3B",
                      "TT4",
                      "TT5",
                      "T25",
                      "TT6A",
                  ],
                  "tt4_source_reviewed_records": 97,
                  "tt4_source_review_revisions": 3,
                  "tt5_source_reviewed_records": 113,
                  "tt5_source_review_revisions": 3,
                  "t25_source_reviewed_records": 42,
                  "t25_source_review_revisions": 2,
              }
          )
          baseline_path.write_text(
              json.dumps(baseline, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          md_path = Path("work/audits/external_translation_baseline.md")
          md = md_path.read_text(encoding="utf-8")
          old_note = (
              "Source-grounded fixed-UI review is now **332/740 records (44.9%)**. "
              "TT1A, TT1B, TT2, T22, TT3A, TT3B, and TT6A have been reread against "
              "Japanese. Confirmed corrections are recorded individually in "
              "`translation_quality_changes.json`; compact but functionally faithful labels "
              "are left unchanged."
          )
          new_note = (
              "Source-grounded fixed-UI review is now **584/740 records (78.9%)**. "
              "TT1A, TT1B, TT2, T22, TT3A, TT3B, TT4, TT5, T25, and TT6A have been "
              "reread against Japanese. Confirmed corrections are recorded individually in "
              "`translation_quality_changes.json`; compact but functionally faithful labels "
              "are left unchanged."
          )
          if old_note not in md:
              raise AssertionError("fixed-UI progress paragraph changed")
          md = md.replace(old_note, new_note, 1)
          md = md.replace(
              "- Finish source-grounded review of the remaining 408/740 fixed-UI records,\n"
              "  changing only labels that Japanese and gameplay context prove incorrect.\n",
              "- Finish source-grounded review of the remaining 156/740 fixed-UI records\n"
              "  in TT6B and TT6C, changing only labels that Japanese and gameplay context\n"
              "  prove incorrect.\n",
              1,
          )
          md_path.write_text(md, encoding="utf-8")
          PY

      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py

      - name: Run fixed-table tests
        run: python -m unittest discover -s work/tests -p 'test_ui_fixed_tables.py' -v

      - name: Measure live bank fit
        run: python -m unittest discover -s work/tests -p 'test_live_translation_fit.py' -v

      - name: Refresh packed-headroom audit
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("work").resolve()))
          sys.path.insert(0, str(Path("work/tests").resolve()))
          from generate_translation_workbook import PATCH_FOOTPRINT_RESULTS
          from test_live_translation_fit import measure_translation_footprint
          from time_twist.capacity import playable_capacity

          baseline_path = Path("work/audits/external_translation_baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          rows = baseline["current_live_fit"]["banks"]
          for row in rows:
              bank = row["bank"]
              capacity = playable_capacity(bank, PATCH_FOOTPRINT_RESULTS[bank]["capacity"])
              used = measure_translation_footprint(bank)
              row.update({"used": used, "capacity": capacity, "free": capacity - used})
          baseline["current_live_fit"]["measurement"] = (
              "canonical test_live_translation_fit.py after 1,299/1,299 scenario review "
              "and 584/740 fixed-UI source review"
          )
          baseline_path.write_text(
              json.dumps(baseline, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          md_path = Path("work/audits/external_translation_baseline.md")
          md = md_path.read_text(encoding="utf-8")
          start = md.index("## Current packed headroom\n")
          end = md.index("## Current editorial findings\n")
          table = [
              "## Current packed headroom",
              "",
              "The canonical `test_live_translation_fit.py` measurement after the complete",
              "1,299-record scenario review and 584 fixed-UI source reviews gives:",
              "",
              "| Bank | Used | Capacity | Free |",
              "| --- | ---: | ---: | ---: |",
          ]
          for row in rows:
              table.append(
                  f"| {row['bank']} | {row['used']} | {row['capacity']} | {row['free']} |"
              )
          table.extend(
              [
                  "",
                  "These are compressed byte limits used by the build, not visible-character counts.",
                  "Faithful wording is retained unless measured capacity proves a shorter form necessary.",
                  "",
              ]
          )
          md = md[:start] + "\n".join(table) + "\n" + md[end:]
          md_path.write_text(md, encoding="utf-8")
          PY

      - name: Synchronize generated artifacts after audit updates
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
          git add outputs work/translation_workbook_banks

      - name: Verify generated artifacts are idempotent
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
          git diff --exit-code -- outputs work/translation_workbook_banks

      - name: Verify style
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy

      - name: Run full unit suite
        run: python work/run_tests.py unit

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fixed_ui_mid_batch_once.yml
          git add -A
          git commit -m "Correct TT4 TT5 T25 fixed UI labels"
          git push
