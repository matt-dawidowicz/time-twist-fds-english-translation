name: black-fix-once

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/materialized-text-flow-audit-20260915
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install black==25.1.0
      - run: python -m black work/tests/test_materialized_text_flow_audit.py work/tests/test_production_typography.py work/tests/test_production_translation.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tests/test_materialized_text_flow_audit.py work/tests/test_production_typography.py work/tests/test_production_translation.py
          git commit -m "Apply Black formatting"
          git push origin HEAD:fix/materialized-text-flow-audit-20260915
