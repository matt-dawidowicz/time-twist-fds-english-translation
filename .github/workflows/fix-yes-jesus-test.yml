name: fix-yes-jesus-test

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[yes-jesus-test-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/materialized-text-flow-audit-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Update stale regression oracle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("work/tests/test_production_translation.py")
          text = path.read_text(encoding="utf-8")
          old = '            "{CTRL:3}Me: Right. Jesus Christ.",\n'
          new = '            "{CTRL:3}Me: Yes—Jesus Christ!",\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale oracle, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-yes-jesus-test.yml
      - name: Verify focused regressions
        run: |
          python -m pip install -r requirements.txt
          time-twist-runtime smoke
          git diff --check
      - name: Commit updated oracle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update Yes-Jesus production oracle [yes-jesus-test-fixed]"
          git push origin HEAD:fix/materialized-text-flow-audit-20260915
