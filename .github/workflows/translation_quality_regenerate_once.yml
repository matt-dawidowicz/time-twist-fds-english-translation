name: Translation quality regenerate once

on:
  push:
    branches:
      - translation-quality-comparison-audit

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate translation review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Commit regenerated artifacts if needed
        run: |
          if git diff --quiet; then
            echo 'Generated artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Regenerate translation review artifacts'
          git pull --rebase origin translation-quality-comparison-audit
          git push origin HEAD:translation-quality-comparison-audit
