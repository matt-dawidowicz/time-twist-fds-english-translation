name: cleanup current source tree

on:
  push:
    branches:
      - cleanup-current-source-tree

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-current-source-tree
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Apply cleanup migration
        run: python .github/cleanup_current_source_tree.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Format maintained Python
        run: python -m black work
      - name: Regenerate comparison corpus
        run: python work/generate_bilingual_comparison_ci.py
      - name: Regenerate translation workbook
        run: python work/generate_translation_workbook.py
      - name: Prove removed checkpoint stays removed
        run: test ! -e work/Time_Twist_translation_progress.checkpoint.md
      - name: Remove runner-generated debris
        shell: bash
        run: |
          rm -rf build dist
          find . -type d \( -name '__pycache__' -o -name '*.egg-info' \) -prune -exec rm -rf {} +
      - run: python work/tools/check_public_tree.py
      - run: python -m black --check work
      - run: python -m ruff check work
      - run: python -m pydocstyle --convention=pep257 work
      - run: python -m mypy
      - run: python work/run_tests.py unit
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Prove installed-wheel import and CLI
        shell: bash
        run: |
          python -c "from pathlib import Path; import time_twist; from time_twist.release import build_code_provenance; imported = Path(time_twist.__file__).resolve(); checkout = Path('work/time_twist').resolve(); print(imported); assert checkout not in imported.parents, f'import leaked from checkout: {imported}'; build_code_provenance(Path.cwd())"
          time-twist --help
          time-twist release-build --help
      - name: Remove temporary workflow and build debris
        shell: bash
        run: |
          git rm .github/workflows/cleanup-current-source-tree.yml .github/cleanup_current_source_tree.py
          rm -rf build dist
          find . -type d \( -name '__pycache__' -o -name '*.egg-info' \) -prune -exec rm -rf {} +
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Remove obsolete code and stale translation state"
          git push origin HEAD:cleanup-current-source-tree
