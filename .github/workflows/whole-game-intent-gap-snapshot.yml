name: whole-game-intent-gap-snapshot

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/whole-game-intent-gap-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate whole-game intent queue
        run: |
          python work/tools/translation_intent_audit.py --project-root . > work/audits/whole_game_intent_gap_queue.md
          python work/tools/translation_intent_audit.py --project-root . --json > work/audits/whole_game_intent_gap_queue.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          rows = json.loads(Path('work/audits/whole_game_intent_gap_queue.json').read_text())
          counts = Counter(row['bank'] for row in rows)
          actionable = Counter(row['bank'] for row in rows if not row['runtime_evidence_required'])
          print('TOTAL', len(rows))
          print('ACTIONABLE', sum(actionable.values()))
          for bank in ('TT1A','TT1B','TT2','T22','TT3A','TT3B','TT4','TT5','T25','TT6A','TT6B','TT6C','TT6D'):
              print(bank, counts[bank], actionable[bank])
          print('\nTOP 25')
          for row in rows[:25]:
              print(row['score'], row['record_id'], 'runtime=' + str(row['runtime_evidence_required']), row['reasons'])
          PY
          rm .github/workflows/whole-game-intent-gap-snapshot.yml
      - name: Commit audit queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot whole-game intent-gap queue"
          git push origin HEAD:engineering/editorial-compression-20260902
