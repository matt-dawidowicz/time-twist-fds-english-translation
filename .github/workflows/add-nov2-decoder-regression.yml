name: add-nov2-decoder-regression

on:
  push:
    branches:
      - full-natural-dialogue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add native decoder regression and playtest note
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("work/integration_tests/test_ui.py")
          text = path.read_text(encoding="utf-8")
          old = "    NOV2_DIALOGUE_ROW_COPY,\n    NOV2_OPAQUE_CLEAR_PATCHES,\n"
          new = "    NOV2_DIALOGUE_ROW_COPY,\n    NOV2_EXTENDED_DICTIONARY_PATCH,\n    NOV2_OPAQUE_CLEAR_PATCHES,\n"
          if old not in text:
              raise SystemExit("integration import anchor missing")
          text = text.replace(old, new, 1)
          anchor = "    def test_zenpen_nov2_wait_prompt_patch_is_size_neutral(self) -> None:\n"
          test = '''    def test_zenpen_nov2_extended_dictionary_skips_native_index_reader(\n        self,\n    ) -> None:\n        \"\"\"Resume extended refs after the native five-bit index reader.\"\"\"\n        path = WORK_DIR / \"extracted_zenpen/side0_06_NOV2_6000.bin\"\n        if not path.exists():\n            self.fail(\"workspace fixture is not available\")\n        original = path.read_bytes()\n        patched = patched_nov2_ui(original)\n        patch = NOV2_EXTENDED_DICTIONARY_PATCH\n\n        self.assertEqual(\n            original[0x22BE:0x22C5],\n            bytes.fromhex(\"A9 00 85 3A 20 0D 81\"),\n        )\n        self.assertEqual(original[0x22C5:0x22C8], bytes.fromhex(\"A9 FF 85\"))\n        self.assertEqual(\n            patched[patch.file_offset : patch.file_offset + len(patch.replacement)],\n            patch.replacement,\n        )\n        self.assertEqual(patch.replacement[-3:], bytes.fromhex(\"4C C5 82\"))\n\n'''
          if anchor not in text:
              raise SystemExit("integration test anchor missing")
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("docs/BUG_FIXES_AND_TITLE_IMPLEMENTATION.md")
          text = path.read_text(encoding="utf-8")
          anchor = '''path at `$8226`. `CMP #$25` clears carry for the add path, so the compact\nsequence does not require a separate `CLC`.\n'''
          replacement = '''path at `$8226`. `CMP #$25` clears carry for the add path, so the compact\nsequence does not require a separate `CLC`.\n\nA playtest exposed why the resume address matters. An earlier experimental\nversion jumped to `$82BE`; that entry point clears `$3A` and calls the native\nfive-bit dictionary-index reader before continuing at `$82C5`. Extended\nreferences have already consumed their six-bit payload, so the extra read\ndesynchronized the packed stream. The first visible symptom was TT1B/g0/r0\nrendering `I've wanted to visan` instead of `I've wanted to visit.` before the\ngame crashed. The corrected patch jumps directly to `$82C5`.\n'''
          if anchor not in text:
              raise SystemExit("documentation anchor missing")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          rm .github/workflows/add-nov2-decoder-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/integration_tests/test_ui.py docs/BUG_FIXES_AND_TITLE_IMPLEMENTATION.md .github/workflows/add-nov2-decoder-regression.yml
          git commit -m "Add NOV2 decoder stream-alignment regression"
          git push
