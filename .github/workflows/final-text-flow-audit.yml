name: final-text-flow-audit

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: write

jobs:
  verify-and-lock:
    if: ${{ !contains(github.event.head_commit.message, '[text-flow-audit-verified]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/materialized-text-flow-audit-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Run materialized text-flow regression
        run: python -m unittest work.tests.test_materialized_text_flow_audit
      - name: Refresh intentional source lock
        run: time-twist release-lock --update
      - name: Remove one-shot workflow
        run: rm .github/workflows/final-text-flow-audit.yml
      - name: Verify clean patch
        run: git diff --check
      - name: Commit verified audit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Verify materialized text-flow audit [text-flow-audit-verified]"
          git push origin HEAD:fix/materialized-text-flow-audit-20260915
