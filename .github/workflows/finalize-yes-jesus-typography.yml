name: finalize-yes-jesus-typography

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[yes-jesus-typography-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/materialized-text-flow-audit-20260915
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Update old semantic-control oracle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("work/tests/test_production_translation.py")
          text = path.read_text(encoding="utf-8")
          old = '            "{CTRL:3}Me: Yes—Jesus Christ!",\n'
          new = '            "{CTRL:3}Me: Yes… Jesus Christ!",\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one em-dash oracle, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Refresh TT6C override source-lock entry only
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          relative = "work/production_overrides/TT6C.json"
          raw = Path(relative).read_bytes()
          normalized = raw.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          lock_path = Path("work/release_sources.json")
          payload = json.loads(lock_path.read_text(encoding="utf-8"))
          entry = payload["files"][relative]
          if entry.get("normalization") != "lf":
              raise SystemExit("unexpected TT6C normalization policy")
          entry["sha256"] = hashlib.sha256(normalized).hexdigest().upper()
          entry["bytes"] = len(normalized)
          lock_path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-yes-jesus-typography.yml
      - name: Verify typography and semantic regressions
        run: |
          python -m pip install -r requirements.txt
          python -m unittest work.tests.test_materialized_text_flow_audit work.tests.test_production_typography work.tests.test_production_translation
          git diff --check
      - name: Commit final typography repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize Yes-Jesus typography [yes-jesus-typography-final]"
          git push origin HEAD:fix/materialized-text-flow-audit-20260915
