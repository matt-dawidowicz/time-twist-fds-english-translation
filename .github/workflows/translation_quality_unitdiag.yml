name: translation-quality-unitdiag

on:
  push:
    paths:
      - ".github/workflows/translation_quality_unitdiag.yml"

permissions:
  contents: write

jobs:
  unitdiag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Capture unit-test failure
        run: |
          python work/run_tests.py unit > work/audits/unit_failure.txt 2>&1 || true
          tail -n 120 work/audits/unit_failure.txt
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/audits/unit_failure.txt
          git commit -m "Capture unit-test diagnostic"
          git pull --rebase origin translation-quality-comparison-audit
          git push origin HEAD:translation-quality-comparison-audit
