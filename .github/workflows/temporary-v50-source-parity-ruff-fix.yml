name: temporary-v50-source-parity-ruff-fix

on:
  push:
    branches:
      - source-parity/v50-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: source-parity/v50-clean
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check work --fix || true
      - run: python -m black work
      - name: Commit mechanical Ruff fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git commit -m "Apply mechanical Ruff fixes to source parity branch"
          git push origin HEAD:source-parity/v50-clean
