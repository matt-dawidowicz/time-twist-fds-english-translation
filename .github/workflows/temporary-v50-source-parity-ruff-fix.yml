name: temporary-v50-source-parity-ruff-fix

on:
  push:
    branches:
      - source-parity/v50-clean

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: source-parity/v50-clean
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check work --fix || true
      - name: Apply explicit safe style fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("work/tests/test_production_translation.py")
          text = path.read_text()
          old = "zip(red, blue, target)"
          new = "zip(red, blue, target, strict=True)"
          if old not in text:
              raise SystemExit("expected zip expression not found")
          path.write_text(text.replace(old, new))

          path = Path("work/tools/inspect_mesen_menu_state.py")
          text = path.read_text()
          old = """    starts = [record_zero]
    for page in range(1, page_count):
        starts.append(state.cpu_word(page_table + (page - 1) * 2))
"""
          new = """    starts = [record_zero]
    starts.extend(
        state.cpu_word(page_table + (page - 1) * 2)
        for page in range(1, page_count)
    )
"""
          if old not in text:
              raise SystemExit("expected menu page loop not found")
          path.write_text(text.replace(old, new))
          PY
      - run: python -m black work
      - run: python -m ruff check work
      - name: Commit mechanical Ruff fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git commit -m "Apply mechanical Ruff fixes to source parity branch"
          git push origin HEAD:source-parity/v50-clean
