name: snapshot-final-tt1b-gap

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/snapshot-final-tt1b-gap.yml

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate refined TT1B queue
        run: |
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B --json > work/audits/TT1B_intent_gap_queue.json
          python work/tools/translation_intent_audit.py --project-root . --bank TT1B > work/audits/TT1B_intent_gap_queue.md
          cat work/audits/TT1B_intent_gap_queue.md
          rm .github/workflows/snapshot-final-tt1b-gap.yml
      - name: Commit refined queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh refined TT1B intent-gap queue"
          git push origin HEAD:engineering/editorial-compression-20260902
