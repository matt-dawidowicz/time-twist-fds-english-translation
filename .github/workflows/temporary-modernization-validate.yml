name: temporary modernization validator

on:
  push:
    branches:
      - runtime-playtest-validation-20260829

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-playtest-validation-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -r requirements.txt
      - name: Apply safe lint fixes
        run: python -m ruff check --fix work/integration_tests/test_scenario.py
      - name: Format
        run: python -m black work
      - name: Validate style and types
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
      - name: Run public unit suite
        run: python work/run_tests.py unit
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No safe fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git commit -m "test: satisfy modernization quality gates"
          git push origin HEAD:runtime-playtest-validation-20260829
