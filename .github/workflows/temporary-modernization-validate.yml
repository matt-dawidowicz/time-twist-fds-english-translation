name: temporary modernization validator

on:
  push:
    branches:
      - runtime-playtest-validation-20260829

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-playtest-validation-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -r requirements.txt
      - name: Refresh modernization assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_test = Path("work/integration_tests/test_ui.py")
          text = ui_test.read_text(encoding="utf-8")
          old = """        def own(offset: int, size: int) -> None:\n            permitted.update(range(offset, offset + size))\n"""
          new = """        def own(offset: int, size: int) -> None:\n            \"\"\"Mark one verified NOV2 byte range as patch-owned.\"\"\"\n            permitted.update(range(offset, offset + size))\n"""
          if text.count(old) != 1:
              raise SystemExit("expected NOV2 ownership helper not found exactly once")
          ui_test.write_text(text.replace(old, new), encoding="utf-8")

          hardening = Path("work/tests/test_scenario_validation_hardening.py")
          text = hardening.read_text(encoding="utf-8")
          old = """        optimized = compress_english_groups(\n            groups,\n            max_bytes=packed_size(*greedy),\n            optimize=True,\n        )\n"""
          new = """        optimized = compress_english_groups(\n            groups,\n            optimize=True,\n        )\n"""
          if text.count(old) != 1:
              raise SystemExit("expected constrained optimization regression block not found exactly once")
          hardening.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply safe lint fixes
        run: python -m ruff check --fix work/integration_tests/test_scenario.py
      - name: Format
        run: python -m black work
      - name: Validate style and types
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
      - name: Run public unit suite
        run: python work/run_tests.py unit
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No safe fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git commit -m "test: satisfy modernization quality gates"
          git push origin HEAD:runtime-playtest-validation-20260829
