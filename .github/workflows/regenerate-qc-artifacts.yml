name: regenerate QC artifacts

on:
  push:
    branches:
      - chore/resolve-stale-qc-flags-20260913

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python work/generate_translation_workbook.py
      - name: Commit regenerated workbook artifacts
        run: |
          git add outputs work/translation_workbook_banks
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate translation QC artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
