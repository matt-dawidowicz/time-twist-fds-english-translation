name: format-full-natural

on:
  push:
    branches:
      - full-natural-dialogue

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m black work/time_twist/scenario_validation.py work/integration_tests/test_full_natural_dialogue.py
      - name: Commit Black output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/time_twist/scenario_validation.py work/integration_tests/test_full_natural_dialogue.py
          git commit -m "Apply Black formatting"
          git push
