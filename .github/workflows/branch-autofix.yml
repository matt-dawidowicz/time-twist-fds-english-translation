name: branch-autofix

on:
  push:
    branches:
      - engineering/editorial-compression-20260902

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[autofix-rust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          rust = Path('native/compression_optimizer/src/main.rs')
          text = rust.read_text(encoding='utf-8')
          old = '            Ok(subtotal + record_packed_size(record)?)\n'
          new = '            Ok::<usize, String>(subtotal + record_packed_size(record)?)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Rust inference site, found {text.count(old)}')
          rust.write_text(text.replace(old, new), encoding='utf-8')

          bridge = Path('work/time_twist/compression_native.py')
          text = bridge.read_text(encoding='utf-8')
          old = '    def __init__(self, text: str) -> None:\n        self._lines = iter(text.splitlines())\n'
          new = '    def __init__(self, text: str) -> None:\n        """Initialize a strict line reader over one native result payload."""\n        self._lines = iter(text.splitlines())\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one result-reader constructor, found {text.count(old)}')
          bridge.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Canonically format Rust and generate lockfile
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path native/compression_optimizer/Cargo.toml
          cargo generate-lockfile --manifest-path native/compression_optimizer/Cargo.toml
      - name: Remove one-shot workflow
        run: rm .github/workflows/branch-autofix.yml
      - name: Commit branch fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply native optimizer compiler and formatting fixes"
          git push origin HEAD:engineering/editorial-compression-20260902
