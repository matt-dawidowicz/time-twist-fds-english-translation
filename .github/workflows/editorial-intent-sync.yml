name: editorial-intent-sync

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/editorial-intent-sync.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply intent-first source and documentation updates
        run: |
          python - <<'PY'
          from pathlib import Path

          translation = Path("work/translations/TT1B.json")
          text = translation.read_text(encoding="utf-8")
          old = '  "TT1B/g0/r1": "Last saw blue sky when?",'
          new = '  "TT1B/g0/r1": "When was the last time{CTRL:0}I saw a blue sky?",'
          assert text.count(old) == 1, "unexpected TT1B blue-sky source state"
          translation.write_text(text.replace(old, new), encoding="utf-8")

          workbook_generator = Path("work/generate_translation_workbook.py")
          text = workbook_generator.read_text(encoding="utf-8")
          old = 'CONTROL_OVERRIDE_IDS = frozenset({"NOV2/wait"})'
          new = 'CONTROL_OVERRIDE_IDS = frozenset({"NOV2/wait", "TT1B/g0/r1"})'
          assert text.count(old) == 1, "unexpected workbook control override state"
          workbook_generator.write_text(text.replace(old, new), encoding="utf-8")

          workbook_doc = Path("docs/WORKBOOK_PIPELINE.md")
          text = workbook_doc.read_text(encoding="utf-8")
          start = text.index("For example, record `TT1B/g0/r1` preserves:")
          end = text.index("### Using a full translation in a future build", start)
          replacement = '''For example, record `TT1B/g0/r1` is now the reference case for the\nintent-first workflow:\n\n```text\nJapanese:     さいごにあおぞらをみたのは いつだっけ\nNatural:      When was the last time I saw a blue sky?\nPlayable:     When was the last time{CTRL:0}I saw a blue sky?\nRendered:     When was the last time\n              I saw a blue sky?\n```\n\nThe earlier playable wording compressed the sentence into telegraphic English.\nThat compromise is no longer accepted merely because it is short. A recovered,\naudited `CTRL:0` presentation break makes the complete natural reading safe in\ntwo rows, and whole-bank optimization proves it fits the fixed ROM allocation.\n\nThis is the governing editorial rule: preserve the Japanese record's denotation,\nemotional valence, speaker attitude, register, subtext, and dramatic rhythm as\nrecorded in the exact-Japanese, literal, linguistic, speaker, voice, sentiment,\nand natural-translation review layers. Renderer width and packed-bank capacity\nremain hard technical constraints, but the tooling should solve those constraints\nbefore prose is shortened.\n\nThe editorial optimizer may use the verified Python-Rust hybrid described in\n`NATIVE_ACCELERATOR.md`. Rust accelerates deterministic search; Python remains\nthe codec authority and independently verifies every native result before it can\nbe accepted.\n\n'''
          workbook_doc.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          layout_doc = Path("docs/ENGLISH_LAYOUT.md")
          text = layout_doc.read_text(encoding="utf-8")
          addition = '''\n## Intent and sentiment are editorial constraints\n\nLine layout is not allowed to flatten the source. The preferred English must be\nchosen from the translation review evidence first: exact Japanese, literal\nmeaning, speaker identity, linguistic/register notes, established character\nvoice, scene context, emotional/sentiment analysis, and the reviewed natural\nEnglish reading. Compression is evaluated only after that target exists.\n\nThis means a layout that saves a few bytes does not automatically win. For the\nblue-sky pilot, whole-bank optimization measured all three minimum-row layouts:\n\n| Layout | Packed TT1B | Free bytes |\n| --- | ---: | ---: |\n| `When was the last` / `time I saw a blue sky?` | 3898 | 336 |\n| `When was the last time I` / `saw a blue sky?` | 3900 | 334 |\n| `When was the last time` / `I saw a blue sky?` | 3902 | 332 |\n\nThe project deliberately selects `When was the last time` / `I saw a blue sky?`.\nIt is four bytes larger than the compressor-optimal break but better preserves\nEnglish phrasing and reflective rhythm, while still leaving 332 bytes free in\nthe audited bank. Editorial quality therefore dominates byte minimization once\nthe hard ROM constraints are satisfied.\n\n## Python-Rust editorial path\n\nCompression-aware layout scoring may use the optional Rust optimizer because a\nreal TT1A benchmark reduced deep-search time from about 17.3 seconds in Python\nto about 0.43 seconds in Rust while producing the same 1,594-byte result and the\nsame 26-entry dictionary. The speedup makes it practical to evaluate natural\nprose and multiple legal layouts rather than pre-shortening text to avoid search\ncost. Python independently expands and repacks every native result, so native\nspeed cannot override codec correctness. See `NATIVE_ACCELERATOR.md`.\n'''
          if "## Intent and sentiment are editorial constraints" not in text:
              layout_doc.write_text(text.rstrip() + "\n" + addition, encoding="utf-8")

          optimizer_doc = Path("docs/COMPRESSION_OPTIMIZER.md")
          text = optimizer_doc.read_text(encoding="utf-8")
          addition = '''\n## Measured hybrid backend\n\nThe profiling threshold for a native accelerator has been met. On the real TT1A\nbank, the reference Python deep optimizer produced a 1,594-byte result with 26\ndictionary entries in about 17.3 seconds. The Rust backend produced the same\nsize and dictionary count in about 0.43 seconds, roughly a 40x speedup on the\nGitHub Actions runner. Synthetic cross-language equivalence tests also require\nthe ordered dictionary and compressed streams to agree.\n\nThe hybrid is therefore a supported editorial optimization path:\n\n1. Python parses authoritative English and encodes canonical symbols.\n2. Rust performs the expensive deterministic dictionary/search work.\n3. Rust returns an ordered dictionary, compressed group streams, and claimed\n   packed size through the versioned text protocol.\n4. Python rejects malformed, non-flat, out-of-range, duplicate, over-capacity,\n   or required-prefix-incompatible dictionaries.\n5. Python expands every dictionary reference and proves the resulting symbol\n   stream is identical to the intended English.\n6. Python repacks the candidate with the canonical codec and independently\n   verifies the exact byte count.\n\nThe purpose of the speedup is editorial: search time should not pressure the\ntranslation toward shorter, flatter English. Deeper compression and layout\nsearch are tools for retaining Japanese intent, register, sentiment, character\nvoice, and dramatic rhythm inside the unchanged ROM footprint.\n'''
          if "## Measured hybrid backend" not in text:
              optimizer_doc.write_text(text.rstrip() + "\n" + addition, encoding="utf-8")

          native_doc = Path("docs/NATIVE_ACCELERATOR.md")
          native_doc.write_text('''# Native compression accelerator\n\n## Purpose\n\nTime Twist keeps Python as the canonical implementation of the packed-text\nformat, release validation, ROM construction, and translation workflow. The\noptional Rust program in `native/compression_optimizer` accelerates only the\nexpensive deterministic dictionary/search stage used by editorial optimization.\n\nThe reason for the hybrid is translation quality. The project should preserve as\nmuch of the Japanese as English can carry: denotation, implication, sentiment,\nspeaker stance, register, humor, hesitation, emphasis, characterization, and\ndramatic rhythm. Fixed FDS memory and renderer limits remain non-negotiable, but\nthey should be attacked with better packing and layout search before natural\nEnglish is shortened.\n\n## Authority boundary\n\nRust is an optimizer, not a codec authority. `work/time_twist/textcodec.py` and\nthe Python compression/validation code remain the executable specification.\n`work/time_twist/compression_native.py` serializes one complete optimization\nproblem, runs the native helper, parses its answer, and verifies it independently.\n\nPython rejects a native result unless all of the following hold:\n\n- group and record counts are unchanged;\n- dictionary size is within the recovered decoder limit;\n- any required dictionary prefix is byte-for-byte semantically preserved;\n- dictionary entries are unique, nonempty, flat glyph strings;\n- every dictionary reference expands legally;\n- every expanded record is symbol-for-symbol identical to the intended English;\n- canonical Python `packed_size()` agrees with the native claimed size;\n- the fixed bank byte limit is not exceeded.\n\nThis makes native failure fail-closed: an unavailable, crashing, malformed, or\nincorrect helper cannot silently change the ROM text.\n\n## Protocol\n\nThe bridge uses a versioned plain-text whole-bank protocol:\n\n- request magic: `TIME_TWIST_COMPRESSION_V1`;\n- result magic: `TIME_TWIST_COMPRESSION_RESULT_V1`;\n- each packed symbol becomes a collision-free 16-bit token containing symbol\n  kind and value;\n- the request carries the maximum dictionary count, byte limit, full-dictionary\n  requirement, required prefix, and every group/record;\n- the result returns the claimed packed size, complete ordered dictionary, and\n  compressed groups.\n\nA whole-bank process boundary is intentional. It avoids per-candidate FFI\noverhead and keeps the normal Python package independent of CPython ABI or PyO3\nwheel concerns.\n\n## Discovery and build\n\nNormal Python use does not require Rust. Editorial/native mode discovers the\nhelper in this order:\n\n1. `TIME_TWIST_NATIVE_OPTIMIZER`;\n2. the checkout release target under\n   `native/compression_optimizer/target/release`;\n3. `time-twist-compression-optimizer` on `PATH`.\n\nBuild from the repository root with stable Rust:\n\n```text\ncargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml\ncargo test --manifest-path native/compression_optimizer/Cargo.toml\ncargo build --release --manifest-path native/compression_optimizer/Cargo.toml\n```\n\nWindows uses the standard stable `x86_64-pc-windows-msvc` toolchain. No nightly\nfeatures are required.\n\n## Determinism and equivalence\n\nThe native search must use explicit deterministic ordering for ties. Hash-map\niteration order, thread scheduling, platform-specific integer behavior, or random\nseeds must not affect selected dictionaries or streams. CI cross-checks the Rust\noptimizer against the Python reference on representative corpora, and a real\nbank benchmark requires equal optimized size and dictionary count.\n\nThe editorial path still prefers English quality over a tiny size difference\nonce every candidate fits. Compression ranking chooses technically efficient\nlayouts; the editor may select a slightly larger layout when it better preserves\nphrasing, sentiment, voice, or dramatic cadence and the bank retains safe\nheadroom.\n\n## Measured result\n\nOn GitHub Actions, TT1A measured approximately:\n\n| Backend | Optimized bytes | Dictionary | Deep-search time |\n| --- | ---: | ---: | ---: |\n| Python reference | 1594 | 26 | 17.3 s |\n| Rust accelerator | 1594 | 26 | 0.43 s |\n\nThat roughly 40x acceleration is large enough to change the editorial workflow:\nnatural prose and legal line layouts can be explored directly instead of being\nshortened pre-emptively to keep optimization time manageable.\n\n## Release policy\n\nRoutine builds may continue to use the fast Python path. Native mode is intended\nfor editorial/headroom optimization and final translation engineering. Any\nrelease candidate produced from native search must still pass the same Python\ncodec validation, source locks, tests, fixed-bank capacity checks, and runtime\nplaytest gates as any other candidate.\n''', encoding="utf-8")
          PY
      - name: Format Python changes
        run: python -m black work/tests/test_editorial_layout.py work/generate_translation_workbook.py
      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Validate Python quality gates
        run: |
          python work/tools/check_public_tree.py
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
      - name: Validate native optimizer
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
          cargo test --manifest-path native/compression_optimizer/Cargo.toml
          cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
          TIME_TWIST_NATIVE_OPTIMIZER="$PWD/native/compression_optimizer/target/release/time-twist-compression-optimizer" \
            python -m unittest discover -s work/tests -p 'test_compression_native.py'
      - name: Verify natural blue-sky layout still fits
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: >-
          python work/tools/editorial_layout_audit.py --project-root .
          --bank TT1B --record TT1B/g0/r1
          --text "When was the last time I saw a blue sky?" --backend native
      - name: Commit synchronized editorial sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/editorial-intent-sync.yml
          git add -A
          git diff --cached --stat
          git commit -m "Adopt intent-first Python-Rust editorial compression"
          git push origin HEAD:engineering/editorial-compression-20260902
