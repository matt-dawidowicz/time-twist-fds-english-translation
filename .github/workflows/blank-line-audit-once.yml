name: blank-line-audit-once

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Audit adjacent controls in materialized production
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from time_twist.production_translation import merged_translation_map

          root = Path('.')
          banks = ('TT1A','TT1B','TT2','T22','TT3A','TT3B','TT4','TT5','T25','TT6A','TT6B','TT6C','TT6D')
          ctrl = re.compile(r'\{CTRL:(\d+)\}')
          adjacent = re.compile(r'(\{CTRL:\d+\})(\{CTRL:\d+\})')
          suspicious = []
          inherited = []
          for bank in banks:
              prod = merged_translation_map(
                  bank,
                  base_directory=root/'work'/'translations',
                  override_directory=root/'work'/'production_overrides',
                  review_directory=root/'review'/'production_retranslation',
              )
              base = json.loads((root/'work'/'translations'/f'{bank}.json').read_text(encoding='utf-8'))
              for rid, text in prod.items():
                  matches = [(m.group(1), m.group(2)) for m in adjacent.finditer(text)]
                  if not matches:
                      continue
                  base_matches = [(m.group(1), m.group(2)) for m in adjacent.finditer(base[rid])]
                  item = (rid, matches, base_matches, text)
                  if matches == base_matches:
                      inherited.append(item)
                  else:
                      suspicious.append(item)
          print('INHERITED_ADJACENT_CONTROL_RECORDS', len(inherited))
          for item in inherited:
              print('INHERITED', item)
          print('PRODUCTION_DIFFERS_FROM_BASE', len(suspicious))
          for item in suspicious:
              print('SUSPICIOUS', item)
          PY
