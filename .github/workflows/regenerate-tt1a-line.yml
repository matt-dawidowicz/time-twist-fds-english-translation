name: regenerate TT1A line artifacts

on:
  push:
    branches:
      - restore-tt1a-punch-question

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-tt1a-punch-question
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook.py
      - name: Refresh TT1A source lock entry
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path("work/translations/TT1A.json")
          lock_path = Path("work/release_sources.json")
          raw = source.read_bytes()
          normalized = raw.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          data = json.loads(lock_path.read_text(encoding="utf-8"))
          entry = data["files"]["work/translations/TT1A.json"]
          entry["sha256"] = hashlib.sha256(normalized).hexdigest().upper()
          entry["bytes"] = len(normalized)
          lock_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Remove runner-generated caches
        shell: bash
        run: find . -type d \( -name '__pycache__' -o -name '*.egg-info' \) -prune -exec rm -rf {} +
      - run: python work/tools/check_public_tree.py
      - run: python work/run_tests.py unit
      - name: Commit regenerated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- outputs work/translation_workbook_banks work/release_sources.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Regenerate review artifacts for TT1A question"
            git push origin HEAD:restore-tt1a-punch-question
          fi
