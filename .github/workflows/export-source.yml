name: export-source

on:
  push:
    branches:
      - chatgpt/export-audit-source-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: time-twist-audit-source
          path: .
          include-hidden-files: true
          retention-days: 1
