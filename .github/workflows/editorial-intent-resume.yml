name: editorial-intent-resume

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/editorial-intent-resume.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply reviewed intent-first migration
        run: |
          python - <<'PY'
          from pathlib import Path

          # Reuse the already-reviewed source/documentation migration block.
          workflow = Path('.github/workflows/editorial-intent-sync.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(code, 'editorial-intent-migration', 'exec'))

          # Expose the scenario control policy as one shared audit predicate.
          path = Path('work/time_twist/scenario_validation.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\n\ndef encode_validated_english(\n'
          helper = '''\n\ndef scenario_controls_match_policy(\n    record_id: str,\n    english: str,\n    japanese: str,\n) -> bool:\n    """Return whether one English control sequence obeys reviewed policy.\n\n    Ordinary records must preserve the source control sequence exactly.\n    Explicitly audited presentation-break records may insert additional\n    ``CTRL:0`` row advances while preserving every source control in order.\n    The raw source and English sequences remain separately available to review\n    tools, so policy acceptance never hides that a presentation break was added.\n    """\n    english_controls = control_values(english)\n    source_controls = control_values(japanese)\n    if record_id in PRESENTATION_BREAK_RECORD_IDS:\n        return _controls_preserve_source_with_presentation_breaks(\n            english_controls, source_controls\n        )\n    return english_controls == source_controls\n'''
          assert anchor in text
          assert 'def scenario_controls_match_policy(' not in text
          text = text.replace(anchor, helper + anchor, 1)
          old = '''    english_controls = control_values(english)\n    source_controls = control_values(japanese)\n    if record_id in PRESENTATION_BREAK_RECORD_IDS:\n        if not _controls_preserve_source_with_presentation_breaks(\n            english_controls,\n            source_controls,\n        ):\n            raise EnglishTextError(\n                "control tags changed beyond audited presentation breaks"\n            )\n    elif english_controls != source_controls:\n        raise EnglishTextError("control tags changed")\n'''
          new = '''    if not scenario_controls_match_policy(record_id, english, japanese):\n        if record_id in PRESENTATION_BREAK_RECORD_IDS:\n            raise EnglishTextError(\n                "control tags changed beyond audited presentation breaks"\n            )\n        raise EnglishTextError("control tags changed")\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Make the bilingual corpus report policy validity while retaining both\n          # raw control sequences for exact auditing.
          path = Path('work/generate_bilingual_comparison.py')
          text = path.read_text(encoding='utf-8')
          old = 'from time_twist.scenario import render_symbols\n'
          new = old + 'from time_twist.scenario_validation import scenario_controls_match_policy\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '        control_match="yes" if source_controls == english_controls else "NO",\n'
          new = '        control_match="yes" if scenario_controls_match_policy(text_id, english, japanese) else "NO",\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Keep the workbook's exceptional-control registry auditable, but use\n          # the same strict scenario policy before accepting English-only breaks.
          path = Path('work/generate_translation_workbook.py')
          text = path.read_text(encoding='utf-8')
          old = 'from generate_bilingual_comparison import _romanize\n'
          new = old + '''from time_twist.scenario_validation import (\n    PRESENTATION_BREAK_RECORD_IDS,\n    scenario_controls_match_policy,\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = 'CONTROL_OVERRIDE_IDS = frozenset({"NOV2/wait", "TT1B/g0/r1"})'
          new = '''UI_CONTROL_OVERRIDE_IDS = frozenset({"NOV2/wait"})\nCONTROL_OVERRIDE_IDS = UI_CONTROL_OVERRIDE_IDS | PRESENTATION_BREAK_RECORD_IDS'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    patch = patch_charset_safe(patch)\n    if (\n'
          new = '''    patch = patch_charset_safe(patch)\n    if (\n        text_id in PRESENTATION_BREAK_RECORD_IDS\n        and not scenario_controls_match_policy(\n            text_id, patch, source_row["japanese_exact"]\n        )\n    ):\n        raise ValueError(\n            f"{text_id}: control tags changed beyond audited presentation breaks"\n        )\n    if (\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Lock the semantics of comparison control_match: policy-safe can differ\n          # from byte-for-byte equality on explicitly audited presentation records.
          path = Path('work/tests/test_comparison.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    def test_comparison_ids_are_unique_and_complete(self) -> None:\n'''
          test = '''    def test_audited_presentation_break_remains_visible_but_policy_safe(\n        self,\n    ) -> None:\n        """Expose the extra row control while recording reviewed policy success."""\n        row = next(row for row in self.rows if row["text_id"] == "TT1B/g0/r1")\n        self.assertNotEqual(row["source_controls"], row["english_controls"])\n        self.assertEqual(row["control_match"], "yes")\n\n'''
          assert anchor in text
          assert 'test_audited_presentation_break_remains_visible_but_policy_safe' not in text
          text = text.replace(anchor, test + anchor, 1)
          path.write_text(text, encoding='utf-8')

          # The minimum-row solver pruned the old pathological example down to\n          # <=2 layouts. Use a fixture with six equally minimal 3-row layouts.
          path = Path('work/tests/test_editorial_layout.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "a b c d e f g h i j k l m n o p q r s t",\n                columns=10,\n                max_variants=2,\n'''
          new = '''                "a b c d e f g h i j",\n                columns=7,\n                max_variants=2,\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Format and regenerate review artifacts
        run: |
          python -m black work/time_twist/scenario_validation.py work/generate_bilingual_comparison.py work/generate_translation_workbook.py work/tests/test_comparison.py work/tests/test_editorial_layout.py
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Restore a clean public-tree view
        run: |
          rm -rf work/__pycache__ work/time_twist/__pycache__ work/time_twist_fds_tools.egg-info
          rm -f .github/workflows/editorial-intent-sync.yml .github/workflows/editorial-intent-resume.yml
      - name: Validate Python quality gates
        run: |
          python work/tools/check_public_tree.py
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
      - name: Validate native optimizer
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
          cargo test --manifest-path native/compression_optimizer/Cargo.toml
          cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
          TIME_TWIST_NATIVE_OPTIMIZER="$PWD/native/compression_optimizer/target/release/time-twist-compression-optimizer" \
            python -m unittest discover -s work/tests -p 'test_compression_native.py'
      - name: Verify natural blue-sky layout still fits
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: >-
          python work/tools/editorial_layout_audit.py --project-root .
          --bank TT1B --record TT1B/g0/r1
          --text "When was the last time I saw a blue sky?" --backend native
      - name: Commit synchronized editorial sources
        run: |
          rm -rf work/__pycache__ work/time_twist/__pycache__ work/tests/__pycache__ work/time_twist_fds_tools.egg-info native/compression_optimizer/target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Adopt intent-first Python-Rust editorial compression"
          git push origin HEAD:engineering/editorial-compression-20260902
