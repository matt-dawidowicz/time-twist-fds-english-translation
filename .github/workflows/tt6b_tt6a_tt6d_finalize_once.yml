name: TT6B TT6A TT6D finalize once

on:
  push:
    branches: [translation-quality-comparison-audit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Apply TT6B source-grounded revisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('work/translations/TT6B.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          replacements = {
              'TT6B/g0/r1': ('He knows no donkey pain.', 'He knows no donkey woes.'),
              'TT6B/g0/r9': ("A donkey's life is hard.", "A donkey's life is sad."),
              'TT6B/g0/r15': ('Joseph: What is it?', 'Joseph: Kashim, what?!'),
              'TT6B/g1/r30': ('{CTRL:0}{CTRL:0}What fruit did Eve eat?', '{CTRL:0}{CTRL:0}What did Eve eat?'),
              'TT6B/g2/r28': ('Mare: You noticed? This{CTRL:0}cut is hot in town.', 'Mare: You noticed? This{CTRL:0}cut is hot in Jerusalem.'),
          }
          for key, (old, new) in replacements.items():
              if data.get(key) != old:
                  raise SystemExit(f'{key}: expected source text not found: {data.get(key)!r}')
              data[key] = new
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          existing = {item['id'] for item in audit['changes']}
          additions = [
              {
                  'id': 'TT6B/g0/r1',
                  'japanese': 'ろばのきも しらないで……',
                  'previous_english': 'He knows no donkey pain.',
                  'new_english': 'He knows no donkey woes.',
                  'category': ['naturalness', 'fidelity', 'character_voice'],
                  'reason': 'Render ろばのきも as the donkey\'s feelings/plight rather than the unnatural and overly narrow donkey pain, while retaining the comic animal voice.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': 0,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
              {
                  'id': 'TT6B/g0/r9',
                  'japanese': 'ろばのじんせいって かなしい……',
                  'previous_english': "A donkey's life is hard.",
                  'new_english': "A donkey's life is sad.",
                  'category': ['emotional_fidelity', 'word_choice'],
                  'reason': 'Restore かなしい as sad rather than changing the donkey\'s emotional complaint into the broader hard.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': -1,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
              {
                  'id': 'TT6B/g0/r15',
                  'japanese': 'よせふ「どうした！ かしむ…」',
                  'previous_english': 'Joseph: What is it?',
                  'new_english': 'Joseph: Kashim, what?!',
                  'category': ['omitted_detail', 'addressee_specificity', 'character_context'],
                  'reason': 'Restore Joseph explicitly addressing Kashim, which the current translation omits.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': 3,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
              {
                  'id': 'TT6B/g1/r30',
                  'japanese': '{CTRL:0}{CTRL:0}へびにそそのかされ えばが くちにしたものは！',
                  'previous_english': '{CTRL:0}{CTRL:0}What fruit did Eve eat?',
                  'new_english': '{CTRL:0}{CTRL:0}What did Eve eat?',
                  'category': ['fidelity', 'unsupported_specificity', 'quiz_wording'],
                  'reason': 'Remove fruit, a category the Japanese does not state; the source simply asks what Eve ate after the serpent tempted her.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': -6,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
              {
                  'id': 'TT6B/g2/r28',
                  'japanese': 'めすうま「あら わかる！ これ… えるされむで{CTRL:0} はやりの かっとなのよ ふふふ…」',
                  'previous_english': 'Mare: You noticed? This{CTRL:0}cut is hot in town.',
                  'new_english': 'Mare: You noticed? This{CTRL:0}cut is hot in Jerusalem.',
                  'category': ['omitted_detail', 'location_specificity', 'character_voice'],
                  'reason': 'Restore the explicit Jerusalem reference in the mare\'s joke about her fashionable haircut.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': 5,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
          ]
          for item in additions:
              if item['id'] not in existing:
                  audit['changes'].append(item)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Measure live translation fit
        run: python -m unittest work.tests.test_live_translation_fit 2>&1 | tee /tmp/review_fit.txt
      - name: Synchronize completed bank reviews
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('work/audits/external_translation_baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          summary = baseline['scenario_summary']
          summary['tt6b_full_source_review_complete'] = True
          summary['tt6b_source_records_reviewed'] = 94
          summary['tt6b_audited_revisions'] = 5
          summary['tt6a_full_source_review_complete'] = True
          summary['tt6a_source_records_reviewed'] = 100
          summary['tt6a_audited_revisions'] = 0
          summary['tt6d_full_source_review_complete'] = True
          summary['tt6d_source_records_reviewed'] = 8
          summary['tt6d_audited_revisions'] = 0
          summary['scenario_source_records_fully_reviewed'] = 917
          summary['scenario_banks_fully_reviewed'] = [
              'TT3A', 'TT3B', 'TT1B', 'TT1A', 'TT2', 'T22',
              'TT6C', 'TT6B', 'TT6A', 'TT6D'
          ]

          fit_text = Path('/tmp/review_fit.txt').read_text(encoding='utf-8')
          live = baseline['current_live_fit']
          for bank in ('TT6B', 'TT6A', 'TT6D'):
              match = re.search(rf'FIT {bank}: (\d+)/(\d+) \((\d+) bytes free;', fit_text)
              if not match:
                  raise SystemExit(f'{bank} fit line not found')
              used, capacity, free = map(int, match.groups())
              for item in live['banks']:
                  if item['bank'] == bank:
                      item.update(used=used, capacity=capacity, free=free)
                      break
              else:
                  raise SystemExit(f'{bank} bank row missing')
              live[f'{bank.lower()}_free_after_full_review'] = free
          live['measurement'] = 'canonical test_live_translation_fit.py after completed source review through TT6D'

          baseline['pending'] = [
              'complete external NOV2/NOV4 system-text alignment without assuming source offsets',
              'review fixed-label differences against Japanese and gameplay context',
              'review TT4 source-grounded scenario text next, then continue bank by bank',
              'perform final rebuilt-ROM and emulator validation after editorial review'
          ]
          path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify Python style
        run: |
          python -m black --check work
          python -m ruff check work
      - name: Run unit suite
        run: python work/run_tests.py unit
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/tt6b_tt6a_tt6d_finalize_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete TT6B TT6A and TT6D source reviews"
          git push origin HEAD:translation-quality-comparison-audit
