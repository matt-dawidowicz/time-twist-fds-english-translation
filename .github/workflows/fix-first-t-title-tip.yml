name: fix-first-t-title-tip

on:
  push:
    branches: [fix-first-t-title-tip]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-first-t-title-tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Apply reviewed four-pixel correction and lock expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "work/rebuild_native_title_asset.py",
              "    # Remove the lone pink cell at the first T's upper-right tip.\n    (64, 30): 3,\n",
              "    # Clean the first T's upper-right tip: the three-cell dark corner belongs\n    # to the white cap, while the enclosed pink cell is the dark inner bevel.\n    (63, 29): 1,\n    (64, 29): 1,\n    (64, 30): 1,\n    (63, 30): 3,\n",
          )

          test = Path("work/tests/test_title_opening_assets.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              "27EE6BA45E19778B80EBBEACEEDC763EF896CE6A0A942D0C080114AB2C02B208",
              "FB7AECF3D2D9349E818CF7A020CD3A6EEF2FFF4F401B69EFDC95312C0C4ED99F",
          ).replace(
              "B1F262770FB490E2A933B956D5857432C101EE378A0F765CCCFACD8EE5FBF9A8",
              "7792CEA1488CE2ABDEC3A2301958A8264E5EAFE17491DD1509C53D0D68E5B4FF",
          ).replace(
              "self.assertEqual(sum(white_mask), 1836)",
              "self.assertEqual(sum(white_mask), 1839)",
          ).replace(
              "DCBAA57C8A6E9BA21F2CAD7010BE6FAE56EE75DB80F1FD2014C131CFFC86A9EB",
              "587E39604F5E8B56E15C63E76DABE644B680D9E8871693BC329F03024BA4CF96",
          ).replace(
              '"00WWWWWDDW",',
              '"00WWWWWWWW",',
          )
          needle = "        self.assertNotEqual(final.tobytes(), slide.tobytes())\n\n    def test_checked_in_asset_files_are_locked"
          insertion = """        self.assertNotEqual(final.tobytes(), slide.tobytes())

    def test_first_t_upper_right_tip_is_pixel_locked(self) -> None:
        \"\"\"Keep the corrected white cap and dark inner bevel on the first T.\"\"\"
        with Image.open(FINAL) as source:
            final = source.copy()
        self.assertEqual(final.getpixel((63, 29)), 1)
        self.assertEqual(final.getpixel((64, 29)), 1)
        self.assertEqual(final.getpixel((64, 30)), 1)
        self.assertEqual(final.getpixel((63, 30)), 3)

    def test_checked_in_asset_files_are_locked"""
          if text.count(needle) != 1:
              raise SystemExit("title test insertion point changed")
          test.write_text(text.replace(needle, insertion), encoding="utf-8")

          integration = Path("work/integration_tests/test_title.py")
          text = integration.read_text(encoding="utf-8").replace(
              "B1F262770FB490E2A933B956D5857432C101EE378A0F765CCCFACD8EE5FBF9A8",
              "7792CEA1488CE2ABDEC3A2301958A8264E5EAFE17491DD1509C53D0D68E5B4FF",
          ).replace(
              "27EE6BA45E19778B80EBBEACEEDC763EF896CE6A0A942D0C080114AB2C02B208",
              "FB7AECF3D2D9349E818CF7A020CD3A6EEF2FFF4F401B69EFDC95312C0C4ED99F",
          )
          integration.write_text(text, encoding="utf-8")

          replace_once(
              "docs/TITLE_SEQUENCE.md",
              "27EE6BA45E19778B80EBBEACEEDC763EF896CE6A0A942D0C080114AB2C02B208",
              "FB7AECF3D2D9349E818CF7A020CD3A6EEF2FFF4F401B69EFDC95312C0C4ED99F",
          )
          replace_once(
              "work/title_assets/README.md",
              "The first T's upper cap receives one reviewed color correction,",
              "The first T's upper-right cap uses a reviewed four-pixel correction,",
          )
          replace_once(
              "docs/BUG_FIXES_AND_TITLE_IMPLEMENTATION.md",
              "The first T's upper cap remains exact to the GIF authority.",
              "The first T's upper-right cap uses a reviewed four-pixel correction to restore the white cap and dark inner bevel.",
          )
          PY
      - name: Regenerate title authority and release lock
        run: |
          python work/rebuild_native_title_asset.py
          PYTHONPATH=work python -m time_twist.cli release-lock --update
      - name: Verify title regression suite
        run: PYTHONPATH=work python -m unittest discover -s work/tests -p 'test_title_opening_assets.py' -v
      - name: Commit corrected source and regenerated asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-first-t-title-tip.yml
          git add work/rebuild_native_title_asset.py work/tests/test_title_opening_assets.py work/integration_tests/test_title.py work/title_assets/'Time Twist approved native title.png' work/title_assets/'Time Twist approved native slide.png' work/release_sources.json work/title_assets/README.md docs/TITLE_SEQUENCE.md docs/BUG_FIXES_AND_TITLE_IMPLEMENTATION.md
          git commit -m "Fix first T title tip pixels"
          git push origin HEAD:fix-first-t-title-tip
