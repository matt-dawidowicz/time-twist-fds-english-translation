name: tt6a-intent-restoration

on:
  push:
    branches:
      - engineering/editorial-compression-20260902
    paths:
      - .github/workflows/tt6a-intent-restoration.yml

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore Joseph's full reviewed emotional sequence
        run: |
          python - <<'PY'
          from pathlib import Path

          record_id = 'TT6A/g0/r13'
          playable = (
              "Joseph: The truth is...{CTRL:0}"
              "My betrothed, Mary,{CTRL:0}"
              "seems to be with child.{CTRL:2}"
              "But I swear to God,{CTRL:0}"
              "I've never even held{CTRL:4}"
              "her hand!{CTRL:3}"
              "Mary says she has no{CTRL:0}"
              "idea how it happened...{CTRL:4}"
              "Could that possibly{CTRL:0}"
              "be true?{CTRL:3}"
              "Me: Hee-haw...{CTRL:3}"
              "Joseph: I can't believe{CTRL:0}"
              "in anything anymore!{CTRL:4}"
              "The engagement is off!"
          )

          path = Path('work/translations/TT6A.json')
          text = path.read_text(encoding='utf-8')
          old = (
              '  "TT6A/g0/r13": "Joseph: My fiancee Mary{CTRL:0}seems to be pregnant.'
              '{CTRL:2}I swear before God,{CTRL:0}I\'ve never even touched{CTRL:4}her hand!'
              '{CTRL:3}Says she has no idea...{CTRL:4}Can that be true?{CTRL:3}Me: Hee-haw...'
              '{CTRL:3}Joseph: Nothing\'s true!{CTRL:4}The engagement is off!",'
          )
          new = f'  "{record_id}": "{playable}",'
          assert text.count(old) == 1, 'unexpected TT6A/g0/r13 playable state'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('work/time_twist/scenario_validation.py')
          text = path.read_text(encoding='utf-8')
          if f'"{record_id}"' not in text:
              anchor = '        "TT1B/g2/r5",\n'
              assert text.count(anchor) == 1
              addition = (
                  anchor
                  + '        # Joseph explains Mary\'s pregnancy, his disbelief, and the breakup.\n'
                  + '        # Preserve the full emotional sequence across additional safe rows.\n'
                  + f'        "{record_id}",\n'
              )
              text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('work/generate_translation_workbook.py')
          text = path.read_text(encoding='utf-8')

          # Extend the restored-intent registry without depending on formatting.
          marker = 'INTENT_RESTORED_IDS = frozenset(\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n)', start)
          body = text[start:end]
          if f'"{record_id}"' not in body:
              closing = body.rfind('}')
              assert closing >= 0
              before = body[:closing].rstrip()
              if not before.endswith(','):
                  before += ','
              body = before + f' "{record_id}"' + body[closing:]
              text = text[:start] + body + text[end:]

          # Replace the reviewed natural override by its source-faithful target.
          key = '    "TT6A/g0/r13": ('
          block_start = text.index(key)
          block_end = text.index('\n    ),', block_start) + len('\n    ),')
          natural_block = '''    "TT6A/g0/r13": (
        "Joseph: The truth is… My betrothed, Mary, seems to be with child. "
        "But I swear to God, I've never even held her hand! Mary says she has "
        "no idea how it happened… Could that possibly be true? / Protagonist: "
        "Hee-haw… / Joseph: I can't believe in anything anymore! The engagement "
        "is off!"
    ),'''
          text = text[:block_start] + natural_block + text[block_end:]

          path.write_text(text, encoding='utf-8')

          path = Path('work/audits/TT6A_voice_and_prose_pilot.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Character/register decisions\n'
          addition = '''## Intent-restoration pass — 2026-09-03

`TT6A/g0/r13` was the last whole-game intent-audit record that could be resolved
from the textual evidence without new gameplay staging. The playable line now
restores Joseph's complete emotional sequence: “The truth is…,” Mary as his
betrothed, his oath that he has never even held her hand, Mary's claim that she
has no idea how the pregnancy happened, his incredulous question, and his
collapse into “I can't believe in anything anymore!” before ending the
engagement.

The rewrite deliberately keeps Joseph colloquial and emotionally volatile rather
than introducing Biblical grandeur. Additional `CTRL:0` values are presentation
rows only; all original controls remain in order. Every new visible segment is
at or below the 23-character practical display target. The new row contexts
remain runtime-playtest gates before release promotion.

'''
          if '## Intent-restoration pass — 2026-09-03' not in text:
              assert marker in text
              text = text.replace(marker, addition + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and regenerate review corpus
        run: |
          python -m black work/time_twist/scenario_validation.py work/generate_translation_workbook.py
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Require no remaining textually actionable whole-game gaps
        run: |
          python work/tools/translation_intent_audit.py --project-root . --json > /tmp/whole-game-intent.json
          python - <<'PY'
          import json
          from pathlib import Path

          gaps = json.loads(Path('/tmp/whole-game-intent.json').read_text())
          actionable = [row for row in gaps if not row['runtime_evidence_required']]
          assert actionable == [], actionable
          print('remaining runtime/staging-only records:', len(gaps))
          for row in gaps:
              print(row['record_id'], row['reasons'])
          PY
      - name: Validate Python source and live fit
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy
          python work/run_tests.py unit
      - name: Build and validate Rust optimizer
        run: |
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check --manifest-path native/compression_optimizer/Cargo.toml
          cargo test --manifest-path native/compression_optimizer/Cargo.toml
          cargo build --release --manifest-path native/compression_optimizer/Cargo.toml
          TIME_TWIST_NATIVE_OPTIMIZER="$PWD/native/compression_optimizer/target/release/time-twist-compression-optimizer" \
            python -m unittest discover -s work/tests -p 'test_compression_native.py'
      - name: Measure TT6A restored headroom
        env:
          TIME_TWIST_NATIVE_OPTIMIZER: ${{ github.workspace }}/native/compression_optimizer/target/release/time-twist-compression-optimizer
        run: |
          python work/tools/compression_headroom.py --project-root . --bank TT6A --backend native --json | tee /tmp/tt6a-headroom.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/tt6a-headroom.json').read_text())[0]
          assert result['optimized_packed_bytes'] <= result['capacity_bytes'], result
          print('TT6A optimized headroom:', result['optimized_headroom_bytes'])
          PY
      - name: Refresh whole-game queue and remove temporary workflow
        run: |
          python work/tools/translation_intent_audit.py --project-root . > work/audits/whole_game_intent_gap_queue.md
          python work/tools/translation_intent_audit.py --project-root . --json > work/audits/whole_game_intent_gap_queue.json
          rm .github/workflows/tt6a-intent-restoration.yml
          rm -rf work/__pycache__ work/time_twist/__pycache__ work/tests/__pycache__ work/time_twist_fds_tools.egg-info native/compression_optimizer/target
      - name: Commit verified whole-game text completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve final actionable whole-game intent gap"
          git push origin HEAD:engineering/editorial-compression-20260902
