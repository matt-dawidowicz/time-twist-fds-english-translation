name: Final scenario review once

on:
  push:
    branches: [translation-quality-comparison-audit]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Apply final scenario source-grounded revisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tt5_path = Path('work/translations/TT5.json')
          tt5 = json.loads(tt5_path.read_text(encoding='utf-8'))
          tt5_replacements = {
              'TT5/g2/r12': (
                  'Which unit fought tribes{CTRL:0}to guard white settlers?',
                  'Which unit fought{CTRL:0}Indians to guard whites?',
              ),
              'TT5/g2/r23': (
                  'Tom: Exactly 1,000.{CTRL:0}Buy 50 total: cows,{CTRL:0}sheep, and pigs. Spend{CTRL:6}Cows: 120 dollars each.{CTRL:3}Sheep: 30 dollars each.{CTRL:3}Pigs: 5 dollars each.{CTRL:3}How many of each?',
                  'Tom: Exactly 1,000.{CTRL:0}Buy 50 total: cows,{CTRL:0}sheep and pigs. Prices:{CTRL:6}Cows: 120 dollars each.{CTRL:3}Sheep: 30 dollars each.{CTRL:3}Pigs: 5 dollars each.{CTRL:3}How many of each?',
              ),
          }
          for key, (old, new) in tt5_replacements.items():
              if tt5.get(key) != old:
                  raise SystemExit(f'{key}: expected source text not found: {tt5.get(key)!r}')
              tt5[key] = new
          tt5_path.write_text(json.dumps(tt5, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          t25_path = Path('work/translations/T25.json')
          t25 = json.loads(t25_path.read_text(encoding='utf-8'))
          old_t25 = 'Lincoln: Such cruelty...{CTRL:1}Meyer: A grave problem.{CTRL:0}Deep bias still lingers{CTRL:0}in the South.{CTRL:3}Lincoln: With men like{CTRL:4}you, no war would start.'
          new_t25 = 'Lincoln: Such cruelty...{CTRL:1}Meyer: A grave problem.{CTRL:0}Deep prejudice lingers{CTRL:0}in the South.{CTRL:3}Lincoln: With men like{CTRL:4}you, no war would start.'
          if t25.get('T25/g0/r12') != old_t25:
              raise SystemExit(f"T25/g0/r12: expected source text not found: {t25.get('T25/g0/r12')!r}")
          t25['T25/g0/r12'] = new_t25
          t25_path.write_text(json.dumps(t25, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = Path('work/audits/translation_quality_changes.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          existing = {item['id'] for item in audit['changes']}
          additions = [
              {
                  'id': 'TT5/g2/r12',
                  'japanese': 'せいぶで いんでぃあんからはくじんを{CTRL:0}まもるため たたかったぐんたいは！',
                  'previous_english': 'Which unit fought tribes{CTRL:0}to guard white settlers?',
                  'new_english': 'Which unit fought{CTRL:0}Indians to guard whites?',
                  'category': ['historical_diction', 'source_specificity', 'unsanitized_source'],
                  'reason': 'Restore the source\'s explicit historical terms: it asks which military unit fought Indians to protect white people, rather than substituting tribes and settlers.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': -7,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
              {
                  'id': 'TT5/g2/r23',
                  'japanese': 'とむ「1000どるぴったしで{CTRL:0} うし ひつじ ぶたを50ぴきかってこいと{CTRL:0} いわれただ{CTRL:6} うしは1ぴき120どる{CTRL:3} ひつじは1ぴき30どる{CTRL:3} ぶたは1ぴき5どる かかる{CTRL:3} いったい なんびきずつかえばええんかのー」',
                  'previous_english': 'Tom: Exactly 1,000.{CTRL:0}Buy 50 total: cows,{CTRL:0}sheep, and pigs. Spend{CTRL:6}Cows: 120 dollars each.{CTRL:3}Sheep: 30 dollars each.{CTRL:3}Pigs: 5 dollars each.{CTRL:3}How many of each?',
                  'new_english': 'Tom: Exactly 1,000.{CTRL:0}Buy 50 total: cows,{CTRL:0}sheep and pigs. Prices:{CTRL:6}Cows: 120 dollars each.{CTRL:3}Sheep: 30 dollars each.{CTRL:3}Pigs: 5 dollars each.{CTRL:3}How many of each?',
                  'category': ['naturalness', 'instruction_clarity', 'quiz_wording'],
                  'reason': 'Repair the dangling Spend fragment and introduce the per-animal price list cleanly without changing the arithmetic or control structure.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': 0,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
              {
                  'id': 'T25/g0/r12',
                  'japanese': 'りんかーん「そうですか そんなひどいめに……」{CTRL:1}まいやー「まったく こまったものです{CTRL:0} なんぶにはまだまだ ねづよいさべついしきが{CTRL:0} のこっているようでして……」{CTRL:3}りんかーん「あなたみたいなかた ばかりなら{CTRL:4} せんそうはおきませんでしたよ まいやーさん」',
                  'previous_english': 'Lincoln: Such cruelty...{CTRL:1}Meyer: A grave problem.{CTRL:0}Deep bias still lingers{CTRL:0}in the South.{CTRL:3}Lincoln: With men like{CTRL:4}you, no war would start.',
                  'new_english': 'Lincoln: Such cruelty...{CTRL:1}Meyer: A grave problem.{CTRL:0}Deep prejudice lingers{CTRL:0}in the South.{CTRL:3}Lincoln: With men like{CTRL:4}you, no war would start.',
                  'category': ['historical_diction', 'source_specificity', 'racism_context'],
                  'reason': 'Render 差別意識 explicitly as prejudice/discriminatory attitudes rather than the softer and broader bias in Meyer\'s self-serving discussion of racism in the South.',
                  'external_difference_triggered_review': False,
                  'external_text_stored': False,
                  'presentation_controls_changed': False,
                  'visible_character_delta': -1,
                  'encoded_byte_delta': None,
                  'encoded_byte_delta_note': 'Measured at bank level after rebuild/compression; visible characters are not packed-byte cost.'
              },
          ]
          for item in additions:
              if item['id'] not in existing:
                  audit['changes'].append(item)
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
      - name: Measure live translation fit
        run: python -m unittest work.tests.test_live_translation_fit 2>&1 | tee /tmp/final_scenario_fit.txt
      - name: Synchronize final scenario review status
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('work/audits/external_translation_baseline.json')
          baseline = json.loads(path.read_text(encoding='utf-8'))
          summary = baseline['scenario_summary']
          summary['tt5_full_source_review_complete'] = True
          summary['tt5_source_records_reviewed'] = 123
          summary['tt5_audited_revisions'] = 2
          summary['t25_full_source_review_complete'] = True
          summary['t25_source_records_reviewed'] = 76
          summary['t25_audited_revisions'] = 1
          summary['scenario_source_records_fully_reviewed'] = 1299
          summary['scenario_full_source_review_complete'] = True
          summary['scenario_banks_fully_reviewed'] = [
              'TT3A', 'TT3B', 'TT1B', 'TT1A', 'TT2', 'T22',
              'TT6C', 'TT6B', 'TT6A', 'TT6D', 'TT4', 'TT5', 'T25'
          ]

          fit_text = Path('/tmp/final_scenario_fit.txt').read_text(encoding='utf-8')
          live = baseline['current_live_fit']
          for bank in ('TT5', 'T25'):
              match = re.search(rf'FIT {bank}: (\d+)/(\d+) \((\d+) bytes free;', fit_text)
              if not match:
                  raise SystemExit(f'{bank} fit line not found')
              used, capacity, free = map(int, match.groups())
              for item in live['banks']:
                  if item['bank'] == bank:
                      item.update(used=used, capacity=capacity, free=free)
                      break
              else:
                  raise SystemExit(f'{bank} bank row missing')
              live[f'{bank.lower()}_free_after_full_review'] = free
          live['measurement'] = 'canonical test_live_translation_fit.py after full 1,299-record scenario source review'

          baseline['pending'] = [
              'complete external NOV2/NOV4 system-text alignment without assuming source offsets',
              'review fixed-label differences against Japanese and gameplay context',
              'perform final rebuilt-ROM and emulator validation after editorial and fixed-UI review'
          ]
          path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify Python style
        run: |
          python -m black --check work
          python -m ruff check work
      - name: Run unit suite
        run: python work/run_tests.py unit
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/final_scenario_review_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete full scenario source review"
          git push origin HEAD:translation-quality-comparison-audit
