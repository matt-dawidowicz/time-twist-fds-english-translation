name: regenerate-review-artifacts-temp

on:
  push:
    branches:
      - fix/contextual-menu-localization-20260912

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python work/generate_bilingual_comparison_ci.py
      - run: python work/generate_translation_workbook.py
      - name: Commit regenerated review artifacts
        shell: bash
        run: |
          git add -- outputs work/translation_workbook_banks
          if git diff --cached --quiet; then
            echo "Generated review artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated translation review artifacts"
          git push
