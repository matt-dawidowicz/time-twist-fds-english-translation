name: reviewed fixed UI batch once

on:
  push:
    branches:
      - translation-quality-comparison-audit
    paths:
      - .github/workflows/fixed_ui_review_batch_once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Apply source-grounded fixed-label corrections
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          ui_path = Path("work/time_twist/ui_fixed_tables.py")
          text = ui_path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          assignments = {}
          for node in tree.body:
              if (
                  isinstance(node, ast.Assign)
                  and len(node.targets) == 1
                  and isinstance(node.targets[0], ast.Name)
              ):
                  assignments[node.targets[0].id] = node.value

          corrections = {
              "T22_FIXED_TEXT_RECORDS": {
                  7: ("Woman", "Women"),
                  12: ("Cell", "Cellar"),
                  15: ("Passage", "Push"),
                  18: ("Well", "Wall"),
                  20: ("Hill", "Hole"),
                  21: ("Jail", "Cell"),
                  32: ("Move", "Walk"),
              },
              "TT3A_FIXED_TEXT_RECORDS": {
                  16: ("Pass", "Push"),
                  27: ("Rub", "Clothes"),
                  62: ("Mita", "Saw it"),
              },
              "TT3B_FIXED_TEXT_RECORDS": {
                  17: ("Road", "Read"),
              },
              "TT6A_FIXED_TEXT_RECORDS": {
                  11: ("Soil", "Sleeve"),
              },
          }

          lines = text.splitlines()
          for table_name, table_changes in corrections.items():
              node = assignments[table_name]
              if not isinstance(node, ast.Tuple):
                  raise AssertionError(f"{table_name} is not a tuple")
              for index, (old, new) in table_changes.items():
                  actual = ast.literal_eval(node.elts[index])
                  if actual != old:
                      raise AssertionError(
                          f"{table_name}[{index}] expected {old!r}, found {actual!r}"
                      )
                  line_index = node.elts[index].lineno - 1
                  original_line = lines[line_index]
                  indent = original_line[: len(original_line) - len(original_line.lstrip())]
                  lines[line_index] = f'{indent}"{new}",'

          ui_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          audit_path = Path("work/audits/translation_quality_changes.json")
          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          entries = [
              {
                  "id": "T22/fixed/r7",
                  "japanese": "おんなたち",
                  "previous_english": "Woman",
                  "new_english": "Women",
                  "category": ["fixed_ui", "meaning_correction"],
                  "reason": "Restore the explicit plural women rather than presenting the group as a single woman.",
              },
              {
                  "id": "T22/fixed/r12",
                  "japanese": "ちかしつ",
                  "previous_english": "Cell",
                  "new_english": "Cellar",
                  "category": ["fixed_ui", "meaning_correction"],
                  "reason": "Restore the basement/cellar location and keep it distinct from the separate prison-cell label.",
              },
              {
                  "id": "T22/fixed/r15",
                  "japanese": "おす",
                  "previous_english": "Passage",
                  "new_english": "Push",
                  "category": ["fixed_ui", "meaning_correction", "action_clarity"],
                  "reason": "Restore the push action; Passage changes a verb into an unrelated location noun.",
              },
              {
                  "id": "T22/fixed/r18",
                  "japanese": "かべ",
                  "previous_english": "Well",
                  "new_english": "Wall",
                  "category": ["fixed_ui", "meaning_correction"],
                  "reason": "Correct wall; Well is an unrelated object caused by a one-letter English error.",
              },
              {
                  "id": "T22/fixed/r20",
                  "japanese": "あな",
                  "previous_english": "Hill",
                  "new_english": "Hole",
                  "category": ["fixed_ui", "meaning_correction"],
                  "reason": "Correct the selectable hole/opening object; Hill is unrelated to the Japanese.",
              },
              {
                  "id": "T22/fixed/r21",
                  "japanese": "ろうや",
                  "previous_english": "Jail",
                  "new_english": "Cell",
                  "category": ["fixed_ui", "meaning_correction", "object_distinction"],
                  "reason": "Restore the individual prison cell and keep it distinct from the broader prison/jail location.",
              },
              {
                  "id": "T22/fixed/r32",
                  "japanese": "あるく",
                  "previous_english": "Move",
                  "new_english": "Walk",
                  "category": ["fixed_ui", "meaning_correction", "action_clarity"],
                  "reason": "Restore the specific walk action instead of collapsing it into the separate generic Move command.",
              },
              {
                  "id": "TT3A/fixed/r16",
                  "japanese": "おす",
                  "previous_english": "Pass",
                  "new_english": "Push",
                  "category": ["fixed_ui", "meaning_correction", "action_clarity"],
                  "reason": "Restore the push action; Pass is a different action and can mislead the interaction menu.",
              },
              {
                  "id": "TT3A/fixed/r27",
                  "japanese": "ふく",
                  "previous_english": "Rub",
                  "new_english": "Clothes",
                  "category": ["fixed_ui", "meaning_correction", "object_distinction"],
                  "reason": "Restore the clothes object; Rub incorrectly turns the noun into an unrelated action.",
              },
              {
                  "id": "TT3A/fixed/r62",
                  "japanese": "みた",
                  "previous_english": "Mita",
                  "new_english": "Saw it",
                  "category": ["fixed_ui", "meaning_correction", "translation_completeness"],
                  "reason": "Translate the response as Saw it rather than leaving an untranslated-looking romanization.",
              },
              {
                  "id": "TT3B/fixed/r17",
                  "japanese": "よむ",
                  "previous_english": "Road",
                  "new_english": "Read",
                  "category": ["fixed_ui", "meaning_correction", "action_clarity"],
                  "reason": "Correct the read action; Road is an unrelated noun and the chapter requires reading the charm text.",
              },
              {
                  "id": "TT6A/fixed/r11",
                  "japanese": "そで",
                  "previous_english": "Soil",
                  "new_english": "Sleeve",
                  "category": ["fixed_ui", "meaning_correction", "object_distinction"],
                  "reason": "Correct the clothing part Sleeve; Soil is an unrelated noun.",
              },
          ]
          existing_ids = {entry["id"] for entry in audit["changes"]}
          for entry in entries:
              if entry["id"] in existing_ids:
                  raise AssertionError(f"duplicate audit ID: {entry['id']}")
              entry.update(
                  {
                      "external_difference_triggered_review": True,
                      "external_text_stored": False,
                      "presentation_controls_changed": False,
                      "visible_character_delta": len(entry["new_english"])
                      - len(entry["previous_english"]),
                      "encoded_byte_delta": None,
                      "encoded_byte_delta_note": "Each fixed-address record must retain its original packed slot size; validated by the fixed-table build/test path.",
                  }
              )
              audit["changes"].append(entry)
          audit_path.write_text(
              json.dumps(audit, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          baseline_path = Path("work/audits/external_translation_baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          fixed = baseline["fixed_ui_progress"]
          fixed.update(
              {
                  "source_records_reviewed": 332,
                  "source_reviewed_banks": [
                      "TT1A",
                      "TT1B",
                      "TT2",
                      "T22",
                      "TT3A",
                      "TT3B",
                      "TT6A",
                  ],
                  "tt1a_source_reviewed_records": 19,
                  "tt1a_source_review_revisions": 0,
                  "tt1b_source_reviewed_records": 53,
                  "tt1b_source_review_revisions": 0,
                  "tt2_source_reviewed_records": 70,
                  "tt2_source_review_revisions": 12,
                  "t22_source_reviewed_records": 33,
                  "t22_source_review_revisions": 7,
                  "tt3a_source_reviewed_records": 95,
                  "tt3a_source_review_revisions": 3,
                  "tt3b_source_reviewed_records": 21,
                  "tt3b_source_review_revisions": 1,
                  "tt6a_source_reviewed_records": 41,
                  "tt6a_source_review_revisions": 1,
              }
          )
          baseline_path.write_text(
              json.dumps(baseline, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          md_path = Path("work/audits/external_translation_baseline.md")
          md = md_path.read_text(encoding="utf-8")
          anchor = (
              "Differences remain diagnostic\n"
              "only and must be resolved from Japanese and gameplay context.\n"
          )
          review_note = (
              "\nSource-grounded fixed-UI review is now **332/740 records (44.9%)**. "
              "TT1A (19), TT1B (53), TT2 (70), T22 (33), TT3A (95), TT3B (21), "
              "and TT6A (41) have been reread against Japanese. Confirmed corrections "
              "are recorded individually in `translation_quality_changes.json`; alternate "
              "but functionally faithful compact labels are left unchanged.\n"
          )
          if review_note.strip() not in md:
              if anchor not in md:
                  raise AssertionError("fixed-UI markdown anchor not found")
              md = md.replace(anchor, anchor + review_note, 1)
          md = md.replace(
              "- Review the 347 differing aligned fixed labels against Japanese and gameplay\n"
              "  context before changing any wording.\n",
              "- Finish source-grounded review of the remaining 408/740 fixed-UI records,\n"
              "  changing only labels that Japanese and gameplay context prove incorrect.\n",
              1,
          )
          md = md.replace(
              "- Continue the full source-grounded scenario review with TT3B, then proceed bank\n"
              "  by bank.\n",
              "",
              1,
          )
          md_path.write_text(md, encoding="utf-8")
          PY

      - name: Regenerate review artifacts
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py

      - name: Run fixed-table tests
        run: python -m unittest discover -s work/tests -p 'test_ui_fixed_tables.py' -v

      - name: Measure live bank fit
        run: python -m unittest discover -s work/tests -p 'test_live_translation_fit.py' -v

      - name: Refresh packed-headroom audit
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("work").resolve()))
          sys.path.insert(0, str(Path("work/tests").resolve()))

          from generate_translation_workbook import PATCH_FOOTPRINT_RESULTS
          from test_live_translation_fit import measure_translation_footprint
          from time_twist.capacity import playable_capacity

          baseline_path = Path("work/audits/external_translation_baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          rows = baseline["current_live_fit"]["banks"]
          for row in rows:
              bank = row["bank"]
              capacity = playable_capacity(bank, PATCH_FOOTPRINT_RESULTS[bank]["capacity"])
              used = measure_translation_footprint(bank)
              row.update({"used": used, "capacity": capacity, "free": capacity - used})
          baseline["current_live_fit"]["measurement"] = (
              "canonical test_live_translation_fit.py after 1,299/1,299 scenario review "
              "and 332/740 fixed-UI source review"
          )
          baseline_path.write_text(
              json.dumps(baseline, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          md_path = Path("work/audits/external_translation_baseline.md")
          md = md_path.read_text(encoding="utf-8")
          start = md.index("## Current packed headroom\n")
          end = md.index("## Current editorial findings\n")
          table = [
              "## Current packed headroom",
              "",
              "The canonical `test_live_translation_fit.py` measurement after the complete",
              "1,299-record scenario review and the first 332 fixed-UI source reviews gives:",
              "",
              "| Bank | Used | Capacity | Free |",
              "| --- | ---: | ---: | ---: |",
          ]
          for row in rows:
              table.append(
                  f"| {row['bank']} | {row['used']} | {row['capacity']} | {row['free']} |"
              )
          table.extend(
              [
                  "",
                  "These are compressed byte limits used by the build, not visible-character counts.",
                  "Faithful wording is retained unless the measured bank capacity proves that a shorter",
                  "form is technically necessary.",
                  "",
              ]
          )
          md = md[:start] + "\n".join(table) + "\n" + md[end:]
          md_path.write_text(md, encoding="utf-8")
          PY

      - name: Verify generated artifacts are stable
        run: |
          python work/generate_bilingual_comparison_ci.py
          python work/generate_translation_workbook.py
          git diff --exit-code -- outputs work/translation_workbook_banks

      - name: Verify style
        run: |
          python -m black --check work
          python -m ruff check work
          python -m pydocstyle --convention=pep257 work
          python -m mypy

      - name: Run full unit suite
        run: python work/run_tests.py unit

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fixed_ui_review_batch_once.yml
          git add -A
          git commit -m "Correct reviewed fixed UI labels"
          git push
