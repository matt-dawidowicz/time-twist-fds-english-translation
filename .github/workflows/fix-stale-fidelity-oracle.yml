name: fix-stale-fidelity-oracle

on:
  push:
    branches:
      - fix/materialized-text-flow-audit-20260915
    paths:
      - .github/workflows/fix-stale-fidelity-oracle.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/materialized-text-flow-audit-20260915
          fetch-depth: 0
      - name: Replace obsolete depraved oracle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('work/tests/test_production_translation.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertIn("depraved{CTRL:6}The Church", t22["T22/g1/r7"])\n'
          new = '        self.assertIn("baptized by the{CTRL:6}Devil and enslaved to", t22["T22/g1/r7"])\n        self.assertIn("vile desire. The Church{CTRL:4}sentences her to death.", t22["T22/g1/r7"])\n'
          if old not in text:
              raise SystemExit('stale oracle line not found exactly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Verify focused test
        run: |
          python -m pip install -r requirements.txt
          time-twist-runtime smoke
      - name: Remove one-shot helper
        run: rm .github/workflows/fix-stale-fidelity-oracle.yml
      - name: Commit repair and cleanup
        run: |
          git config user.name 'starlight_world'
          git config user.email '43389528+matt-dawidowicz@users.noreply.github.com'
          git add work/tests/test_production_translation.py .github/workflows/fix-stale-fidelity-oracle.yml
          git commit -m 'Update semantic oracle for Jeanne source fidelity'
          git push origin HEAD:fix/materialized-text-flow-audit-20260915
