name: Temporary format Simon release

on:
  push:
    branches:
      - tmp/format-simon-release

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/simon-fix-public-patcher
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Format changed Python files
        run: >-
          python -m black
          work/tests/test_v38_canonical_build.py
          work/time_twist/v50_finalizer.py
          work/time_twist/release_metadata.py
      - name: Commit formatted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/tests/test_v38_canonical_build.py work/time_twist/v50_finalizer.py work/time_twist/release_metadata.py
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "Format Simon release changes"
            git push origin HEAD:release/simon-fix-public-patcher
          fi
