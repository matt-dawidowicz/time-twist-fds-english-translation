name: External fixed-segment tooling once

on:
  push:
    branches:
      - translation-quality-comparison-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: translation-quality-comparison-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add fixed-segment comparison support
        run: |
          python - <<'PY'
          from pathlib import Path

          tool_path = Path('work/tools/external_translation_compare.py')
          text = tool_path.read_text(encoding='utf-8')
          constant_marker = 'MAX_SYMBOLS_PER_RECORD = 4096\n\n'
          constant_block = '''MAX_SYMBOLS_PER_RECORD = 4096\n\n# Logical fixed-address records in the supplied external patch are frequently\n# stored as relocated 32-record pages. These offsets are relative to each\n# decoded bank file and contain structure only, never third-party prose.\nEXTERNAL_FIXED_SEGMENTS: dict[str, tuple[tuple[int, int], ...]] = {\n    "TT1B": ((0x1AC8, 32), (0x3542, 21)),\n    "TT2": ((0x3500, 32), (0x1BEE, 32), (0x3596, 6)),\n    "T22": ((0x0E14, 33),),\n    "TT3A": ((0x0A9E, 64), (0x0A04, 31)),\n    "TT3B": ((0x0AF4, 21),),\n    "TT4": ((0x21CE, 32), (0x2141, 32), (0x20A9, 32), (0x0E81, 1)),\n    "TT5": ((0x0B50, 32), (0x0AA5, 32), (0x0BDA, 32), (0x1B63, 17)),\n    "T25": ((0x098A, 32), (0x1281, 10)),\n    "TT6A": ((0x0547, 32), (0x0F28, 9)),\n    "TT6B": ((0x0580, 32), (0x0D4E, 30)),\n    "TT6C": ((0x176A, 32), (0x1643, 32), (0x16DB, 30)),\n}\n\n'''
          if constant_marker not in text:
              raise SystemExit('constant insertion marker missing')
          text = text.replace(constant_marker, constant_block, 1)

          function_marker = '''    return records, reader.byte_position\n\n\ndef decode_external_bank(\n'''
          function_block = '''    return records, reader.byte_position\n\n\ndef decode_external_fixed_segments(\n    data: bytes, segments: Iterable[tuple[int, int]]\n) -> list[list[Symbol]]:\n    """Decode relocated fixed-address segments in logical record order."""\n    segment_list = list(segments)\n    if not segment_list:\n        raise ValueError("at least one fixed-text segment is required")\n    records: list[list[Symbol]] = []\n    for offset, count in segment_list:\n        if count <= 0:\n            raise ValueError(f"fixed-text segment has invalid count: {count}")\n        decoded, _ = decode_fixed_records(data, offset, count)\n        records.extend(decoded)\n    return records\n\n\ndef decode_external_bank(\n'''
          if function_marker not in text:
              raise SystemExit('function insertion marker missing')
          text = text.replace(function_marker, function_block, 1)
          tool_path.write_text(text, encoding='utf-8')

          test_path = Path('work/tests/test_external_translation_compare.py')
          test = test_path.read_text(encoding='utf-8')
          import_old = '''from tools.external_translation_compare import (\n    overlay_sparse_payload,\n    patch_spans,\n)\n'''
          import_new = '''from tools.external_translation_compare import (\n    EXTERNAL_FIXED_SEGMENTS,\n    decode_external_fixed_segments,\n    overlay_sparse_payload,\n    patch_spans,\n    render_record,\n)\n'''
          if import_old not in test:
              raise SystemExit('test import marker missing')
          test = test.replace(import_old, import_new, 1)
          class_marker = '''    def test_patch_spans_merge_five_byte_gap(self) -> None:\n'''
          methods = '''    def test_external_fixed_segments_reassemble_logical_order(self) -> None:\n        """Concatenate physically separate external records in declared order."""\n        data = bytes([0x03, 0xE8, 0x00, 0x00, 0x07, 0xE8])\n        records = decode_external_fixed_segments(data, ((0, 1), (4, 1)))\n        self.assertEqual(\n            [render_record(record, []) for record in records], [" ", "e"]\n        )\n\n    def test_external_fixed_segment_counts_match_recovered_tables(self) -> None:\n        """Lock the independently recovered logical record counts per bank."""\n        expected = {\n            "TT1B": 53,\n            "TT2": 70,\n            "T22": 33,\n            "TT3A": 95,\n            "TT3B": 21,\n            "TT4": 97,\n            "TT5": 113,\n            "T25": 42,\n            "TT6A": 41,\n            "TT6B": 62,\n            "TT6C": 94,\n        }\n        actual = {\n            bank: sum(count for _, count in segments)\n            for bank, segments in EXTERNAL_FIXED_SEGMENTS.items()\n        }\n        self.assertEqual(actual, expected)\n        self.assertEqual(sum(actual.values()), 721)\n\n    def test_external_fixed_segments_reject_empty_layout(self) -> None:\n        """Require explicit structural evidence before decoding fixed text."""\n        with self.assertRaisesRegex(ValueError, "at least one fixed-text segment"):\n            decode_external_fixed_segments(b"x", ())\n\n    def test_external_fixed_segments_reject_nonpositive_counts(self) -> None:\n        """Reject segment declarations that cannot contain a real record."""\n        with self.assertRaisesRegex(ValueError, "invalid count"):\n            decode_external_fixed_segments(b"x", ((0, 0),))\n\n'''
          if class_marker not in test:
              raise SystemExit('test method insertion marker missing')
          test = test.replace(class_marker, methods + class_marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Format and validate comparison tooling
        run: |
          python -m black work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
          python -m ruff check work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
          python -m pydocstyle --convention=pep257 work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
          python -m mypy
          python -m unittest work.tests.test_external_translation_compare
          python work/run_tests.py unit
      - name: Commit tooling and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/external_fixed_segments_once.yml
          git add work/tools/external_translation_compare.py work/tests/test_external_translation_compare.py
          git commit -m 'Model relocated external fixed-text segments'
          git pull --rebase origin translation-quality-comparison-audit
          git push origin HEAD:translation-quality-comparison-audit
