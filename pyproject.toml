[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "time-twist-fds-tools"
version = "0.2.0"
description = "Reproducible FDS analysis and English translation build tools for Time Twist"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "black>=24.10,<27",
  "build>=1.2,<2",
  "pydocstyle>=6.3,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
time-twist = "time_twist.cli:main"

[tool.setuptools]
package-dir = {"" = "work"}
packages = ["time_twist"]
include-package-data = false

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
